<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Lộ trình Strata</title>
<style>
/* Astra: lộ trình là đường leo trên các lớp núi vẽ nét vàng lá (foil), giống ảnh nền chính của Strata.
   Lớp xa mờ, lớp gần đậm; sóng ngang dưới chân núi; sao nhỏ trên bầu trời haze. Trại nằm trên sống núi,
   cổng là mốc đá tam giác, đỉnh là bản phát hành. Một chuyển động: ánh sáng chạy dọc đoạn đã đi.
   Màu lấy từ token của viewer (page.css): tối là chính, sáng = teal + vàng. */
:root {
  --bg-0:#09080c; --bg:#100e14; --card:#15131a; --raised:#1b1922;
  --fg:#ebe5db; --muted:#a59d93; --faint:#7a7480; --line:#2a2630; --line-soft:#1d1a22;
  --gold-0:#7a5634; --gold:#d3a67c; --gold-3:#f0d6b4; --accent:var(--gold); --accent-soft:rgba(211,166,124,.14);
  --trail:#f0d6b4; --sheen:#fffaf0;
  --haze:radial-gradient(120% 70% at 75% -10%,#1e1b26 0%,#100e14 55%,#09080c 100%);
  --edge:linear-gradient(160deg,#f0d6b4,#c9966c 22%,transparent 50%,transparent 78%,#7a5634);
  --st-todo:#a59d93; --st-doing:#d9a24e; --st-done:#6fa595; --st-block:#c06464;
  --display:"Cormorant Garamond","EB Garamond","Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --body:"Segoe UI Variable Text","Segoe UI",Inter,system-ui,-apple-system,Roboto,"Noto Sans",sans-serif;
  --mono:"Cascadia Code","JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:6px; --r-lg:8px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg-0:#f6f2e8; --bg:#fbfaf5; --card:#ffffff; --raised:#ffffff;
  --fg:#294342; --muted:#55625f; --faint:#677371; --line:#e6dec9; --line-soft:#f1ebdc;
  --gold-0:#8a6410; --gold:#936b0d; --gold-3:#ac840d; --accent:#07807d; --accent-soft:rgba(7,128,125,.1);
  --trail:#07807d; --sheen:#e8c25a;
  --haze:radial-gradient(120% 70% at 75% -10%,#ffffff 0%,#fbfaf5 55%,#f6f2e8 100%);
  --edge:linear-gradient(160deg,#089a96,#07807d 22%,transparent 50%,transparent 78%,#ac840d);
  --st-todo:#55625f; --st-doing:#a8701c; --st-done:#15806a; --st-block:#cd3c35;
  color-scheme: light; } }
:root[data-theme="light"] {
  --bg-0:#f6f2e8; --bg:#fbfaf5; --card:#ffffff; --raised:#ffffff;
  --fg:#294342; --muted:#55625f; --faint:#677371; --line:#e6dec9; --line-soft:#f1ebdc;
  --gold-0:#8a6410; --gold:#936b0d; --gold-3:#ac840d; --accent:#07807d; --accent-soft:rgba(7,128,125,.1);
  --trail:#07807d; --sheen:#e8c25a;
  --haze:radial-gradient(120% 70% at 75% -10%,#ffffff 0%,#fbfaf5 55%,#f6f2e8 100%);
  --edge:linear-gradient(160deg,#089a96,#07807d 22%,transparent 50%,transparent 78%,#ac840d);
  --st-todo:#55625f; --st-doing:#a8701c; --st-done:#15806a; --st-block:#cd3c35;
  color-scheme: light; }

* { box-sizing: border-box; }
html { background: var(--bg-0); }
body { margin: 0; background: var(--haze), var(--bg-0); background-attachment: fixed; color: var(--fg); font: 15px/1.55 var(--body);
  padding-block: 28px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1140px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.cap { font: 600 10.5px/1.3 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--faint); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }

header { display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; align-items: flex-end; }
h1 { margin: 2px 0 0; font: 500 44px/1 var(--display); letter-spacing: .005em; color: var(--gold-3); text-wrap: balance; }
.meta { font: 12px/1.6 var(--mono); color: var(--muted); text-align: right; }

/* dải trạng thái */
.status { display: grid; grid-template-columns: 1.1fr 1fr; border: 1px solid var(--line); border-radius: var(--r-lg); background: color-mix(in srgb, var(--card) 70%, transparent); }
.status > div { padding: 18px 20px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.status > div + div { border-left: 1px solid var(--line); }
.status h2 { margin: 0; font: 500 28px/1.1 var(--display); text-wrap: balance; }
.big { font: 500 46px/1 var(--display); color: var(--gold-3); font-variant-numeric: lining-nums tabular-nums; }
.tag { font: 700 10.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 4px 7px; border: 1px solid currentColor; border-radius: 3px; white-space: nowrap; }
.tag.done { color: var(--st-done); } .tag.doing { color: var(--st-doing); } .tag.todo { color: var(--st-todo); }
.miss { margin: 2px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.miss li { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.miss li::before { content: "\25B3"; color: var(--st-doing); font-size: 11px; }
.miss .who { font: 11.5px var(--mono); color: var(--muted); }

/* bản đồ */
.mapbox { position: relative; border-radius: var(--r-lg); background: var(--haze); overflow: hidden; border: 1px solid var(--line); }
.mapbox .scroll { overflow-x: auto; }
svg.map { display: block; width: 100%; min-width: 680px; height: auto; color: var(--gold); }
.map .body { fill: var(--bg); stroke: currentColor; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.map .ln { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
.map .star { fill: currentColor; }
@media (prefers-reduced-motion: no-preference) {
  .map .sheen { animation: sheen 7s linear infinite; }
}
@keyframes sheen { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -1400; } }
.map .trail-todo { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-dasharray: 1.5 7; stroke-linecap: round; opacity: .9; }
.map .trail-done { fill: none; stroke: var(--trail); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.map .sheen { fill: none; stroke: var(--sheen); stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: 60 1340; opacity: .85; }
.map text { font-family: var(--mono); fill: var(--fg); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.map .sm { font-size: 9.5px; fill: var(--muted); letter-spacing: .12em; }
.map .nm { font: 600 15px var(--display); letter-spacing: .01em; }
.map .camp { cursor: pointer; }
.map .camp .dot { fill: var(--bg); stroke: currentColor; stroke-width: 1.4; }
.map .camp.done .dot { fill: var(--st-done); stroke: var(--st-done); }
.map .camp.doing .dot { fill: var(--bg); stroke: var(--st-doing); stroke-width: 2.2; }
.map .camp .n { font: 600 12px var(--mono); text-anchor: middle; stroke: none; fill: var(--fg); }
.map .camp.done .n { fill: var(--bg); }
.map .camp .ring { fill: none; stroke: currentColor; stroke-width: .8; stroke-dasharray: 2 3; opacity: 0; }
.map .camp.sel .ring { opacity: 1; }
.map .camp:hover .dot, .map .camp:focus-visible .dot { stroke-width: 2.4; }
.map .cairn { fill: var(--bg); stroke: currentColor; stroke-width: 1.4; stroke-linejoin: round; }
.map .cairn.done { fill: var(--st-done); stroke: var(--st-done); }
.map .cairn.open { stroke: var(--st-doing); stroke-width: 2.2; }
.map .gid { font-size: 10px; font-weight: 700; letter-spacing: .08em; fill: var(--muted); }
.map .gid.open { fill: var(--st-doing); }
.map .flag line { stroke: var(--trail); stroke-width: 1.4; }
.map .flag polygon { fill: var(--trail); }
.map .here { fill: var(--trail); font-size: 11px; font-weight: 700; letter-spacing: .14em; }
.map .summit { font: italic 500 17px var(--display); fill: var(--gold-3); letter-spacing: .02em; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 22px; padding: 10px 16px; border-top: 1px solid var(--line); font: 11px var(--mono); color: var(--muted); align-items: center; background: color-mix(in srgb, var(--bg) 60%, transparent); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.sw { width: 20px; height: 0; border-top: 2.5px solid var(--trail); }
.sw.d { border-top: 2px dotted var(--gold); }
.sw.t { width: 0; height: 0; border: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 10px solid var(--gold); }

/* chọn phase */
.rail { display: grid; grid-template-columns: repeat(5, 1fr); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.rail button { background: transparent; border: 0; text-align: left; padding: 11px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.rail button + button { border-left: 1px solid var(--line); }
.rail button:hover { background: var(--accent-soft); }
.rail button[aria-pressed="true"] { background: var(--accent-soft); box-shadow: inset 0 -2px 0 var(--gold); }
.rail .t { font: 500 17px/1.2 var(--display); overflow-wrap: anywhere; }
.rail .st-done { color: var(--st-done); } .rail .st-doing { color: var(--st-doing); }

/* chi tiết */
.detail { display: grid; grid-template-columns: 1fr 1.25fr; gap: 32px; align-items: start; }
.detail > section { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
h3 { margin: 0; font: 500 30px/1.1 var(--display); color: var(--gold-3); text-wrap: balance; }
h4 { margin: 6px 0 0; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.goal { margin: 0; max-width: 62ch; color: var(--fg); }
.blocks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.blocks li { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline; }
.blocks .bar { grid-column: 1 / -1; height: 2px; background: var(--line); position: relative; border-radius: 2px; }
.blocks .bar i { position: absolute; inset: 0 auto 0 0; background: var(--gold); border-radius: 2px; }
.blocks .bar i.dn { background: var(--st-done); }
.blocks .note { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); }
.grp { display: flex; flex-direction: column; }
.grp > .cap { margin: 12px 0 2px; color: var(--gold); }
.crit { display: grid; grid-template-columns: 1fr auto auto; gap: 2px 14px; padding: 8px 0; border-bottom: 1px solid var(--line-soft); align-items: baseline; }
.crit .what { min-width: 0; }
.crit .by { font: 11.5px var(--mono); color: var(--muted); }
.crit.miss-row .what { font-weight: 600; }
.gate-box { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; background: color-mix(in srgb, var(--card) 70%, transparent); }
.gate-box.open { border-color: color-mix(in srgb, var(--st-doing) 55%, var(--line)); }
details summary { cursor: pointer; font: 600 10.5px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); padding: 6px 0; border-top: 1px solid var(--line); }
.steps { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.steps li { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: baseline; }
.id { font: 12px var(--mono); color: var(--faint); }
.empty { margin: 0; color: var(--muted); font-style: italic; }
.off { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.off ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 26px; }

@media (max-width: 760px) {
  h1 { font-size: 34px; } .meta { text-align: left; }
  .status, .detail { grid-template-columns: 1fr; }
  .status > div + div { border-left: 0; border-top: 1px solid var(--line); }
  .rail { grid-template-columns: 1fr; }
  .rail button + button { border-left: 0; border-top: 1px solid var(--line); }
  .crit { grid-template-columns: 1fr auto; } .crit .what { grid-column: 1 / -1; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="cap">Lộ trình dự án</div><h1>Lộ trình Strata v1</h1></div>
    <div class="meta">5 phase · 5 cổng · đỉnh là bản phát hành</div>
  </header>
  <div class="status" id="status"></div>
  <div class="mapbox">
    <div class="scroll"><svg class="map" id="map" viewBox="0 0 1000 420" role="img" aria-label="Năm trại trên các lớp núi; năm trại là năm phase, đỉnh là bản phát hành"></svg></div>
    <div class="legend">
      <span><i class="sw"></i> đoạn đã đi</span>
      <span><i class="sw d"></i> đoạn chưa đi</span>
      <span>tròn = trại (phase)</span>
      <span><i class="sw t"></i> cổng, chỉ user cho qua</span>
      <span>nhấn vào trại để xem phase</span>
    </div>
  </div>
  <nav class="rail" id="rail" aria-label="Chọn phase"></nav>
  <div class="detail" id="detail"></div>
  <div class="off" id="off"></div>
</div>
<script>
const PHASES = [
  { n:1, name:"Skeleton", short:"Skeleton", state:"done", pct:100, elev:1120,
    goal:"Dựng khung chạy được: CLI, DB, viewer chỉ đọc, bố cục thư mục.",
    gate:{ id:"G1", state:"done", note:"Đã qua." },
    blocks:[{t:"Khung CLI + DB",d:4,of:4},{t:"Viewer chỉ đọc",d:2,of:2}], crit:null,
    steps:[["1.1","Khung CLI","done"],["1.2","Viewer chỉ đọc","done"]] },
  { n:2, name:"Tính năng liên quan, mức trình diễn", short:"Tính năng liên quan", state:"doing", pct:62, elev:1240,
    goal:"Các tính năng cốt lõi chạy liền mạch ở mức đủ để trình diễn cho user: bảng việc, MCP, trang Lộ trình, kịch bản demo.",
    gate:{ id:"G2", state:"open", note:"Chờ user cho qua." },
    blocks:[{t:"Viewer",d:3,of:4},{t:"CLI",done:true},{t:"Trang Lộ trình",d:1,of:3},{t:"MCP server",d:0,of:2,note:"Kéo về sớm từ phase 3"}],
    crit:[
      ["Tài liệu",[["How-to cho mỗi tác vụ chính (docs/how-to)","Reviewer",1,"đạt"],["Reference CLI/API từ --help/OpenAPI","Máy",1,"đạt"],["CHANGELOG có mục Unreleased","Máy",0,"chưa"]]],
      ["Kiểm thử",[["Mỗi tính năng có Given/When/Then + test","Reviewer",1,"đạt"],["Coverage khối lõi ≥70% (pytest --cov)","Máy",0,"64% · chưa"]]],
      ["Bảo mật",[["Đạt OWASP ASVS L1","Reviewer",0,"9/12 mục"]]],
      ["Vận hành",[["Log có cấu trúc + /health","Máy",1,"đạt"]]],
      ["Trình diễn",[["Kịch bản demo chạy lại được (make demo)","User",0,"chưa"]]]
    ],
    steps:[["2.1","Bảng việc","done"],["2.2","MCP đủ tool","done"],["2.3","Trang Lộ trình","doing"],["2.4","Demo với user","todo"]] },
  { n:3, name:"Gia cố bảo mật", short:"Gia cố bảo mật", state:"todo", pct:0, elev:1480,
    goal:"Đóng các lỗ hổng theo ASVS L1, siết xác thực và nhật ký truy cập trước khi mở cho người ngoài.",
    gate:{ id:"G3", state:"todo", note:"Chưa tới." }, blocks:[{t:"Xác thực",d:0,of:3},{t:"Nhật ký truy cập",d:0,of:2}], crit:null, steps:[] },
  { n:4, name:"Tính năng con, domain, staging", short:"Tính năng con + staging", state:"todo", pct:0, elev:1760,
    goal:"Hoàn thiện tính năng con, gắn domain riêng và chạy thử trên môi trường staging.",
    gate:{ id:"G4", state:"todo", note:"Chưa tới." }, blocks:[{t:"Domain + TLS",d:0,of:2},{t:"Staging",d:0,of:3}], crit:null, steps:[] },
  { n:5, name:"Deploy / phát hành", short:"Deploy / phát hành", state:"todo", pct:0, elev:2480,
    goal:"Đưa bản v1 lên production, có quy trình quay lui và ghi chú phát hành.",
    gate:{ id:"G5", state:"todo", note:"Đỉnh núi: bản phát hành." }, blocks:[{t:"Pipeline phát hành",d:0,of:3}], crit:null, steps:[] }
];
const OFF = [["#151","Lọc việc theo nhãn"],["#160","Xuất bảng việc ra CSV"],["#162","Chủ đề tối cho viewer"]];
const CUR = 2;
let sel = CUR;
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const lbl = { done:"xong", doing:"đang làm", todo:"sắp tới" };
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const P = { C1:[80,338], G1:[178,312], C2:[282,300], G2:[396,252], C3:[490,246], G3:[584,196], C4:[684,180], G4:[766,136], C5:[838,122], G5:[920,58] };
const ORDER = ["C1","G1","C2","G2","C3","G3","C4","G4","C5","G5"];
const FRAC = 0.62;
const here = [P.C2[0] + (P.G2[0]-P.C2[0])*FRAC, P.C2[1] + (P.G2[1]-P.C2[1])*FRAC];
function el(tag, attrs, parent, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
/* đường cong mượt qua các điểm (Catmull-Rom -> Bézier) */
function smooth(pts) {
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i-1] || pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2] || p2;
    const c1 = [p1[0] + (p2[0]-p0[0])/6, p1[1] + (p2[1]-p0[1])/6];
    const c2 = [p2[0] - (p3[0]-p1[0])/6, p2[1] - (p3[1]-p1[1])/6];
    d += ` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d;
}
/* sống núi xa: nhiều đỉnh nhọn, sinh bằng hàm */
function ridge(base, amp, seed, peaks) {
  const pts = [];
  for (let x = -20; x <= 1020; x += 10) {
    let y = base;
    peaks.forEach(([px, h, w]) => { y -= h * Math.max(0, 1 - Math.abs(x - px) / w); });
    y += amp * (Math.sin(x * .031 + seed) * .6 + Math.sin(x * .087 + seed * 2) * .3 + Math.sin(x * .19 + seed) * .12);
    pts.push([x, +y.toFixed(1)]);
  }
  return pts;
}
const lineD = pts => "M" + pts.map(p => p.join(" ")).join(" L");
let built = null;
function buildScene(s) {
  const g = el("g", {}, s);
  // sao
  let r = 7;
  const rnd = () => (r = (r * 9301 + 49297) % 233280) / 233280;
  const stars = el("g", { class:"stars" }, g);
  for (let i = 0; i < 46; i++) {
    const x = rnd() * 1000, y = rnd() * 150, big = rnd() > .85;
    el("circle", { class:"star", cx:x.toFixed(1), cy:y.toFixed(1), r: big ? 1.3 : .7, opacity: (big ? .8 : .35 + rnd() * .3).toFixed(2) }, stars);
  }
  // lớp núi xa -> gần
  const layers = [
    { pts: ridge(170, 10, 1.3, [[150,60,170],[470,95,190],[760,70,150]]), op:.28, w:.8 },
    { pts: ridge(225, 9, 2.7, [[60,40,140],[330,85,170],[620,105,200],[980,70,160]]), op:.45, w:.9 },
    { pts: ridge(285, 7, .4, [[220,50,160],[540,70,190],[870,55,150]]), op:.65, w:1 }
  ];
  layers.forEach(L => {
    const d = lineD(L.pts);
    el("path", { class:"body", d: d + " L1020 420 L-20 420 Z", "stroke-width":L.w, "stroke-opacity":L.op }, g);
    // nét sườn (hatch) song song dưới sống núi
    [10, 22].forEach((off, k) => el("path", { class:"ln", d: lineD(L.pts.map(([x,y]) => [x, y + off + Math.sin(x*.05)*2])), "stroke-width":.6, opacity:(L.op * (.45 - k*.18)).toFixed(2) }, g));
  });
  // sống núi chính: đường mòn chạy trên đó
  const main = [[-20,360], ...ORDER.map(k => P[k]), [975,96], [1020,130]];
  const md = smooth(main);
  el("path", { class:"body", d: md + " L1020 420 L-20 420 Z", "stroke-width":1.5 }, g);
  [12, 26, 44].forEach((off, k) => el("path", { class:"ln", d: smooth(main.map(([x,y]) => [x, y + off + (x > 900 ? (x-900)*.2 : 0)])), "stroke-width":.8, opacity:(.6 - k*.17).toFixed(2) }, g));
  // sóng ngang dưới chân núi
  [[372,1.3,.85],[388,1.05,.6],[402,.9,.4],[414,.8,.25]].forEach(([y0,w,o], i) => {
    const pts = [];
    for (let x = -20; x <= 1020; x += 8) pts.push([x, +(y0 + Math.sin(x*.018 + i*1.7)*3 + Math.sin(x*.05 + i)*1.2).toFixed(1)]);
    el("path", { class:"ln", d: lineD(pts), "stroke-width":w, opacity:o }, g);
  });
  return main;
}
function drawMap() {
  const s = $("map"); s.innerHTML = "";
  const main = buildScene(s);
  // đường mòn: đã đi (C1 -> vị trí hiện tại), chưa đi (tiếp tới G5)
  const doneD = smooth([P.C1, P.G1, P.C2, here]);
  el("path", { class:"trail-todo", d: smooth([here, P.G2, ...ORDER.slice(4).map(k => P[k])]), transform:"translate(0,-6)" }, s);
  el("path", { class:"trail-done", d: doneD, transform:"translate(0,-6)" }, s);
  el("path", { class:"sheen", d: doneD, transform:"translate(0,-6)" }, s);
  // cổng
  PHASES.forEach(ph => {
    const [x,y0] = P["G"+ph.n], y = y0 - 6, st = ph.gate.state;
    const sz = ph.n === 5 ? 13 : 9;
    el("polygon", { class:"cairn " + st, points:`${x},${y-sz*1.3} ${x+sz},${y+sz*.5} ${x-sz},${y+sz*.5}` }, s);
    el("text", { class:"gid" + (st === "open" ? " open" : ""), x: st === "open" ? x + 14 : x, y: st === "open" ? y - 10 : y - sz*1.3 - 6, "text-anchor": st === "open" ? "start" : "middle" }, s, ph.gate.id + (st === "open" ? " · CHƯA QUA" : st === "done" ? " · ĐÃ QUA" : ""));
  });
  el("text", { class:"summit", x:896, y:44, "text-anchor":"end" }, s, "Đỉnh · phát hành v1");
  // trại
  PHASES.forEach(ph => {
    const [x,y0] = P["C"+ph.n], y = y0 - 6;
    const g = el("g", { class:"camp " + ph.state + (ph.n === sel ? " sel" : ""), tabindex:0, role:"button", "aria-label":`Trại ${ph.n}: ${ph.name}, ${lbl[ph.state]}` }, s);
    el("circle", { class:"ring", cx:x, cy:y, r:19 }, g);
    el("circle", { class:"dot", cx:x, cy:y, r:12 }, g);
    el("text", { class:"n", x, y:y+4 }, g, ph.n);
    el("text", { class:"nm", x, y:y+36, "text-anchor":"middle" }, g, ph.short);
    el("text", { class:"sm", x, y:y+50, "text-anchor":"middle" }, g, "TRẠI " + ph.n + " · " + lbl[ph.state].toUpperCase());
    const pick = () => select(ph.n);
    g.addEventListener("click", pick);
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
  });
  // cờ
  const hx = here[0], hy = here[1] - 6, f = el("g", { class:"flag" }, s);
  el("line", { x1:hx, y1:hy, x2:hx, y2:hy-44 }, f);
  el("polygon", { points:`${hx},${hy-44} ${hx+16},${hy-38} ${hx},${hy-32}` }, f);
  el("circle", { cx:hx, cy:hy, r:4, fill:"var(--trail)" }, f);
  el("text", { class:"here", x:hx-8, y:hy-50, "text-anchor":"end" }, f, "BẠN Ở ĐÂY · 62%");
}
function renderStatus() {
  const c = PHASES[CUR - 1];
  const miss = [];
  c.crit.forEach(([g, rows]) => rows.forEach(r => { if (!r[2]) miss.push([r[0], r[1], r[3]]); }));
  $("status").innerHTML =
    `<div><span class="cap">Vị trí hiện tại</span>
       <h2>Trại ${c.n} · ${esc(c.name)}</h2>
       <div class="row"><span class="big">${c.pct}%</span><span class="tag doing">${lbl[c.state]}</span></div></div>
     <div><span class="cap">Cổng G${c.n} · chưa qua</span>
       <div class="row"><span class="big">${miss.length}</span><span>tiêu chí còn thiếu, rồi chờ User cho qua</span></div>
       <ul class="miss">${miss.map(m => `<li>${esc(m[0])} <span class="who">${esc(m[1])} · ${esc(m[2])}</span></li>`).join("")}</ul></div>`;
}
function renderRail() {
  $("rail").innerHTML = PHASES.map(p =>
    `<button type="button" data-n="${p.n}" aria-pressed="${p.n === sel}"><span class="cap">Phase ${p.n} · <span class="st-${p.state}">${lbl[p.state]}</span></span><span class="t">${esc(p.short)}</span></button>`).join("");
  $("rail").querySelectorAll("button").forEach(b => b.addEventListener("click", () => select(+b.dataset.n)));
}
function renderDetail() {
  const p = PHASES[sel - 1];
  const blocks = p.blocks.map(b => {
    const done = b.done || (b.d != null && b.d === b.of);
    const pct = b.done ? 100 : Math.round(b.d / b.of * 100);
    const cnt = b.done ? "xong" : `${b.d}/${b.of}`;
    return `<li><span>${esc(b.t)}</span><span class="mono">${cnt}</span><span class="bar" aria-hidden="true"><i class="${done ? "dn" : ""}" style="width:${pct}%"></i></span>${b.note ? `<span class="note">${esc(b.note)}</span>` : ""}</li>`;
  }).join("");
  const crit = p.crit ? p.crit.map(([g, rows]) =>
    `<div class="grp"><span class="cap">${esc(g)}</span>${rows.map(r =>
      `<div class="crit ${r[2] ? "" : "miss-row"}"><span class="what">${esc(r[0])}</span><span class="by">${esc(r[1])}</span><span class="tag ${r[2] ? "done" : "doing"}">${esc(r[3])}</span></div>`).join("")}</div>`).join("")
    : `<p class="empty">Tiêu chí đánh giá của phase này chưa được lập. Sẽ viết khi phase trước qua cổng.</p>`;
  const steps = p.steps.length ? `<details><summary>Các bước của phase (${p.steps.length})</summary><ul class="steps">${p.steps.map(s =>
    `<li><span class="id">${s[0]}</span><span>${esc(s[1])}</span><span class="tag ${s[2]}">${lbl[s[2]]}</span></li>`).join("")}</ul></details>` : "";
  const gs = p.gate.state;
  const gateTag = gs === "done" ? "done" : gs === "open" ? "doing" : "todo";
  const gateTxt = gs === "done" ? "đã qua" : gs === "open" ? "chưa qua" : "sắp tới";
  $("detail").innerHTML =
    `<section>
       <span class="cap">Trại ${p.n} · phase ${p.n}</span>
       <h3>${esc(p.name)}</h3>
       <div class="row"><span class="tag ${p.state}">${lbl[p.state]}</span>${p.state==="doing" ? `<span class="mono">${p.pct}%</span>` : ""}</div>
       <p class="goal">${esc(p.goal)}</p>
       <h4 class="cap">Khối cần làm</h4>
       <ul class="blocks">${blocks}</ul>
       ${steps}
     </section>
     <section>
       <div class="gate-box ${gs}"><div class="row"><span class="cap">Cổng ${p.gate.id}</span><span class="tag ${gateTag}">${gateTxt}</span></div><span>${esc(p.gate.note)}</span></div>
       <h4 class="cap">Tiêu chí đánh giá chuyên nghiệp</h4>
       ${crit}
     </section>`;
}
function select(n) { sel = n; drawMap(); renderRail(); renderDetail(); }
$("off").innerHTML = `<span class="cap">Ngoài lộ trình</span><ul>${OFF.map(o => `<li><span class="id">${o[0]}</span> ${esc(o[1])}</li>`).join("")}</ul>`;
renderStatus(); select(CUR);
</script>
</body>
</html>
