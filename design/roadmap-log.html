<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lộ trình Strata v1</title>
<style>
/* Ý tưởng: bản phát hành là một đợt phóng. 5 phase = 5 chặng trên dải kế hoạch bay,
   chặng hiện tại sáng lên. Mỗi cổng là một vòng thăm dò GO/NO-GO: từng tiêu chí là một
   bảng điều khiển báo GO hoặc NO-GO kèm cách kiểm. Bảng thăm dò là điểm nhấn duy nhất;
   phần còn lại tĩnh, in trên giấy, không neon. Trạng thái luôn có chữ đi kèm. */
:root{
  --bg:#e9ecee; --paper:#f6f7f7; --ink:#1b2328; --mute:#5d6a72; --rule:#b9c2c8;
  --console:#1f2a30; --console-ink:#e6ecef; --console-mute:#93a3ac; --console-rule:#35444c;
  --go:#2f7d4f; --go-bg:#d5e8dc; --nogo:#b3402a; --nogo-bg:#f1d9d2; --hold:#9a6b00; --hold-bg:#f1e4c0;
  --lit:#c9791a;
  --sans:"Segoe UI","Helvetica Neue",Arial,sans-serif; --mono:ui-monospace,"SF Mono","DejaVu Sans Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12181c; --paper:#192126; --ink:#dfe6ea; --mute:#8d9ba3; --rule:#2f3c43;
  --console:#0e1417; --console-ink:#e6ecef; --console-mute:#8a9aa3; --console-rule:#2a373e;
  --go:#6cc08b; --go-bg:#1d3a2a; --nogo:#e8836b; --nogo-bg:#44231b; --hold:#e0b24a; --hold-bg:#3d3114; --lit:#e8993d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181c; --paper:#192126; --ink:#dfe6ea; --mute:#8d9ba3; --rule:#2f3c43;
  --console:#0e1417; --console-ink:#e6ecef; --console-mute:#8a9aa3; --console-rule:#2a373e;
  --go:#6cc08b; --go-bg:#1d3a2a; --nogo:#e8836b; --nogo-bg:#44231b; --hold:#e0b24a; --hold-bg:#3d3114; --lit:#e8993d; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);
  padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.label{font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lit);outline-offset:2px}

header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 24px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:12px}
h1{margin:0;font-size:26px;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
header .meta{font:12px var(--mono);color:var(--mute);text-align:right}

/* flight-plan strip */
.plan{display:grid;grid-template-columns:repeat(5,1fr);gap:0;list-style:none;margin:0;padding:0}
.plan li{min-width:0;position:relative;padding-top:22px}
.plan li::before{content:"";position:absolute;left:0;right:0;top:8px;height:2px;background:var(--rule)}
.plan li.done::before{background:var(--ink)}
.plan li.now::before{background:linear-gradient(90deg,var(--lit) 62%,var(--rule) 62%);height:3px;top:7.5px}
.plan .tick{position:absolute;right:-1px;top:1px;width:2px;height:16px;background:var(--ink)}
.plan li:last-child .tick{right:0}
.plan .gate{position:absolute;right:6px;top:-9px;font:600 11px var(--mono);color:var(--mute)}
.stage{display:block;width:100%;text-align:left;background:none;border:0;padding:6px 14px 6px 0;cursor:pointer}
.stage .t{font:11px var(--mono);color:var(--mute);letter-spacing:.06em}
.stage .n{display:block;font-weight:600;font-size:14px;line-height:1.3;margin-top:2px}
.stage .s{display:inline-block;margin-top:6px;font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
li.done .s{color:var(--go)} li.now .s{color:var(--lit)}
li.now .stage{background:var(--paper);box-shadow:inset 0 3px 0 var(--lit);padding-left:12px;margin-left:-12px;width:calc(100% + 12px)}
li.now .n{font-size:15px}
.stage[aria-pressed="true"] .n{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}

/* layout */
.cols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:24px;align-items:start}
.panel{background:var(--paper);border:1px solid var(--rule);padding:18px 20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.panel h2{margin:0;font-size:20px;line-height:1.25;text-wrap:balance}
.goal{margin:0;color:var(--mute);max-width:62ch}
.phead{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.pct{font:600 12px var(--mono);color:var(--lit)}

/* POLL BOARD: the one bold element */
.poll{background:var(--console);color:var(--console-ink);border:1px solid var(--ink);padding:0;min-width:0;display:flex;flex-direction:column}
.poll-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;padding:14px 18px;border-bottom:1px solid var(--console-rule)}
.poll .label{color:var(--console-mute)}
.verdict{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:16px 18px 6px}
.verdict b{font:700 34px/1 var(--mono);letter-spacing:.02em;color:var(--nogo)}
.poll.allgo .verdict b{color:var(--go)} .poll.standby .verdict b{color:var(--hold)}
.verdict span{font:13px var(--mono);color:var(--console-mute)}
.missing{margin:0;padding:6px 18px 16px;font-size:14px;color:var(--console-ink);border-bottom:1px solid var(--console-rule)}
.missing strong{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--console-mute);display:block;margin-bottom:4px}
.rows{display:flex;flex-direction:column}
.grp{font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--console-mute);padding:12px 18px 4px}
.row{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 18px;border-top:1px solid var(--console-rule)}
.lamp{font:700 12px var(--mono);letter-spacing:.08em;text-align:center;padding:5px 0;border:1px solid currentColor}
.lamp.go{color:var(--go);background:var(--go-bg)} .lamp.nogo{color:var(--nogo);background:var(--nogo-bg)}
.lamp.hold{color:var(--hold);background:var(--hold-bg)} .lamp.std{color:var(--console-mute);background:transparent}
.row .c{min-width:0;font-size:14px;line-height:1.35}
.row .c small{display:block;font:12px var(--mono);color:var(--console-mute);margin-top:2px;overflow-wrap:anywhere}
.row .who{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--console-mute);border:1px solid var(--console-rule);padding:3px 7px}
.row.nogo .c{font-weight:600}

/* blocks */
.blocks{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.blocks li{display:grid;grid-template-columns:minmax(0,1fr) 110px 64px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--rule)}
.blocks .nm small{display:block;font:12px var(--mono);color:var(--hold)}
.bar{height:6px;background:var(--rule);position:relative}.bar i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.blocks .v{font:600 12px var(--mono);text-align:right}

details{border-top:1px solid var(--rule);padding-top:10px}
summary{cursor:pointer;font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.steps{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:flex;gap:10px;align-items:baseline;font-size:14px}
.steps .st{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;min-width:74px}
.st.xong{color:var(--go)} .st.dang{color:var(--lit)} .st.chua{color:var(--mute)}

aside{display:flex;flex-direction:column;gap:20px;min-width:0}
.off{list-style:none;margin:0;padding:0}
.off li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--rule);font-size:14px}
.off b{font:600 12px var(--mono);color:var(--mute);min-width:40px}
.note{font:12px var(--mono);color:var(--mute);margin:0}

@media(max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
@media(max-width:640px){
  .plan{grid-template-columns:1fr;gap:2px}
  .plan li{padding-top:0;padding-left:18px;border-left:2px solid var(--rule)}
  .plan li.done{border-color:var(--ink)} .plan li.now{border-color:var(--lit)}
  .plan li::before,.plan .tick{display:none}
  .plan .gate{position:static;display:inline;margin-left:8px}
  .plan .stage{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;padding:6px 0}
  li.now .stage{margin-left:0;width:100%;padding-left:8px}
  .stage .n{margin:0}.stage .s{margin:0}
  .row{grid-template-columns:68px minmax(0,1fr)} .row .who{grid-column:2;justify-self:start}
  .blocks li{grid-template-columns:minmax(0,1fr) 56px} .blocks .bar{display:none}
  .verdict b{font-size:28px} header .meta{text-align:left}
}
@media(prefers-reduced-motion:no-preference){.poll{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="label">Kế hoạch bay · phát hành v1</div><h1>Lộ trình Strata v1</h1></div>
    <div class="meta">Chặng hiện tại: 2 / 5<br>Cổng chỉ user được cho qua</div>
  </header>

  <ol class="plan" id="plan" aria-label="Các chặng"></ol>

  <div class="cols">
    <main style="display:flex;flex-direction:column;gap:24px;min-width:0">
      <section class="poll" id="poll" aria-live="polite"></section>
    </main>
    <aside>
      <section class="panel" id="stage"></section>
      <section class="panel">
        <div class="label">Ngoài lộ trình · 3 việc</div>
        <ul class="off">
          <li><b>#151</b><span>Sửa lỗi lệch múi giờ ở bảng việc</span></li>
          <li><b>#160</b><span>Xuất tài liệu ra PDF</span></li>
          <li><b>#162</b><span>Dọn các issue trùng lặp</span></li>
        </ul>
        <p class="note">Không chặn cổng nào. Làm khi rảnh.</p>
      </section>
    </aside>
  </div>
</div>

<script>
const M={name:{go:"GO",nogo:"NO-GO",hold:"HOLD",std:"STANDBY"}};
const P=[
 {id:1,name:"Skeleton",state:"done",label:"Xong",goal:"Dựng khung chạy được từ đầu đến cuối: CLI ghi, viewer đọc, dữ liệu một file.",
  blocks:[["Viewer",4,4],["CLI",1,1]],steps:[["xong","1.1 Khung CLI + SQLite"],["xong","1.2 Viewer chỉ đọc"]],
  crit:{"Nền tảng":[["Chạy từ đầu đến cuối trên máy dev","make run","Máy","go"],["Kiến trúc được ghi lại","docs/architect","Reviewer","go"]]}},
 {id:2,name:"Tính năng liên quan",sub:"mức trình diễn",state:"now",label:"Đang làm",pct:62,
  goal:"Các tính năng liên quan hoạt động ở mức đủ để trình diễn với user, chưa cần gia cố.",
  blocks:[["Viewer",3,4],["CLI",1,1],["Trang Lộ trình",1,3],["MCP server",0,2,"kéo về sớm từ phase 3"]],
  steps:[["xong","2.1 Bảng việc"],["xong","2.2 MCP đủ tool"],["dang","2.3 Trang Lộ trình"],["chua","2.4 Demo với user"]],
  crit:{
   "Tài liệu":[["How-to cho mỗi tác vụ chính","docs/how-to","Reviewer","go"],["Reference CLI/API từ --help/OpenAPI","sinh tự động","Máy","go"],["CHANGELOG có mục Unreleased","kiểm file","Máy","nogo","chưa có"]],
   "Kiểm thử":[["Mỗi tính năng có Given/When/Then + test","đối chiếu spec","Reviewer","go"],["Coverage khối lõi ≥ 70%","pytest --cov","Máy","nogo","64%"]],
   "Bảo mật":[["Đạt OWASP ASVS L1","checklist ASVS","Reviewer","nogo","9/12 mục"]],
   "Vận hành":[["Log có cấu trúc + /health","curl /health","Máy","go"]],
   "Trình diễn":[["Kịch bản demo chạy lại được","make demo","User","nogo","chưa có"]]}},
 {id:3,name:"Gia cố bảo mật",state:"next",label:"Sắp tới",goal:"Đóng các lỗ hổng chính trước khi cho người khác dùng: xác thực, phân quyền, nhập liệu.",
  blocks:[["Xác thực",0,3],["Kiểm tra đầu vào",0,2]],steps:[["chua","3.1 Mô hình mối đe dọa"],["chua","3.2 Sửa lỗ hổng mức cao"]],
  crit:{"Bảo mật":[["ASVS L2 cho các luồng chính","checklist ASVS","Reviewer","std"],["Không còn lỗ hổng mức cao","quét phụ thuộc","Máy","std"]]}},
 {id:4,name:"Tính năng con + domain + staging",state:"next",label:"Sắp tới",goal:"Hoàn thiện tính năng con, gắn tên miền, dựng môi trường staging.",
  blocks:[["Tính năng con",0,5],["Staging",0,2]],steps:[["chua","4.1 Tính năng con"],["chua","4.2 Domain + TLS"],["chua","4.3 Staging"]],
  crit:{"Vận hành":[["Staging giống production","so cấu hình","Máy","std"],["Domain có TLS hợp lệ","kiểm chứng chỉ","Máy","std"]]}},
 {id:5,name:"Deploy / phát hành",state:"next",label:"Sắp tới",goal:"Đưa bản v1 lên production và công bố.",
  blocks:[["Quy trình deploy",0,2]],steps:[["chua","5.1 Diễn tập rollback"],["chua","5.2 Phát hành v1"]],
  crit:{"Phát hành":[["Rollback đã diễn tập","runbook","User","std"],["Ghi chú phát hành đã duyệt","CHANGELOG","User","std"]]}}
];
let sel=2;
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function drawPlan(){
  $("#plan").innerHTML=P.map(p=>`<li class="${p.state==="next"?"":p.state}">
    <span class="tick"></span><span class="gate">G${p.id}</span>
    <button class="stage" data-id="${p.id}" aria-pressed="${p.id===sel}">
      <span class="t">CHẶNG ${p.id}</span><span class="n">${esc(p.name)}</span>
      <span class="s">${p.state==="done"?"Xong":p.state==="now"?"Đang làm · "+p.pct+"%":"Sắp tới"}</span>
    </button></li>`).join("");
  document.querySelectorAll(".stage").forEach(b=>b.onclick=()=>{sel=+b.dataset.id;draw()});
}
function drawPoll(p){
  const rows=Object.values(p.crit).flat();
  const n=k=>rows.filter(r=>r[3]===k).length;
  const bad=rows.filter(r=>r[3]==="nogo");
  const cls=p.state==="done"?"allgo":p.state==="next"?"standby":"";
  let head;
  if(p.state==="done") head=`<b>GO</b><span>${rows.length}/${rows.length} tiêu chí đạt · cổng G${p.id} đã qua</span>`;
  else if(p.state==="next") head=`<b>STANDBY</b><span>Chưa thăm dò · ${rows.length} tiêu chí chờ chặng này tới</span>`;
  else head=`<b>NO-GO</b><span>${n("go")} GO · ${n("nogo")} NO-GO · ${rows.length} tiêu chí</span>`;
  const miss=p.state==="now"?`<p class="missing"><strong>Cần để qua G${p.id}</strong>${bad.map(r=>esc(r[0])+" ("+esc(r[4])+")").join(" · ")}</p>`:"";
  $("#poll").className="poll "+cls;
  $("#poll").innerHTML=`<div class="poll-top"><span class="label">Thăm dò cổng G${p.id} · sau chặng ${p.id}</span><span class="label">Chỉ user cho qua</span></div>
   <div class="verdict">${head}</div>${miss}
   <div class="rows">${Object.entries(p.crit).map(([g,list])=>`<div class="grp">${esc(g)}</div>`+list.map(r=>`
     <div class="row ${r[3]}"><span class="lamp ${r[3]}">${M.name[r[3]]}</span>
     <span class="c">${esc(r[0])}${r[4]?` <span style="color:var(--nogo)">· ${esc(r[4])}</span>`:""}<small>Kiểm: ${esc(r[1])}</small></span>
     <span class="who">${esc(r[2])}</span></div>`).join("")).join("")}</div>`;
}
function drawStage(p){
  const stl={xong:"Xong",dang:"Đang làm",chua:"Chưa"};
  $("#stage").innerHTML=`<div class="phead"><span class="label">Chặng ${p.id} · ${p.label}</span>${p.pct?`<span class="pct">${p.pct}% hoàn thành</span>`:""}</div>
   <div><h2>${esc(p.name)}${p.sub?` <span style="font-weight:400;color:var(--mute)">· ${esc(p.sub)}</span>`:""}</h2></div>
   <p class="goal">${esc(p.goal)}</p>
   <div><div class="label" style="margin-bottom:6px">Khối cần làm</div><ul class="blocks">${p.blocks.map(b=>`<li>
     <span class="nm">${esc(b[0])}${b[3]?`<small>${esc(b[3])}</small>`:""}</span>
     <span class="bar"><i style="width:${b[2]?b[1]/b[2]*100:0}%"></i></span><span class="v">${b[1]}/${b[2]}</span></li>`).join("")}</ul></div>
   <details><summary>Các bước · ${p.steps.length}</summary><ul class="steps">${p.steps.map(s=>`<li><span class="st ${s[0]}">${stl[s[0]]}</span>${esc(s[1])}</li>`).join("")}</ul></details>`;
}
function draw(){const p=P.find(x=>x.id===sel);drawPlan();drawPoll(p);drawStage(p)}
draw();
</script>
</body>
</html>
