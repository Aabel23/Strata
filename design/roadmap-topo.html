<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lộ trình Strata v1</title>
<style>
/* Ý tưởng: tờ bản đồ địa hình. Năm phase là năm trại trên đường leo núi, đỉnh là bản phát hành.
   Cổng G1..G5 là mốc đá (cairn) trên đường mòn; chỉ user được cho qua.
   Điểm nhấn duy nhất: đường đồng mức và đường mòn vẽ bằng SVG. Phần còn lại tĩnh, chữ kiểu chú giải bản đồ
   (độ cao, ô lưới, thước tỷ lệ). Màu nền là giấy bản đồ, mực đồng mức nâu, đỏ khảo sát chỉ vị trí hiện tại. */
:root {
  --paper: #e8ede7;
  --paper-2: #dfe6de;
  --ink: #1d2a26;
  --ink-2: #4a5a54;
  --grid: #b9c7c0;
  --contour: #b98a5e;
  --contour-index: #8f5f33;
  --survey: #c2321c;
  --done: #2f6b4a;
  --line: #c3cfc8;
  --f-serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --f-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-mono: ui-monospace, "SF Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1a17; --paper-2: #15231f; --ink: #dbe6e0; --ink-2: #94a79f;
    --grid: #2a3b36; --contour: #7a5c3d; --contour-index: #b98a5e;
    --survey: #ff7a5c; --done: #6fc08f; --line: #2a3b36; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1a17; --paper-2: #15231f; --ink: #dbe6e0; --ink-2: #94a79f;
  --grid: #2a3b36; --contour: #7a5c3d; --contour-index: #b98a5e;
  --survey: #ff7a5c; --done: #6fc08f; --line: #2a3b36; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--f-sans);
  padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.cap { font: 600 11px/1.3 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--survey); outline-offset: 2px; }

/* tiêu đề tờ bản đồ */
header { display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid var(--ink); padding-bottom: 10px; }
h1 { margin: 0; font: italic 600 34px/1.1 var(--f-serif); letter-spacing: -.01em; text-wrap: balance; }
.sheet { text-align: right; }
.sheet div { font: 12px/1.5 var(--f-mono); color: var(--ink-2); }

/* dải trạng thái: đọc trong 3 giây */
.status { display: grid; grid-template-columns: 1.2fr 1fr; gap: 0; border: 1px solid var(--ink); }
.status > div { padding: 16px 18px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.status > div + div { border-left: 1px solid var(--ink); }
.status h2 { margin: 0; font: italic 600 24px/1.2 var(--f-serif); text-wrap: balance; }
.big { font: 600 40px/1 var(--f-mono); color: var(--survey); }
.row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.tag { font: 700 11px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; padding: 4px 6px; border: 1px solid currentColor; white-space: nowrap; }
.tag.done { color: var(--done); } .tag.doing { color: var(--survey); } .tag.todo { color: var(--ink-2); }
.miss { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; font-size: 14px; }
.miss li::before { content: "\25B8\00a0"; color: var(--survey); }
.miss .who { font: 12px var(--f-mono); color: var(--ink-2); }

/* bản đồ */
.mapbox { border: 1px solid var(--ink); background: var(--paper-2); overflow-x: auto; }
svg.map { display: block; width: 100%; min-width: 640px; height: auto; }
.map .gl { stroke: var(--grid); stroke-width: .7; }
.map .ct { fill: none; stroke: var(--contour); stroke-width: .9; }
.map .ci { fill: none; stroke: var(--contour-index); stroke-width: 1.7; }
.map .trail-todo { fill: none; stroke: var(--ink-2); stroke-width: 2; stroke-dasharray: 2 6; stroke-linecap: round; }
.map .trail-done { fill: none; stroke: var(--survey); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.map text { font-family: var(--f-mono); fill: var(--ink); }
.map text { paint-order: stroke; stroke: var(--paper-2); stroke-width: 4px; stroke-linejoin: round; }
.map .camp text.n { stroke: none; }
.map .sm { font-size: 10px; fill: var(--ink-2); letter-spacing: .06em; }
.map .elev { font-size: 9px; fill: var(--contour-index); }
.map .nm { font-size: 11px; font-weight: 700; letter-spacing: .06em; }
.map .camp circle { fill: var(--paper); stroke: var(--ink); stroke-width: 2; }
.map .camp.done circle { fill: var(--done); stroke: var(--done); }
.map .camp.done text.n { fill: var(--paper); }
.map .camp.doing circle { fill: var(--survey); stroke: var(--survey); }
.map .camp.doing text.n { fill: var(--paper); }
.map .camp.sel .ring { display: block; }
.map .ring { display: none; fill: none; stroke: var(--ink); stroke-width: 1.5; }
.map .camp { cursor: pointer; }
.map .n { font-size: 13px; font-weight: 700; text-anchor: middle; }
.map .cairn { fill: var(--paper); stroke: var(--ink); stroke-width: 1.8; stroke-linejoin: round; }
.map .cairn.open { stroke: var(--survey); stroke-width: 2.4; }
.map .flag line { stroke: var(--survey); stroke-width: 2; }
.map .flag polygon { fill: var(--survey); }
.map .here { fill: var(--survey); font-size: 11px; font-weight: 700; letter-spacing: .08em; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 22px; padding: 8px 14px; border-top: 1px solid var(--ink); font: 11px var(--f-mono); color: var(--ink-2); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 18px; height: 0; border-top: 3px solid var(--survey); }
.sw.d { border-top: 2px dotted var(--ink-2); }
.sw.c { border-top: 2px solid var(--contour-index); }

/* thanh chọn phase */
.rail { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; border: 1px solid var(--ink); }
.rail button { background: transparent; border: 0; text-align: left; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.rail button + button { border-left: 1px solid var(--line); }
.rail button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.rail button[aria-pressed="true"] .cap { color: var(--paper); }
.rail .t { font: 600 14px/1.25 var(--f-serif); font-style: italic; overflow-wrap: anywhere; }

/* chi tiết phase */
.detail { display: grid; grid-template-columns: 1fr 1.25fr; gap: 28px; align-items: start; }
.detail > section { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
h3 { margin: 0; font: italic 600 22px/1.2 var(--f-serif); text-wrap: balance; }
h4 { margin: 0; padding-bottom: 4px; border-bottom: 1px solid var(--ink); }
.goal { margin: 0; max-width: 62ch; }
.blocks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.blocks li { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: baseline; }
.blocks .bar { grid-column: 1 / -1; height: 6px; background: repeating-linear-gradient(90deg, var(--grid) 0 2px, transparent 2px 8px); position: relative; }
.blocks .bar i { position: absolute; inset: 0 auto 0 0; background: var(--survey); }
.blocks .bar i.dn { background: var(--done); }
.blocks .note { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink-2); }
.grp { display: flex; flex-direction: column; }
.grp .cap { margin: 10px 0 2px; }
.crit { display: grid; grid-template-columns: 1fr auto auto; gap: 2px 14px; padding: 7px 0; border-bottom: 1px dotted var(--grid); align-items: baseline; }
.crit .what { min-width: 0; }
.crit .by { font: 12px var(--f-mono); color: var(--ink-2); }
.crit.miss-row .what { font-weight: 600; }
details { border-top: 1px solid var(--line); padding-top: 8px; }
summary { cursor: pointer; font: 600 11px/1.3 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.steps { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.steps li { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.steps .id { font: 12px var(--f-mono); color: var(--ink-2); }
.off { border-top: 2px solid var(--ink); padding-top: 12px; display: flex; flex-wrap: wrap; gap: 8px 28px; align-items: baseline; }
.off ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 22px; }
.off li { font-size: 14px; } .off .id { font: 600 13px var(--f-mono); }
.gate-box { border: 1px solid var(--ink); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.empty { color: var(--ink-2); font-size: 14px; margin: 0; }

@media (max-width: 860px) {
  .detail { grid-template-columns: 1fr; }
  .status { grid-template-columns: 1fr; }
  .status > div + div { border-left: 0; border-top: 1px solid var(--ink); }
  .rail { grid-template-columns: 1fr; }
  .rail button + button { border-left: 0; border-top: 1px solid var(--line); }
  .rail button { flex-direction: row; align-items: baseline; gap: 10px; }
  .sheet { text-align: left; }
  h1 { font-size: 28px; }
}
@media (max-width: 520px) { .crit { grid-template-columns: 1fr auto; } .crit .by { grid-column: 1; } .crit .tag { grid-column: 2; grid-row: 1 / span 2; align-self: start; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="cap">Bản đồ hành trình dự án</div>
      <h1>Lộ trình Strata v1</h1>
    </div>
    <div class="sheet">
      <div>TỜ 1/1 · TỶ LỆ 1 phase : 1 trại</div>
      <div>Đường đồng mức cách nhau 40 điểm tiến độ</div>
    </div>
  </header>

  <div class="status" id="status"></div>

  <div>
    <div class="mapbox">
      <svg class="map" id="map" viewBox="0 0 1000 380" role="img" aria-label="Bản đồ địa hình: năm trại là năm phase, đỉnh là bản phát hành"></svg>
      <div class="legend">
        <span><i class="sw"></i> đoạn đã đi</span>
        <span><i class="sw d"></i> đoạn chưa đi</span>
        <span><i class="sw c"></i> đường đồng mức cái</span>
        <span>tròn = trại (phase)</span>
        <span>tam giác = cổng, mốc đá chỉ user cho qua</span>
        <span>nhấn vào trại để xem phase</span>
      </div>
    </div>
  </div>

  <nav class="rail" id="rail" aria-label="Chọn phase"></nav>

  <div class="detail" id="detail"></div>

  <div class="off" id="off"></div>
</div>

<script>
const PHASES = [
  { n:1, name:"Skeleton", short:"Skeleton", state:"done", pct:100, elev:1120,
    goal:"Dựng khung chạy được: CLI, DB, viewer chỉ đọc, bố cục thư mục.",
    gate:{ id:"G1", state:"done", note:"Đã qua." },
    blocks:[{t:"Khung CLI + DB",d:4,of:4},{t:"Viewer chỉ đọc",d:2,of:2}], crit:null,
    steps:[["1.1","Khung CLI","done"],["1.2","Viewer chỉ đọc","done"]] },
  { n:2, name:"Tính năng liên quan, mức trình diễn", short:"Tính năng liên quan", state:"doing", pct:62, elev:1240,
    goal:"Các tính năng cốt lõi chạy liền mạch ở mức đủ để trình diễn cho user: bảng việc, MCP, trang Lộ trình, kịch bản demo.",
    gate:{ id:"G2", state:"open", note:"Chờ user cho qua." },
    blocks:[{t:"Viewer",d:3,of:4},{t:"CLI",done:true},{t:"Trang Lộ trình",d:1,of:3},{t:"MCP server",d:0,of:2,note:"Kéo về sớm từ phase 3"}],
    crit:[
      ["Tài liệu",[["How-to cho mỗi tác vụ chính (docs/how-to)","Reviewer",1,"đạt"],["Reference CLI/API từ --help/OpenAPI","Máy",1,"đạt"],["CHANGELOG có mục Unreleased","Máy",0,"chưa"]]],
      ["Kiểm thử",[["Mỗi tính năng có Given/When/Then + test","Reviewer",1,"đạt"],["Coverage khối lõi ≥70% (pytest --cov)","Máy",0,"64% · chưa"]]],
      ["Bảo mật",[["Đạt OWASP ASVS L1","Reviewer",0,"9/12 mục"]]],
      ["Vận hành",[["Log có cấu trúc + /health","Máy",1,"đạt"]]],
      ["Trình diễn",[["Kịch bản demo chạy lại được (make demo)","User",0,"chưa"]]]
    ],
    steps:[["2.1","Bảng việc","done"],["2.2","MCP đủ tool","done"],["2.3","Trang Lộ trình","doing"],["2.4","Demo với user","todo"]] },
  { n:3, name:"Gia cố bảo mật", short:"Gia cố bảo mật", state:"todo", pct:0, elev:1480,
    goal:"Đóng các lỗ hổng theo ASVS L1, siết xác thực và nhật ký truy cập trước khi mở cho người ngoài.",
    gate:{ id:"G3", state:"todo", note:"Chưa tới." }, blocks:[{t:"Xác thực",d:0,of:3},{t:"Nhật ký truy cập",d:0,of:2}], crit:null, steps:[] },
  { n:4, name:"Tính năng con, domain, staging", short:"Tính năng con + staging", state:"todo", pct:0, elev:1760,
    goal:"Hoàn thiện tính năng con, gắn domain riêng và chạy thử trên môi trường staging.",
    gate:{ id:"G4", state:"todo", note:"Chưa tới." }, blocks:[{t:"Domain + TLS",d:0,of:2},{t:"Staging",d:0,of:3}], crit:null, steps:[] },
  { n:5, name:"Deploy / phát hành", short:"Deploy / phát hành", state:"todo", pct:0, elev:2480,
    goal:"Đưa bản v1 lên production, có quy trình quay lui và ghi chú phát hành.",
    gate:{ id:"G5", state:"todo", note:"Đỉnh núi: bản phát hành." }, blocks:[{t:"Pipeline phát hành",d:0,of:3}], crit:null, steps:[] }
];
const OFF = [["#151","Lọc việc theo nhãn"],["#160","Xuất bảng việc ra CSV"],["#162","Chủ đề tối cho viewer"]];
const CUR = 2;
let sel = CUR;
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const lbl = { done:"xong", doing:"đang làm", todo:"sắp tới" };
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

/* điểm trên đường mòn: trại rồi cổng */
const P = { C1:[70,330], G1:[180,300], C2:[290,312], G2:[410,262], C3:[500,276], G3:[590,216], C4:[690,204], G4:[770,150], C5:[840,142], G5:[930,66] };
const ORDER = ["C1","G1","C2","G2","C3","G3","C4","G4","C5","G5"];
const FRAC = 0.62;
const here = [P.C2[0] + (P.G2[0]-P.C2[0])*FRAC, P.C2[1] + (P.G2[1]-P.C2[1])*FRAC];

function el(tag, attrs, parent, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
function drawMap() {
  const s = $("map"); s.innerHTML = "";
  // lưới khảo sát và toạ độ ô
  for (let x = 0; x <= 1000; x += 100) el("line", { class:"gl", x1:x, y1:0, x2:x, y2:380 }, s);
  for (let y = 0; y <= 380; y += 100) el("line", { class:"gl", x1:0, y1:y, x2:1000, y2:y }, s);
  "ABCDEFGHIJ".split("").forEach((c,i) => el("text", { class:"sm", x:i*100+6, y:12 }, s, c));
  [1,2,3,4].forEach((v,i) => el("text", { class:"sm", x:6, y:i*100+24 }, s, v));
  // đường đồng mức quanh đỉnh
  const cx = 915, cy = 90;
  for (let k = 1; k <= 20; k++) {
    const r = k * 30, idx = k % 5 === 0;
    let d = "";
    for (let i = 0; i <= 72; i++) {
      const a = i / 72 * Math.PI * 2;
      const w = 1 + .10*Math.sin(3*a + k*.35) + .06*Math.sin(5*a - k*.2) + .03*Math.sin(9*a + k);
      const x = cx + Math.cos(a) * r * 1.75 * w, y = cy + Math.sin(a) * r * .95 * w;
      d += (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
    }
    el("path", { class: idx ? "ci" : "ct", d: d + "Z" }, s);
  }
  // nhãn độ cao trên các đường cái, đặt phía trái đỉnh
  [[5,2200],[10,1900],[15,1600],[20,1300]].forEach(([k,m]) => {
    const x = cx - 1.75*k*30*1.02 - 2, y = cy + 4;
    const t = el("text", { class:"elev", x, y, "text-anchor":"middle" }, s, m + "m");
    t.setAttribute("style", "paint-order:stroke;stroke:var(--paper-2);stroke-width:4px");
  });
  // đường mòn
  const pts = ORDER.map(k => P[k]);
  const upto = pts.slice(0, 4).concat([here]);   // C1, G1, C2, G2 chưa tới -> dừng tại vị trí hiện tại
  const done = [P.C1, P.G1, P.C2, here];
  el("polyline", { class:"trail-todo", points: [here, P.G2, ...pts.slice(4)].map(p => p.join(",")).join(" ") }, s);
  el("polyline", { class:"trail-done", points: done.map(p => p.join(",")).join(" ") }, s);
  // cổng (mốc đá)
  PHASES.forEach(ph => {
    const [x,y] = P["G"+ph.n], open = ph.gate.state === "open";
    const g = el("g", {}, s);
    const sz = ph.n === 5 ? 15 : 11;
    el("polygon", { class:"cairn" + (open ? " open" : ""), points:`${x},${y-sz} ${x+sz},${y+sz*.7} ${x-sz},${y+sz*.7}`, fill: ph.gate.state==="done" ? "var(--done)" : "var(--paper)" }, g);
    el("text", { class:"nm", x:x, y:y+sz+13, "text-anchor":"middle" }, g, ph.gate.id);
  });
  el("text", { class:"sm", x:985, y:40, "text-anchor":"end" }, s, "ĐỈNH · PHÁT HÀNH · 2 480 m");
  // trại
  PHASES.forEach(ph => {
    const [x,y] = P["C"+ph.n];
    const g = el("g", { class:"camp " + ph.state + (ph.n === sel ? " sel" : ""), tabindex:0, role:"button", "aria-label":`Trại ${ph.n}: ${ph.name}, ${lbl[ph.state]}` }, s);
    el("circle", { class:"ring", cx:x, cy:y, r:23 }, g);
    el("circle", { cx:x, cy:y, r:16 }, g);
    el("text", { class:"n", x:x, y:y+5 }, g, ph.n);
    el("text", { class:"sm", x:x, y:y+34, "text-anchor":"middle" }, g, "TRẠI " + ph.n + " · " + ph.elev.toLocaleString("vi-VN") + "m");
    el("text", { class:"nm", x:x, y:y+47, "text-anchor":"middle" }, g, ph.short);
    const pick = () => select(ph.n);
    g.addEventListener("click", pick);
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
  });
  // cờ "đang ở đây"
  const f = el("g", { class:"flag" }, s);
  el("line", { x1:here[0], y1:here[1], x2:here[0], y2:here[1]-40 }, f);
  el("polygon", { points:`${here[0]},${here[1]-40} ${here[0]+16},${here[1]-34} ${here[0]},${here[1]-28}` }, f);
  el("circle", { cx:here[0], cy:here[1], r:5, fill:"var(--survey)" }, f);
  el("text", { class:"here", x:here[0]-6, y:here[1]-48, "text-anchor":"end" }, f, "BẠN Ở ĐÂY · 62%");
  // thước tỷ lệ
  const sb = el("g", {}, s);
  el("rect", { x:580, y:352, width:80, height:6, fill:"var(--ink)" }, sb);
  el("rect", { x:660, y:352, width:80, height:6, fill:"var(--paper)", stroke:"var(--ink)", "stroke-width":1 }, sb);
  ["0","1","2 phase"].forEach((t,i) => el("text", { class:"sm", x:580+i*80, y:372 }, sb, t));
  // mũi tên bắc
  const nt = el("g", {}, s);
  el("polygon", { points:"965,330 972,352 965,347 958,352", fill:"var(--ink)" }, nt);
  el("text", { class:"sm", x:965, y:324, "text-anchor":"middle" }, nt, "B");
}

function renderStatus() {
  const c = PHASES[CUR - 1];
  const miss = [];
  c.crit.forEach(([g, rows]) => rows.forEach(r => { if (!r[2]) miss.push([r[0], r[1], r[3]]); }));
  $("status").innerHTML =
    `<div><span class="cap">Vị trí hiện tại</span>
       <h2>Trại ${c.n} · ${esc(c.name)}</h2>
       <div class="row"><span class="big">${c.pct}%</span><span class="tag doing">${lbl[c.state]}</span></div>
       <span class="mono" style="font-size:12px;color:var(--ink-2)">Độ cao ${c.elev.toLocaleString("vi-VN")} m · ô F3</span></div>
     <div><span class="cap">Cổng G${c.n} · chưa qua</span>
       <div class="row"><span class="big">${miss.length}</span><span>tiêu chí còn thiếu, rồi chờ User cho qua</span></div>
       <ul class="miss">${miss.map(m => `<li>${esc(m[0])} <span class="who">${esc(m[1])} · ${esc(m[2])}</span></li>`).join("")}</ul></div>`;
}

function renderRail() {
  $("rail").innerHTML = PHASES.map(p =>
    `<button type="button" data-n="${p.n}" aria-pressed="${p.n === sel}"><span class="cap">Phase ${p.n} · ${lbl[p.state]}</span><span class="t">${esc(p.short)}</span></button>`).join("");
  $("rail").querySelectorAll("button").forEach(b => b.addEventListener("click", () => select(+b.dataset.n)));
}

function renderDetail() {
  const p = PHASES[sel - 1];
  const blocks = p.blocks.map(b => {
    const done = b.done || (b.d != null && b.d === b.of);
    const pct = b.done ? 100 : Math.round(b.d / b.of * 100);
    const cnt = b.done ? "xong" : `${b.d}/${b.of}`;
    return `<li><span>${esc(b.t)}</span><span class="mono">${cnt}</span><span class="bar" aria-hidden="true"><i class="${done ? "dn" : ""}" style="width:${pct}%"></i></span>${b.note ? `<span class="note">${esc(b.note)}</span>` : ""}</li>`;
  }).join("");
  const crit = p.crit ? p.crit.map(([g, rows]) =>
    `<div class="grp"><span class="cap">${esc(g)}</span>${rows.map(r =>
      `<div class="crit ${r[2] ? "" : "miss-row"}"><span class="what">${esc(r[0])}</span><span class="by">${esc(r[1])}</span><span class="tag ${r[2] ? "done" : "doing"}">${esc(r[3])}</span></div>`).join("")}</div>`).join("")
    : `<p class="empty">Tiêu chí đánh giá của phase này chưa được lập. Sẽ viết khi phase trước qua cổng.</p>`;
  const steps = p.steps.length ? `<details><summary>Các bước của phase (${p.steps.length})</summary><ul class="steps">${p.steps.map(s =>
    `<li><span class="id">${s[0]}</span><span>${esc(s[1])}</span><span class="tag ${s[2]}">${lbl[s[2]]}</span></li>`).join("")}</ul></details>` : "";
  const gs = p.gate.state;
  const gateTag = gs === "done" ? "done" : gs === "open" ? "doing" : "todo";
  const gateTxt = gs === "done" ? "đã qua" : gs === "open" ? "chưa qua" : "sắp tới";
  $("detail").innerHTML =
    `<section>
       <span class="cap">Trại ${p.n} · độ cao ${p.elev.toLocaleString("vi-VN")} m</span>
       <h3>${esc(p.name)}</h3>
       <div class="row"><span class="tag ${p.state}">${lbl[p.state]}</span>${p.state==="doing" ? `<span class="mono">${p.pct}%</span>` : ""}</div>
       <p class="goal">${esc(p.goal)}</p>
       <h4 class="cap">Khối cần làm</h4>
       <ul class="blocks">${blocks}</ul>
       ${steps}
     </section>
     <section>
       <div class="gate-box"><div class="row"><span class="cap">Cổng ${p.gate.id}</span><span class="tag ${gateTag}">${gateTxt}</span></div><span>${esc(p.gate.note)}</span></div>
       <h4 class="cap">Tiêu chí đánh giá chuyên nghiệp</h4>
       ${crit}
     </section>`;
}

function select(n) { sel = n; drawMap(); renderRail(); renderDetail(); }

$("off").innerHTML = `<span class="cap">Ngoài lộ trình</span><ul>${OFF.map(o => `<li><span class="id">${o[0]}</span> ${esc(o[1])}</li>`).join("")}</ul>`;
renderStatus(); select(CUR);
</script>
</body>
</html>
