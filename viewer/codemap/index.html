<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070914">
  <title>Celeste — code graph chart</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app" id="app" aria-label="Code graph rendered as a celestial chart">
    <svg id="sky" class="layer" viewBox="0 0 2400 1200" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <defs>
        <radialGradient id="core-gradient">
          <stop offset="0%" stop-color="#ffe6ae" stop-opacity=".56"></stop>
          <stop offset="23%" stop-color="#e6ae65" stop-opacity=".22"></stop>
          <stop offset="65%" stop-color="#a9773e" stop-opacity=".045"></stop>
          <stop offset="100%" stop-color="#a9773e" stop-opacity="0"></stop>
        </radialGradient>
      </defs>
      <g id="sky-world"><g id="grid"></g>
        <ellipse id="core-glow" cx="1200" cy="600" rx="8" ry="5" fill="url(#core-gradient)" opacity="0"></ellipse>
      </g>
    </svg>
    <canvas id="edges" class="layer"></canvas>
    <canvas id="stars" class="layer"></canvas>
    <svg id="overlay" class="layer map-svg" viewBox="0 0 2400 1200" preserveAspectRatio="xMidYMid meet" role="application" aria-label="Code graph. Drag to pan, scroll or plus/minus to zoom, click a star to pin it, Escape to clear.">
      <g id="overlay-world">
        <circle id="selection-ring" class="selection-ring" r="11"></circle>
        <path id="selection-cross" class="selection-cross" d="M-20 0h7M13 0h7M0-20v7M0 13v7"></path>
        <text id="hover-label" class="hover-label" visibility="hidden"></text>
      </g>
    </svg>
    <div class="controls" aria-label="Map controls">
      <div class="gravity-control">
        <label for="gravity">Center gravity</label><output id="gravity-value" for="gravity">0.00</output>
        <input id="gravity" type="range" min="0" max="0.8" step="0.01" value="0">
      </div>
      <details class="edges-menu" id="edges-menu" hidden><summary>Edges</summary><div class="filters" id="filters" aria-label="Edge types"></div></details>
      <button id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in (+)">+</button>
      <button id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out (−)">−</button>
      <button id="reset" type="button" aria-label="Reset view" title="Reset view (0)">Reset</button>
    </div>
    <aside class="detail" id="detail" aria-label="Node details" hidden>
      <button class="detail-close" id="detail-close" type="button" aria-label="Close details" title="Close (Esc)">×</button>
      <p class="eyebrow" id="detail-kicker">Selected object</p>
      <h2 id="detail-title">Explore the field</h2>
      <div class="detail-grid">
        <div><span class="detail-label">Kind</span><span class="detail-value" id="detail-kind">—</span></div>
        <div><span class="detail-label">Degree</span><span class="detail-value" id="detail-degree">—</span></div>
        <div class="wide"><span class="detail-label">Community</span><span class="detail-value" id="detail-community">—</span></div>
        <div class="wide"><span class="detail-label">File</span><span class="detail-value" id="detail-file">—</span></div>
      </div>
      <p class="detail-label neighbours-label" id="neighbours-label" hidden>Neighbours</p>
      <ul class="neighbours" id="neighbours"></ul>
      <p class="detail-note" id="detail-note"></p>
    </aside>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
