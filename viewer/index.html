<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strata</title>
<script src="/vendor/dagre.min.js"></script>
<style>
/* Strata tokens (same values as page.css): night + champagne gold by default, HSK ivory in light */
:root{
  color-scheme:dark;
  --bg:#09080c;--canvas:#100e14;--dot:#221f29;--bar:#0c0b0f;--panel:#121016;--card:#1b1922;--card2:#241f2b;
  --ink:#ebe5db;--muted:#a59d93;--faint:#7a7480;--line:#2a2630;--edge:#8a8290;
  --accent:#d3a67c;--accent2:#a87b4f;--hot:#f0d6b4;--warn:#d9a24e;--err:#c06464;
  --actor:#b49cff;--system:#8aa8e6;--app:#6fa595;--store:#d9a24e;--component:#a59d93;--group:#7a7480;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f6f2e8;--canvas:#fbfaf5;--dot:#e6dec9;--bar:#ffffff;--panel:#ffffff;--card:#ffffff;--card2:#f6f2e8;--ink:#294342;--muted:#55625f;--faint:#8f9894;--line:#e6dec9;--edge:#8f9894;--accent:#07807d;--accent2:#05615f;--hot:#07807d;--warn:#a8701c;--err:#cd3c35;color-scheme:light;}}
:root[data-theme="light"]{--bg:#f6f2e8;--canvas:#fbfaf5;--dot:#e6dec9;--bar:#ffffff;--panel:#ffffff;--card:#ffffff;--card2:#f6f2e8;--ink:#294342;--muted:#55625f;--faint:#8f9894;--line:#e6dec9;--edge:#8f9894;--accent:#07807d;--accent2:#05615f;--hot:#07807d;--warn:#a8701c;--err:#cd3c35;color-scheme:light;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 "Segoe UI Variable Text","Segoe UI",Inter,system-ui,-apple-system,sans-serif;height:100vh;display:grid;grid-template-rows:auto auto 1fr;overflow:hidden}
body{-webkit-user-select:none;user-select:none}aside,input,textarea{-webkit-user-select:text;user-select:text}
button,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--faint)}
/* top bar */
#top{display:flex;align-items:center;gap:14px;padding:0 12px;height:44px;background:var(--bar);border-bottom:1px solid var(--line)}
#top button{border:0;background:none;color:var(--muted)}
.logo{width:26px;height:26px;border-radius:50%;border:1px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-family:"Cormorant Garamond","Palatino Linotype",Georgia,serif;font-weight:600}
.tab{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--muted);padding:13px 2px;border-bottom:2px solid transparent}
.tab.on{color:var(--accent);border-color:var(--accent)}
#title{flex:1;text-align:center;line-height:1.2}#title b{display:block;font-size:14px}#title small{color:var(--muted)}
/* sub bar: breadcrumbs */
#sub{display:flex;align-items:center;gap:10px;padding:0 12px;height:36px;background:var(--bar);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
#crumbs a{cursor:pointer;color:var(--muted);padding:4px 8px;border-radius:5px}#crumbs a:last-child{color:var(--ink);background:var(--card);border-bottom:2px solid var(--accent)}
#sub button{border:0;background:none;color:var(--muted);font-size:16px;padding:2px 8px;border-radius:5px}#sub button:hover{background:var(--card);color:var(--ink)}
#home{color:var(--muted);text-decoration:none;font-size:12px;white-space:nowrap}
#crumbs .sep{color:var(--faint)}
#lvl{margin-left:auto;color:var(--muted);font-size:12px;padding-left:12px}
/* legend + tooltip */
#legend{position:absolute;top:12px;right:12px;width:262px;max-height:calc(100% - 24px);overflow:auto;background:var(--bar);border:1px solid var(--line);border-radius:8px;font-size:12px;cursor:default}
#legend summary{padding:7px 12px;cursor:pointer;color:var(--muted);font-weight:600;list-style:none}
#legend summary::-webkit-details-marker{display:none}
#legend summary::before{content:"›";display:inline-block;width:12px;transition:transform .15s}
#legend[open] summary::before{transform:rotate(90deg)}
#legend .lg{display:grid;grid-template-columns:26px 1fr;gap:7px 8px;align-items:center;padding:2px 12px 12px}
#legend .lg svg{width:24px;height:18px;overflow:visible;flex:none}
#legend .ty{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:6px 8px}#legend .ty div{display:flex;align-items:center;gap:7px}
#legend .lg span{color:var(--ink)}#legend .lg hr{grid-column:1/-1;width:100%;border:0;border-top:1px solid var(--line);margin:2px 0}
#tip{position:fixed;z-index:20;max-width:320px;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 10px;box-shadow:0 6px 18px rgba(0,0,0,.28);font-size:12px}
#tip b{font-size:13px}#tip .m{color:var(--muted);margin:1px 0 4px}#tip .w{color:var(--warn)}
@media (prefers-reduced-motion:reduce){.node,.edge,#legend summary::before{transition:none!important}}
main{display:grid;grid-template-columns:56px minmax(0,1fr) var(--info-width,320px);min-height:0}
/* left toolbar */
#tools{background:var(--bar);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0}
#tools button{width:44px;border:0;background:none;color:var(--muted);font-size:10px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:6px}
#tools button:hover,#tools button.on{background:var(--card);color:var(--ink)}
#tools svg{width:20px;height:20px}
#tools hr{width:30px;border:0;border-top:1px solid var(--line)}
/* canvas */
#stage{position:relative;overflow:hidden;background-color:var(--canvas);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:18px 18px;cursor:grab}
#stage.pan{cursor:grabbing}
#stage>svg{position:absolute;inset:0;width:100%;height:100%}
#drop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:16px}
#flat{position:absolute;right:12px;bottom:12px;z-index:2}#flat.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#cardk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--bar);border:1px solid var(--line);border-radius:6px;padding:3px 8px}#cardsz{width:90px}
#bottom{position:absolute;left:12px;bottom:12px;display:flex;gap:8px;align-items:center}
#bottom select,#bottom button{background:var(--bar)}
#zoomlbl{color:var(--muted);font-size:12px;min-width:40px;text-align:center}
/* nodes */
.node{cursor:pointer}
.node .box{fill:var(--card);stroke:var(--line);stroke-width:1}
.node:hover .box{stroke:var(--faint)}
.node.sel .box{stroke:var(--accent);stroke-width:2}
.node .t{fill:var(--ink);font-weight:600;font-size:13px}
.node .s{fill:var(--muted);font-size:11px}
.node .ico{stroke-width:1.6;fill:none}
.node .d{fill:var(--muted);font-size:11px}.node .d.none{font-style:italic}
.node .stk{fill:var(--card2);stroke:var(--faint)}
.node .fl{stroke:var(--line)}
.node .ft{fill:var(--muted);font-size:10.5px}
.node .zhit{fill:transparent}.node .zbtn{cursor:pointer}.node .zbtn:hover .zhit{fill:color-mix(in srgb,var(--accent) 14%,transparent)}
.node .zt{fill:var(--accent);font-size:11px;font-weight:600}.node .zbtn:hover .zt{text-decoration:underline}
.node.ext .box{fill:transparent;stroke-dasharray:4 3}
.node.ext .t{fill:var(--muted)}
.node.dim,.edge.dim{opacity:.15}
.node,.edge{transition:opacity .2s}
.node.fade,.edge.fade{opacity:.18}
.node:focus-visible .box{stroke:var(--accent);stroke-width:2}
#stage>svg.old{pointer-events:none}
#stage.anim .node,#stage.anim .edge{transition:none}
#stage>svg.mframe{pointer-events:none}
#stage>svg.mframe rect{fill:var(--card)}
.node.issue .box{stroke:var(--err);fill:color-mix(in srgb,var(--err) 14%,var(--card))}
.node.issue.sel .box{stroke:var(--accent)}
.node.hot .box{stroke:var(--hot);stroke-width:2.4}
.node .sdot{stroke:var(--card);stroke-width:2}
.node .bdg circle{fill:var(--err)}.node .bdg text{fill:#fff;font-weight:700;font-size:11px;text-anchor:middle}
#q{width:150px;background:var(--bar);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font:inherit}
#smsg{color:var(--warn);font-size:12px}
.pbody ul{margin:4px 0;padding-left:18px}
.scope rect{fill:rgba(255,255,255,.015);stroke:var(--faint);stroke-dasharray:5 4}
.scope text{fill:var(--muted);font-size:11px}
.fbox rect{fill:color-mix(in srgb,var(--ink) 3%,transparent);stroke:var(--faint);stroke-dasharray:5 4}.fbox text{fill:var(--muted);font-size:12px;font-weight:600}.fbox.hot rect{stroke:var(--accent);stroke-width:2;stroke-dasharray:none}
/* edges */
.edge{cursor:pointer;color:var(--edge)}
.edge path{fill:none;stroke:currentColor;stroke-width:1.3}
.edge .hit{stroke:transparent;stroke-width:12}
.edge text{fill:var(--muted);font-size:10.5px;paint-order:stroke;stroke:var(--canvas);stroke-width:4px}
.edge .lbg{fill:var(--canvas);stroke:none}
.edge .num{fill:var(--accent);font-weight:700}
.edge.future path{stroke-dasharray:6 4}.edge.deprecated{color:var(--warn)}.edge.removed{color:var(--err)}.edge.removed path{stroke-dasharray:2 3}
.edge.rel{color:var(--accent)}.edge.rel path:not(.hit){stroke-width:2.2}.edge.rel text{fill:var(--ink)}
.edge.hot{color:var(--hot)}.edge.hot path{stroke-width:2.4}.edge.hot text{fill:var(--hot);font-weight:600}
/* right panel */
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.info-wrap{position:relative;min-width:0;min-height:0;display:flex}
.info-wrap aside{flex:1;min-width:0}
#info-resize{width:6px;position:absolute;z-index:3;left:-3px;top:0;bottom:0;cursor:col-resize;touch-action:none}
#info-resize:hover,#info-resize:focus-visible{background:var(--accent);outline:none}
.info-head{display:flex;align-items:center;justify-content:flex-end;min-height:30px;padding:2px 8px 0}
#hide-info{padding:2px 7px;border:0;background:none;color:var(--muted);font-size:16px;line-height:1}
#show-info{position:absolute;z-index:4;right:0;top:8px;border-radius:6px 0 0 6px;padding:7px 8px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
main.info-hidden{grid-template-columns:56px minmax(0,1fr) 0}
main.info-hidden #info-wrap{display:none}
main.info-hidden{grid-template-columns:56px minmax(0,1fr) 0}.embed main.info-hidden{grid-template-columns:minmax(0,1fr) 0}
main.info-hidden #show-info{display:block}
#show-info{display:none}
.ptabs{display:flex;gap:18px;padding:0 16px;border-bottom:1px solid var(--line)}
.ptabs a{padding:10px 0;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.ptabs a.on{color:var(--ink);border-color:var(--accent)}
.pbody{padding:14px 16px;overflow:auto;flex:1}
.step{scroll-margin-top:140px}
.fhead{position:sticky;top:-14px;z-index:2;margin:-14px -16px 8px;padding:14px 16px 2px;background:var(--panel);border-bottom:1px solid var(--line)}
.lbl{color:var(--muted);font-size:11px;margin:12px 0 4px}
.field{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.pbody h2{margin:0;font-size:16px}
.chip{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;background:var(--card2);color:var(--muted);margin:6px 4px 0 0}
.pbody a{color:var(--accent)}.pbody code{font-size:12px;word-break:break-all}
.stepnav{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;margin:12px 0}
.stepnav button{border:0;background:none;color:var(--accent);font-weight:600}
.stepnav button.nx{background:var(--accent);color:var(--bg);border-radius:6px}
.stepnav span{color:var(--muted);font-size:12px}
.step{display:grid;grid-template-columns:28px 1fr;gap:4px 8px;padding:10px;border-radius:8px;border:1px solid transparent;cursor:pointer;margin-bottom:6px}
.step:hover{background:var(--card)}
.step.on{background:var(--card);border-color:var(--accent)}
.step .n{grid-row:span 3;color:var(--muted);font-size:10px;line-height:1.1}.step .n b{display:block;font-size:16px;color:var(--ink)}
.step .ft{display:grid;grid-template-columns:1fr 18px 1fr;gap:4px;font-weight:600}.step .ft i{color:var(--accent);font-style:normal}
.step .via{color:var(--muted);font-size:12px}
.step>*:not(.n){grid-column:2;min-width:0}.step .ft span{min-width:0;overflow-wrap:anywhere}
.step .path{color:var(--faint);font-size:11px}.step .rv{color:var(--hot);font-size:11px;font-weight:600;margin-left:4px}
.step pre{margin:2px 0 0;padding:4px 6px;background:var(--card2);border-radius:4px;white-space:pre-wrap;word-break:break-word;font:11px/1.4 ui-monospace,"Cascadia Code",Consolas,monospace}
.step .sig{font:11px/1.4 ui-monospace,"Cascadia Code",Consolas,monospace;color:var(--muted);word-break:break-word}
.stepnav label{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:12px;cursor:pointer}
.edge.hot.rev path:not(.hit){stroke-dasharray:7 5;animation:revdash 1s linear infinite}
@keyframes revdash{to{stroke-dashoffset:24}}
@media (prefers-reduced-motion:reduce){.edge.hot.rev path{animation:none}}
.empty{color:var(--muted)}
/* code-level nodes (file / function) and contract panel */
.node.code .t{font:600 12px ui-monospace,"Cascadia Code",Consolas,monospace}
.node.code .s{font:10.5px ui-monospace,"Cascadia Code",Consolas,monospace}
.edge.pick{color:var(--accent)}.edge.pick path:not(.hit){stroke-width:2.4}.edge.pick text{fill:var(--ink)}
.pbody pre,.mono{font:12px/1.45 ui-monospace,"Cascadia Code",Consolas,monospace}
.pbody pre{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;white-space:pre-wrap;word-break:break-word}
.chip.k{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card2))}
/* task #162: inline object-edit form */
.editlink{cursor:pointer;font-size:12px;margin-left:8px}
.pbody input[type=text],.pbody select{display:block;width:100%;margin:2px 0 10px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font:inherit}
.eferr{color:var(--err);font-size:12px;margin:-4px 0 8px}
.efbtns{display:flex;gap:8px;margin:4px 0 12px}
.ifc{border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin-bottom:6px;background:var(--bg)}
.ifc .mono{color:var(--ink);word-break:break-word}.ifc div{margin-top:3px}.ifc .m{color:var(--muted);font-size:12px}
.ifc .er{color:var(--err);font-size:12px}
.ep{border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:6px 0}.ep .lbl{margin-top:6px}
.ehead{display:flex;justify-content:space-between;align-items:center}.ehead button{font-size:12px}
.clist div{padding:3px 0;cursor:pointer}.clist div:hover{color:var(--accent)}.clist .m{color:var(--muted);font-size:12px}
.pbody ol,.pbody ul.r{margin:4px 0;padding-left:18px}
.embed{grid-template-rows:auto 1fr}
.embed #top,.embed #sub,.embed #tools{display:none}
.embed main{grid-template-columns:minmax(0,1fr) var(--info-width,320px)}
.shell{grid-template-rows:auto 1fr}.shell #top{display:none}
@media (max-width:760px){main{grid-template-columns:1fr;grid-template-rows:1fr 42vh}main.info-hidden{grid-template-columns:1fr;grid-template-rows:1fr}#tools{display:none}aside{border-left:0;border-top:1px solid var(--line)}#info-resize{display:none}#show-info{top:auto;bottom:8px}}
/* task #240: Architect editor (toolbar, dialog) */
#edbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:5px 12px;background:var(--bar);border-bottom:1px solid var(--line);min-width:0}
#edbar button,#edlg button{font-size:12px;padding:3px 10px}
#edbar button:disabled{opacity:.4;cursor:default}#edbar button:disabled:hover{border-color:var(--line)}
#edbar .seg{display:flex}#edbar .seg button:first-child{border-radius:6px 0 0 6px}#edbar .seg button:last-child{border-radius:0 6px 6px 0;margin-left:-1px}
#edbar button[aria-pressed=true]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
#ed-acts{display:flex;flex-wrap:wrap;gap:6px}#ed-acts[hidden]{display:none}
#ed-msg{margin-left:auto;min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--muted)}#ed-msg.err{color:var(--err)}
#edhint{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:3;max-width:calc(100% - 24px);background:var(--accent);color:var(--bg);border-radius:6px;padding:5px 12px;font-size:12px;font-weight:600;text-align:center}
#edhint[hidden]{display:none}
#edov{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
#edlg{width:min(420px,100%);max-height:100%;overflow:auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.4);-webkit-user-select:text;user-select:text}
#edlg h3{margin:0 0 8px;font-size:15px}#edlg .edmsg{margin:0 0 10px;white-space:pre-wrap;color:var(--muted)}
#edlg input,#edlg select,#edlg textarea{display:block;width:100%;margin:2px 0 10px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font:inherit}
#edlg .eferr{white-space:pre-wrap;margin:0 0 8px}#edlg .lbl{margin-top:0}
#edbar .pri,#edlg .pri{background:var(--accent);color:var(--bg);border-color:var(--accent)}#edlg .dng{background:var(--err);color:#fff;border-color:var(--err)}
#edbar button:focus-visible,#edlg button:focus-visible,#edlg input:focus-visible,#edlg select:focus-visible,#edlg textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
</style>
</head>
<body>
<div id="edbar" role="toolbar" aria-label="Architect editor">
  <div class="seg" role="group" aria-label="Mode"><button id="ed-sel" aria-pressed="true">Select</button><button id="ed-edit" aria-pressed="false" title="Turn on editing">Edit</button></div>
  <div id="ed-acts" hidden>
    <button id="ed-addo">Add object</button><button id="ed-eo">Edit selected</button><button id="ed-do">Delete selected</button>
    <button id="ed-addl">Add link</button><button id="ed-el">Edit link</button><button id="ed-dl">Delete link</button>
  </div>
  <span id="ed-msg" role="status" aria-live="polite"></span>
</div>
<header id="top">
  <div class="logo">S</div>
  <a id="home" href="/">← Strata</a><span class="tab">MODEL</span><span class="tab on">DIAGRAMS</span>
  <div id="title"><b id="mname">Strata</b><small id="mpath">No model open</small></div>
  <button id="theme" title="Toggle light/dark">◐</button>
</header>
<nav id="sub"><button id="hb" title="Back (Alt+←)" aria-label="Back">←</button><button id="hf" title="Forward (Alt+→)" aria-label="Forward">→</button><span id="crumbs"></span><span id="lvl"></span></nav>
<main>
  <div id="tools">
    <button class="on" title="Drag to move"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 3l14 8-6 2-2 6z"/></svg>Move</button>
    <button id="fit" title="Fit (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Fit</button>
    <button id="zin" title="Zoom in (+)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5M8 11h6M11 8v6"/></svg>Zoom in</button>
    <button id="zout" title="Zoom out (-)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5M8 11h6"/></svg>Zoom out</button>
    <hr>
    <button id="up" title="Up one level (Esc)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 19V5M6 11l6-6 6 6"/></svg>Up</button>
  </div>
  <div id="stage">
    <div id="drop">Loading model…</div>
    <div id="edhint" role="status" hidden></div>
    <details id="legend" open><summary>Legend</summary><div class="lg" id="lgbody"></div></details>
    <button id="flat" title="Show every card (except functions) on one map">All</button>
    <div id="bottom">
      <select id="tag"><option value="">Tags: all</option></select>
      <input id="q" list="qlist" placeholder="Find object…" autocomplete="off"><datalist id="qlist"></datalist><span id="smsg"></span>
      <label id="cardk" title="Card and text size on the map">Card size <input type="range" id="cardsz" min="60" max="200" step="10" value="100"> <span id="cardlbl">100%</span></label>
      <span id="zoomlbl">100%</span>
    </div>
  </div>
  <div class="info-wrap" id="info-wrap">

        :`<div class="ft"><span>${esc(nm(e.from))}</span><i>${st.reverse?"←":"→"}</i><span>${esc(nm(e.to))}</span></div>`;
      return `<div class="step ${i===step?"on":""}" data-i="${i}"><div class="n">Step<b>${i+1}.</b></div>
      ${head}<div class="path">${F!==undefined?esc(scopePath(F)):""}${st.reverse?'<span class="rv">← reverse</span>':""}</div>
      ${via?`<div class="via">via ${esc(via)}</div>`:""}<div>${esc(st.text||c.name||"")}</div>
      ${has(st.transition)?`<div class="via">transition ${esc(st.transition)}</div>`:""}
      ${has(st.payload)||has(st.values)?`<pre>${esc(typeof (st.payload||st.values)==="string"?st.payload:JSON.stringify(st.payload||st.values))}</pre>`:""}
      </div>`}).join("");
  }
  $("#pflows").innerHTML=h;
  $("#flow").onchange=e=>{flow=e.target.value||null;step=0;renderFlows();showStep()};
  if(f){
    $("#prev").onclick=()=>setStep(step-1); $("#next").onclick=()=>setStep(step+1);
    $("#pflows").querySelectorAll(".step").forEach(el=>el.onclick=()=>{if(+el.dataset.i!==step)setStep(+el.dataset.i)});
    $("#pflows .step.on")?.scrollIntoView({block:"nearest"});
  }
}
// Double-click a step card: move ONE level (smooth drill) toward the level where the step is drawn.
// Repeat to keep going; at that level it only re-highlights. Off-path or too deep: go up first.
$("#pflows").addEventListener("mousedown",e=>{if(e.detail>1&&e.target.closest(".step"))e.preventDefault()}); // no text selection on dblclick
$("#pflows").addEventListener("dblclick",e=>{const el=e.target.closest(".step"); if(!el||!M||busy) return; e.preventDefault(); goStep(+el.dataset.i)});
async function goStep(i){
  const f=M.flows.find(x=>x.id===flow), st=f?.steps?.[i]; if(!st) return; if(i!==step) setStep(i);
  const F=stepScope(st);
  if(F!==undefined&&focus!==F){
    const down=!focus||isAnc(focus,F), next=down?chain(F)[focus?chain(focus).length:0]:par(focus);
    await go(next??null);
  }
  if(step!==i) return; selected=null; pickConn=stepConn(st)||null;
  const e=stepEnds(st); if(e.at) selected=lift(e.at,focus)?.id||null;
  paint();
}
function setStep(i){const f=M.flows.find(x=>x.id===flow);if(!f)return;step=Math.max(0,Math.min(f.steps.length-1,i));renderFlows();showStep()}

$("#tag").onchange=()=>render(true);
function centerOn(id){
  const p=pos[id]; if(!p) return; const r=$("#stage").getBoundingClientRect();
  cam.x=r.width/2-p.x*cam.k; cam.y=r.height/2-p.y*cam.k; applyCam();
}
// Exact match on id/name first, then substring; case-insensitive.
function findObj(q){
  q=q.trim().toLowerCase(); if(!q) return null; const os=M.objects||[];
  return os.find(o=>o.id.toLowerCase()===q||(o.name||"").toLowerCase()===q)||os.find(o=>o.id.toLowerCase().includes(q)||(o.name||"").toLowerCase().includes(q))||null;
}
let smt;
$("#q").onchange=e=>{
  if(!M||!e.target.value.trim()) return; const o=findObj(e.target.value);
  $("#smsg").textContent=o?"":"Not found"; clearTimeout(smt); smt=setTimeout(()=>$("#smsg").textContent="",2500);
  if(!o) return;
  go(o.parent||null).then(()=>{selected=o.id; showObj(o); render(true); centerOn(o.id)});
};
$("#theme").onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==="light"?"dark":"light";try{localStorage.setItem("strata-theme",r.dataset.theme)}catch{}};
try{const t=localStorage.getItem("strata-theme");if(t)document.documentElement.dataset.theme=t}catch{}
document.onkeydown=e=>{if(e.key==="Escape"&&linkPick){cancelPick();return}
  if(!M||e.target.tagName==="SELECT"||e.target.tagName==="INPUT")return;
  if(e.altKey&&e.key==="ArrowLeft")return history.back(); if(e.altKey&&e.key==="ArrowRight")return history.forward();
  if(e.key==="Escape"){if(!deselect()&&focus)go(par(focus))}
  if(e.key==="Enter"&&selected&&kids(selected).length&&!e.target.closest("button,summary"))go(selected);
  if(flow&&e.key==="ArrowRight")setStep(step+1); if(flow&&e.key==="ArrowLeft")setStep(step-1);
  if(e.key==="f")fit(); if(e.key==="+"||e.key==="=")zoomAt(1.2); if(e.key==="-")zoomAt(1/1.2)};
window.onresize=()=>M&&!busy&&fit();
/* hover tooltip with the full description */
const tip=$("#tip"); let tipId=null;
$("#stage").addEventListener("mousemove",e=>{
  const n=!drag&&!busy&&e.target.closest?.(".node"), o=n&&byId[n.dataset.id];
  if(!o){tip.hidden=true;tipId=null;return}
  if(tipId!==o.id){tipId=o.id; const nk=kids(o.id).length;
    tip.innerHTML=`<b>${esc(o.name||o.id)}</b><div class="m">${esc(TYPE_LABEL[o.type]||o.type)}${n.classList.contains("ext")?" · outside this level":""}</div>${o.description?`<div>${esc(o.description)}</div>`:'<div class="m">No description</div>'}${nk?`<div class="m">${nk} components inside</div>`:""}`;
    tip.hidden=false}
  const w=tip.offsetWidth,h=tip.offsetHeight; tip.style.left=Math.min(e.clientX+14,innerWidth-w-8)+"px"; tip.style.top=(e.clientY+16+h>innerHeight?e.clientY-h-12:e.clientY+16)+"px";
});
$("#stage").addEventListener("mouseleave",()=>{tip.hidden=true;tipId=null});
/* legend */
{const sw=(t)=>`<svg viewBox="0 0 20 20" fill="none" stroke="var(--${t})" stroke-width="1.6">${ICON[t]}</svg>`, k="currentColor";
 $("#lgbody").innerHTML=`<div class="ty">`+["actor","system","app","store","component"].map(t=>`<div>${sw(t)}<span>${TYPE_LABEL[t]}</span></div>`).join("")+`</div><hr>
 <svg viewBox="0 0 24 18"><rect x="1" y="2" width="22" height="14" rx="3" fill="none" stroke="var(--faint)" stroke-dasharray="3 2.5"/></svg><span>Dashed: outside this level</span>
 <svg viewBox="0 0 24 18"><rect x="5" y="5" width="17" height="11" rx="3" fill="var(--card2)" stroke="var(--line)"/><rect x="2.5" y="2.5" width="17" height="11" rx="3" fill="var(--card)" stroke="var(--faint)"/></svg><span>Stacked: click to open inside</span>
 <svg viewBox="0 0 24 18"><rect x="1" y="2" width="22" height="14" rx="3" fill="color-mix(in srgb,var(--err) 14%,var(--card))" stroke="var(--err)"/></svg><span>Red fill: has open issues</span>
 <svg viewBox="0 0 24 18" style="color:var(--edge)"><path d="M1 9h16" stroke="${k}" stroke-width="1.4"/><path d="M16 5l6 4-6 4z" fill="${k}"/></svg><span>Arrow: call direction</span><hr>`+Object.values(SDOT).map(([c,t])=>`<svg viewBox="0 0 24 18"><circle cx="12" cy="9" r="5" fill="${c}"/></svg><span>Dot: ${t}</span>`).join("");
 const lg=$("#legend"); try{const v=localStorage.getItem("strata-legend"); if(v==="0"||(v===null&&innerWidth<900)) lg.open=false}catch{}
 lg.ontoggle=()=>{try{localStorage.setItem("strata-legend",lg.open?"1":"0")}catch{}}}
$("#home").href="/#/p/"+encodeURIComponent(P.get("project")||"")+"/c4";
// The map lives only in the app shell's Architecture tab; opening /c4 directly redirects there.
if(window.top===window){location.replace("/#/p/"+encodeURIComponent(P.get("project")||"")+"/c4"+location.hash.replace(/^#(.+)/,"/$1"))}
document.body.classList.add("embed");
if(P.get("shell")) document.body.classList.add("shell");
const toModel=d=>({...d.meta,objects:d.objects,connections:d.connections,flows:d.flows,links:d.links,open_issues:d.open_issues,layered:d.layered,contracts:d.contracts,behavior:d.behavior});
const fetchModel=()=>fetch("/api/c4"+location.search).then(r=>r.ok?r.json():Promise.reject(r.status)).then(toModel);
fetchModel().then(load).catch(e=>{$("#drop").textContent=e===404?"No C4 map (layered format) for this project":`Could not load model (${e}).`});
/* task #240: Architect editor. One write route: POST /api/c4/edit; the reply carries the whole new model. */
let edit=false, linkPick=null, dlgBack=null;
const KINDS=["actor","system","app","store","component","group"];
const tree=(p=null,d=0)=>kids(p).flatMap(o=>[[o,d],...tree(o.id,d+1)]);
const parentOpts=skip=>[["","(top level)"],...tree().filter(([o])=>!skip||(o.id!==skip&&!isAnc(skip,o.id))).map(([o,d])=>[o.id,"  ".repeat(d)+(o.name||o.id)])];
const statusOpts=[["","(default)"],...Object.entries(SDOT).map(([k,v])=>[k,v[1]])];
function setMsg(t,err,title){const m=$("#ed-msg");m.textContent=t;m.title=title||t;m.classList.toggle("err",!!err)}
function updateEd(){
  const sel=selected&&byId[selected], c=pickConn&&conns().find(x=>x.id===pickConn);
  $("#ed-acts").hidden=!edit; $("#ed-sel").setAttribute("aria-pressed",String(!edit)); $("#ed-edit").setAttribute("aria-pressed",String(edit));
  $("#ed-eo").disabled=$("#ed-do").disabled=!sel; $("#ed-el").disabled=$("#ed-dl").disabled=!c;
  $("#ed-eo").title=$("#ed-do").title=sel?"":"Click a card first"; $("#ed-el").title=$("#ed-dl").title=c?"":"Click a single connection first";
}
function setEdit(on){edit=on; if(!on) cancelPick(); updateEd()}
$("#ed-sel").onclick=()=>setEdit(false); $("#ed-edit").onclick=()=>setEdit(true);
function hint(t){const h=$("#edhint");h.hidden=!t;h.textContent=t||""}
function cancelPick(){if(linkPick){linkPick=null;hint("");setMsg("Link cancelled")}}
function closeDlg(keep){const ov=$("#edov"); if(!ov) return; ov.remove(); if(!keep&&dlgBack&&document.contains(dlgBack)) dlgBack.focus(); if(!keep) dlgBack=null}
// Modal form. fields: [{k,l,t:"text"|"area"|"select",v,opts}]. onOk(values) resolves true (close), false (handled) or an error string (shown inline).
function dlg({title,msg,fields=[],ok,okCls="pri",onOk}){
  if(!$("#edov")) dlgBack=document.activeElement;
  closeDlg(true);
  const ov=document.createElement("div"); ov.id="edov";
  const fh=fields.map(f=>{const id="ef-"+f.k; let c;
    if(f.t==="select") c=`<select id="${id}">${f.opts.map(([v,l])=>`<option value="${esc(v)}"${v===f.v?" selected":""}>${esc(l)}</option>`).join("")}</select>`;
    else if(f.t==="area") c=`<textarea id="${id}" rows="3">${esc(f.v)}</textarea>`;
    else c=`<input type="text" id="${id}" value="${esc(f.v)}" autocomplete="off">`;
    return `<label for="${id}" class="lbl">${esc(f.l)}</label>${c}`}).join("");
  ov.innerHTML=`<form id="edlg" role="dialog" aria-modal="true" aria-labelledby="edt"><h3 id="edt">${esc(title)}</h3>${msg?'<p class="edmsg"></p>':""}${fh}<div class="eferr" id="ederr" role="alert"></div><div class="efbtns"><button type="submit" id="edok" class="${okCls}">${esc(ok)}</button><button type="button" id="edno">Cancel</button></div></form>`;
  if(msg) ov.querySelector(".edmsg").textContent=msg;
  document.body.append(ov);
  const form=ov.firstChild, okb=$("#edok");
  form.onsubmit=async e=>{e.preventDefault(); const v={}; fields.forEach(f=>v[f.k]=$("#ef-"+f.k).value.trim());
    okb.disabled=true; const r=await onOk(v); okb.disabled=false;
    if(r!==true&&okb.isConnected) okb.focus(); // disabling dropped focus; keep Esc and Tab inside the dialog
    if(r===true) closeDlg(); else if(typeof r==="string"){const er=$("#ederr"); if(er) er.textContent=r}};
  $("#edno").onclick=()=>closeDlg();
  ov.onclick=e=>{if(e.target===ov) closeDlg()};
  ov.onkeydown=e=>{e.stopPropagation(); // keep the diagram's shortcuts out of the form
    if(e.key==="Escape"){e.preventDefault();closeDlg()}
    else if(e.key==="Tab"){const f=[...ov.querySelectorAll("input,select,textarea,button:not(:disabled)")],i=f.indexOf(document.activeElement);
      if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}}};
  (ov.querySelector("input,select,textarea")||okb).focus();
}
async function send(op){
  const q=P.get("project")?"?project="+encodeURIComponent(P.get("project")):"";
  try{const r=await fetch("/api/c4/edit"+q,{method:"POST",headers:{"Content-Type":"application/json","X-Strata-Edit":"1"},body:JSON.stringify(op)});
    const d=await r.json().catch(()=>({}));
    return r.ok?{ok:true,d}:{status:r.status,error:d.error||`Server answered ${r.status}`};
  }catch(e){return {status:0,error:"Could not reach the server."}}
}
// true = saved; string = error to show inline; false = another confirm took over
async function commit(op,yes){
  const r=await send(yes?{...op,yes:true}:op);
  if(r.ok){const w=r.d.warnings||[];
    setMsg(`Saved${w.length?` · ${w.length} new warning${w.length>1?"s":""}`:""}`,false,w.length?w.map(x=>x.message||String(x)).join("\n"):"Saved");
    await swapModel(r.d.model,op); return true}
  if(r.status===403){closeDlg(); setEdit(false); setMsg("Editing is turned off on this server.",true); return false}
  if(r.status===400&&!yes&&/task links/i.test(r.error)){
    dlg({title:"Drop task links?",msg:r.error,ok:"Apply and drop links",okCls:"dng",onOk:()=>commit(op,true)}); return false}
  if(r.status===400&&op.op==="delete_object"&&!op.cascade&&/cascade/i.test(r.error)){
    dlg({title:"Delete everything under it?",msg:r.error,ok:"Delete with everything under it",okCls:"dng",onOk:()=>commit({...op,cascade:true},yes)}); return false}
  setMsg(r.error,true); return r.error;
}
// Replace the model and redraw, keeping level, selection, flow and zoom where they still exist.
async function swapModel(d,op){
  const before=new Set(Object.keys(byId)), sel=selected, pc=pickConn, c={...cam}, fl=flow, st=step;
  load(toModel(d));
  const nid=op.op==="add_object"&&(M.objects||[]).map(o=>o.id).find(i=>!before.has(i));
  if(nid){await go(byId[nid].parent||null); selected=nid; showObj(byId[nid]); render(true); return}
  if(sel&&byId[sel]) selected=sel;
  cam=c; render(true);
  if(fl&&(M.flows||[]).some(x=>x.id===fl)){flow=fl;$("#flow").value=fl;setStep(st);return}
  const cc=pc&&conns().find(x=>x.id===pc);
  if(selected) showObj(byId[selected]); else if(cc) showConn(cc); else deselect();
}
function objFields(o){return [
  {k:"name",l:"Name",v:o?.name||""},
  {k:"kind",l:"Kind",t:"select",v:o?.type||"component",opts:KINDS.map(k=>[k,TYPE_LABEL[k]])},
  {k:"parent",l:"Parent",t:"select",v:o?o.parent||"":(selected&&byId[selected]?selected:focus||""),opts:parentOpts(o?.id)},
  {k:"tech",l:"Tech",v:o?.tech||""},
  {k:"summary",l:"Summary",t:"area",v:o?.description||""},
  ...(o?[{k:"status",l:"Status",t:"select",v:o.status||"",opts:statusOpts}]:[])]}
$("#ed-addo").onclick=()=>dlg({title:"Add object",fields:objFields(),ok:"Add",onOk:v=>{
  if(!v.name) return "Name is required.";
  const op={op:"add_object",name:v.name,kind:v.kind}; ["parent","tech","summary"].forEach(k=>{if(v[k])op[k]=v[k]}); return commit(op)}});
$("#ed-eo").onclick=()=>{const o=byId[selected]; if(!o) return;
  dlg({title:"Edit "+(o.name||o.id),fields:objFields(o),ok:"Save",onOk:v=>{
    if(!v.name) return "Name is required.";
    return commit({op:"update_object",id:o.id,set:{name:v.name,kind:v.kind,parent:v.parent||null,tech:v.tech||null,summary:v.summary||null,status:v.status||null}})}})};
$("#ed-do").onclick=()=>{const o=byId[selected]; if(!o) return;
  dlg({title:"Delete object?",msg:`Delete "${o.name||o.id}"? The server refuses if it has children or links, and then offers to delete them too.`,ok:"Delete",okCls:"dng",onOk:()=>commit({op:"delete_object",id:o.id})})};
$("#ed-addl").onclick=()=>{linkPick={from:null};hint("Add link: click the object the link starts from. Esc cancels.");setMsg("")};
function linkPicked(id){
  if(!linkPick.from){linkPick.from=id;hint(`From ${nm(id)}. Now click the object it points to. Esc cancels.`);return}
  const from=linkPick.from; linkPick=null; hint("");
  dlg({title:"Add link",msg:`${nm(from)} → ${nm(id)}`,fields:[{k:"name",l:"Name",v:""},{k:"summary",l:"Summary",t:"area",v:""}],ok:"Add link",onOk:v=>{
    if(!v.name) return "Name is required.";
    return commit({op:"add_link",from,to:id,name:v.name,...(v.summary?{summary:v.summary}:{})})}});
}
const curLink=()=>pickConn&&conns().find(x=>x.id===pickConn);
$("#ed-el").onclick=()=>{const c=curLink(); if(!c) return;
  dlg({title:"Edit link",msg:`${nm(c.from)} → ${nm(c.to)}`,fields:[{k:"name",l:"Name",v:c.name||""},{k:"summary",l:"Summary",t:"area",v:c.description||""},{k:"status",l:"Status",t:"select",v:c.status||"",opts:statusOpts}],ok:"Save",onOk:v=>{
    if(!v.name) return "Name is required.";
    return commit({op:"update_link",id:c.id,set:{name:v.name,summary:v.summary||null,status:v.status||null}})}})};
$("#ed-dl").onclick=()=>{const c=curLink(); if(!c) return;
  dlg({title:"Delete link?",msg:`Delete "${c.name||"connection"}" (${nm(c.from)} → ${nm(c.to)})?`,ok:"Delete",okCls:"dng",onOk:()=>commit({op:"delete_link",id:c.id})})};
/* live: after a `c4 import` (or a linked task/issue change) reload the model and stay on the same level, flow and step */
{let ver=null;const live=async()=>{
  if(document.hidden||busy||drag)return;
  try{const v=(await (await fetch("/api/version")).json()).version;if(ver!==null&&v!==ver){
    const m=await fetchModel(),fl=flow,st=step,sel=selected,c={...cam};
    load(m);  // load() re-opens the level named in the hash
    if(sel&&byId[sel])selected=sel;cam=c;render(true);
    if(fl&&(M.flows||[]).some(x=>x.id===fl)){flow=fl;$("#flow").value=fl;setStep(st)}}ver=v}catch{}};
 setInterval(live,2000);document.addEventListener("visibilitychange",live)}
</script>
