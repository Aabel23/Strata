<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strata</title>
<script src="/vendor/dagre.min.js"></script>
<style>
/* Strata tokens (same values as page.css): night + champagne gold by default, HSK ivory in light */
:root{
  color-scheme:dark;
  --bg:#09080c;--canvas:#100e14;--dot:#221f29;--bar:#0c0b0f;--panel:#121016;--card:#1b1922;--card2:#241f2b;
  --ink:#ebe5db;--muted:#a59d93;--faint:#7a7480;--line:#2a2630;--edge:#8a8290;
  --accent:#d3a67c;--accent2:#a87b4f;--hot:#f0d6b4;--warn:#d9a24e;--err:#c06464;
  --actor:#b49cff;--system:#8aa8e6;--app:#6fa595;--store:#d9a24e;--component:#a59d93;--group:#7a7480;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f6f2e8;--canvas:#fbfaf5;--dot:#e6dec9;--bar:#ffffff;--panel:#ffffff;--card:#ffffff;--card2:#f6f2e8;--ink:#294342;--muted:#55625f;--faint:#8f9894;--line:#e6dec9;--edge:#8f9894;--accent:#07807d;--accent2:#05615f;--hot:#07807d;--warn:#a8701c;--err:#cd3c35;color-scheme:light;}}
:root[data-theme="light"]{--bg:#f6f2e8;--canvas:#fbfaf5;--dot:#e6dec9;--bar:#ffffff;--panel:#ffffff;--card:#ffffff;--card2:#f6f2e8;--ink:#294342;--muted:#55625f;--faint:#8f9894;--line:#e6dec9;--edge:#8f9894;--accent:#07807d;--accent2:#05615f;--hot:#07807d;--warn:#a8701c;--err:#cd3c35;color-scheme:light;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 "Segoe UI Variable Text","Segoe UI",Inter,system-ui,-apple-system,sans-serif;height:100vh;display:grid;grid-template-rows:auto auto 1fr;overflow:hidden}
button,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--faint)}
/* top bar */
#top{display:flex;align-items:center;gap:14px;padding:0 12px;height:44px;background:var(--bar);border-bottom:1px solid var(--line)}
#top button{border:0;background:none;color:var(--muted)}
.logo{width:26px;height:26px;border-radius:50%;border:1px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-family:"Cormorant Garamond","Palatino Linotype",Georgia,serif;font-weight:600}
.tab{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--muted);padding:13px 2px;border-bottom:2px solid transparent}
.tab.on{color:var(--accent);border-color:var(--accent)}
#title{flex:1;text-align:center;line-height:1.2}#title b{display:block;font-size:14px}#title small{color:var(--muted)}
/* sub bar: breadcrumbs */
#sub{display:flex;align-items:center;gap:10px;padding:0 12px;height:36px;background:var(--bar);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
#crumbs a{cursor:pointer;color:var(--muted);padding:4px 8px;border-radius:5px}#crumbs a:last-child{color:var(--ink);background:var(--card);border-bottom:2px solid var(--accent)}
#sub button{border:0;background:none;color:var(--muted);font-size:16px;padding:2px 8px;border-radius:5px}#sub button:hover{background:var(--card);color:var(--ink)}
#home{color:var(--muted);text-decoration:none;font-size:12px;white-space:nowrap}
#crumbs .sep{color:var(--faint)}
#lvl{margin-left:auto;color:var(--muted);font-size:12px;padding-left:12px}
/* legend + tooltip */
#legend{position:absolute;top:12px;right:12px;width:262px;max-height:calc(100% - 24px);overflow:auto;background:var(--bar);border:1px solid var(--line);border-radius:8px;font-size:12px;cursor:default}
#legend summary{padding:7px 12px;cursor:pointer;color:var(--muted);font-weight:600;list-style:none}
#legend summary::-webkit-details-marker{display:none}
#legend summary::before{content:"›";display:inline-block;width:12px;transition:transform .15s}
#legend[open] summary::before{transform:rotate(90deg)}
#legend .lg{display:grid;grid-template-columns:26px 1fr;gap:7px 8px;align-items:center;padding:2px 12px 12px}
#legend .lg svg{width:24px;height:18px;overflow:visible;flex:none}
#legend .ty{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:6px 8px}#legend .ty div{display:flex;align-items:center;gap:7px}
#legend .lg span{color:var(--ink)}#legend .lg hr{grid-column:1/-1;width:100%;border:0;border-top:1px solid var(--line);margin:2px 0}
#tip{position:fixed;z-index:20;max-width:320px;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 10px;box-shadow:0 6px 18px rgba(0,0,0,.28);font-size:12px}
#tip b{font-size:13px}#tip .m{color:var(--muted);margin:1px 0 4px}#tip .w{color:var(--warn)}
@media (prefers-reduced-motion:reduce){.node,.edge,#legend summary::before{transition:none!important}}
main{display:grid;grid-template-columns:56px 1fr 320px;min-height:0}
/* left toolbar */
#tools{background:var(--bar);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0}
#tools button{width:44px;border:0;background:none;color:var(--muted);font-size:10px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:6px}
#tools button:hover,#tools button.on{background:var(--card);color:var(--ink)}
#tools svg{width:20px;height:20px}
#tools hr{width:30px;border:0;border-top:1px solid var(--line)}
/* canvas */
#stage{position:relative;overflow:hidden;background-color:var(--canvas);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:18px 18px;cursor:grab}
#stage.pan{cursor:grabbing}
#stage>svg{position:absolute;inset:0;width:100%;height:100%}
#drop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:16px}
#bottom{position:absolute;left:12px;bottom:12px;display:flex;gap:8px;align-items:center}
#bottom select,#bottom button{background:var(--bar)}
#zoomlbl{color:var(--muted);font-size:12px;min-width:40px;text-align:center}
/* nodes */
.node{cursor:pointer}
.node .box{fill:var(--card);stroke:var(--line);stroke-width:1}
.node:hover .box{stroke:var(--faint)}
.node.sel .box{stroke:var(--accent);stroke-width:2}
.node .t{fill:var(--ink);font-weight:600;font-size:13px}
.node .s{fill:var(--muted);font-size:11px}
.node .ico{stroke-width:1.6;fill:none}
.node .d{fill:var(--muted);font-size:11px}.node .d.none{font-style:italic}
.node .stk{fill:var(--card2);stroke:var(--faint)}
.node .fl{stroke:var(--line)}
.node .ft{fill:var(--muted);font-size:10.5px}
.node .zhit{fill:transparent}.node .zbtn{cursor:pointer}.node .zbtn:hover .zhit{fill:color-mix(in srgb,var(--accent) 14%,transparent)}
.node .zt{fill:var(--accent);font-size:11px;font-weight:600}.node .zbtn:hover .zt{text-decoration:underline}
.node.ext .box{fill:transparent;stroke-dasharray:4 3}
.node.ext .t{fill:var(--muted)}
.node.dim,.edge.dim{opacity:.15}
.node,.edge{transition:opacity .2s}
.node.fade,.edge.fade{opacity:.18}
.node:focus-visible .box{stroke:var(--accent);stroke-width:2}
#stage>svg.old{pointer-events:none}
#stage>svg.zin .node:not(.tgt),#stage>svg.zin .edge,#stage>svg.zin .scope{opacity:0;transition-duration:.3s}
.node.issue .box{stroke:var(--err);fill:color-mix(in srgb,var(--err) 14%,var(--card))}
.node.issue.sel .box{stroke:var(--accent)}
.node .bdg circle{fill:var(--err)}.node .bdg text{fill:#fff;font-weight:700;font-size:11px;text-anchor:middle}
#q{width:150px;background:var(--bar);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font:inherit}
#smsg{color:var(--warn);font-size:12px}
.pbody ul{margin:4px 0;padding-left:18px}
.scope rect{fill:rgba(255,255,255,.015);stroke:var(--faint);stroke-dasharray:5 4}
.scope text{fill:var(--muted);font-size:11px}
/* edges */
.edge{cursor:pointer;color:var(--edge)}
.edge path{fill:none;stroke:currentColor;stroke-width:1.3}
.edge .hit{stroke:transparent;stroke-width:12}
.edge text{fill:var(--muted);font-size:10.5px;paint-order:stroke;stroke:var(--canvas);stroke-width:4px}
.edge .lbg{fill:var(--canvas);stroke:none}
.edge .num{fill:var(--accent);font-weight:700}
.edge.future path{stroke-dasharray:6 4}.edge.deprecated{color:var(--warn)}.edge.removed{color:var(--err)}.edge.removed path{stroke-dasharray:2 3}
.edge.rel{color:var(--accent)}.edge.rel path:not(.hit){stroke-width:2.2}.edge.rel text{fill:var(--ink)}
.edge.hot{color:var(--hot)}.edge.hot path{stroke-width:2.4}.edge.hot text{fill:var(--hot);font-weight:600}
/* right panel */
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.ptabs{display:flex;gap:18px;padding:0 16px;border-bottom:1px solid var(--line)}
.ptabs a{padding:10px 0;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.ptabs a.on{color:var(--ink);border-color:var(--accent)}
.pbody{padding:14px 16px;overflow:auto;flex:1}
.lbl{color:var(--muted);font-size:11px;margin:12px 0 4px}
.field{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.pbody h2{margin:0;font-size:16px}
.chip{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;background:var(--card2);color:var(--muted);margin:6px 4px 0 0}
.pbody a{color:var(--accent)}.pbody code{font-size:12px;word-break:break-all}
.stepnav{display:flex;align-items:center;justify-content:space-between;margin:12px 0}
.stepnav button{border:0;background:none;color:var(--accent);font-weight:600}
.stepnav button.nx{background:var(--accent);color:var(--bg);border-radius:6px}
.stepnav span{color:var(--muted);font-size:12px}
.step{display:grid;grid-template-columns:28px 1fr;gap:4px 8px;padding:10px;border-radius:8px;border:1px solid transparent;cursor:pointer;margin-bottom:6px}
.step:hover{background:var(--card)}
.step.on{background:var(--card);border-color:var(--accent)}
.step .n{grid-row:span 3;color:var(--muted);font-size:10px;line-height:1.1}.step .n b{display:block;font-size:16px;color:var(--ink)}
.step .ft{display:grid;grid-template-columns:1fr 18px 1fr;gap:4px;font-weight:600}.step .ft i{color:var(--accent);font-style:normal}
.step .via{color:var(--muted);font-size:12px}
.empty{color:var(--muted)}
.embed{grid-template-rows:auto 1fr}
.embed #top,.embed #tools,.embed aside,.embed #bottom,.embed #legend{display:none}
.embed main{grid-template-columns:1fr}
.shell{grid-template-rows:auto 1fr}.shell #top{display:none}
@media (max-width:760px){main{grid-template-columns:1fr;grid-template-rows:1fr 42vh}#tools{display:none}aside{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header id="top">
  <div class="logo">S</div>
  <a id="home" href="/">← Strata</a><span class="tab">MODEL</span><span class="tab on">DIAGRAMS</span>
  <div id="title"><b id="mname">Strata</b><small id="mpath">Chưa mở model</small></div>
  <button id="theme" title="Đổi giao diện sáng/tối">◐</button>
</header>
<nav id="sub"><button id="hb" title="Lùi (Alt+←)" aria-label="Lùi">←</button><button id="hf" title="Tới (Alt+→)" aria-label="Tới">→</button><span id="crumbs"></span><span id="lvl"></span></nav>
<main>
  <div id="tools">
    <button class="on" title="Kéo để di chuyển"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 3l14 8-6 2-2 6z"/></svg>Move</button>
    <button id="fit" title="Vừa khung (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Fit</button>
    <button id="zin" title="Phóng to (+)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5M8 11h6M11 8v6"/></svg>Zoom in</button>
    <button id="zout" title="Thu nhỏ (-)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5M8 11h6"/></svg>Zoom out</button>
    <hr>
    <button id="up" title="Lên một tầng (Esc)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 19V5M6 11l6-6 6 6"/></svg>Up</button>
  </div>
  <div id="stage">
    <div id="drop">Đang tải model…</div>
    <details id="legend" open><summary>Chú giải</summary><div class="lg" id="lgbody"></div></details>
    <div id="bottom">
      <select id="tag"><option value="">Tags: tất cả</option></select>
      <input id="q" list="qlist" placeholder="Tìm object…" autocomplete="off"><datalist id="qlist"></datalist><span id="smsg"></span>
      <span id="zoomlbl">100%</span>
    </div>
  </div>
  <aside>
    <div class="ptabs"><a data-p="info" class="on">Chi tiết</a><a data-p="flows">Diagram flows</a></div>
    <div class="pbody" id="pinfo"><p class="empty">Bấm một ô để xem chi tiết và làm nổi các kết nối của nó. Bấm đúp, Enter hoặc “… bên trong ›” để đi vào bên trong; bấm nền để bỏ chọn.</p></div>
    <div class="pbody" id="pflows" hidden></div>
  </aside>
</main>
<div id="tip" hidden></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const P=new URLSearchParams(location.search);
let M=null, byId={}, focus=null, selected=null, flow=null, step=0, codeBase="/code/";
const codeQ=P.get("project")?"?project="+encodeURIComponent(P.get("project")):"";
let cam={x:0,y:0,k:1}, graphBox=null, pos={};
const ISSUE={dead_link:"Link chết",no_link:"Không có link",no_desc:"Thiếu mô tả"};
const NW=240, NH=108;
const TYPE_LABEL={actor:"Người dùng",system:"Hệ thống",app:"Ứng dụng",store:"Kho dữ liệu",component:"Thành phần",group:"Nhóm"};
let scopeRect=null, curEdges=new Map(), tok=0, busy=false;
const EMPTY='<p class="empty">Bấm một ô để xem chi tiết và làm nổi các kết nối của nó. Bấm đúp, Enter hoặc “… bên trong ›” để đi vào bên trong; bấm nền để bỏ chọn.</p>';
// Small line icons per C4 type, drawn in a 20x20 box.
const ICON={
  actor:'<circle cx="10" cy="6" r="3.5"/><path d="M3 18c1-4 4-6 7-6s6 2 7 6"/>',
  system:'<rect x="2" y="3" width="16" height="14" rx="2"/><path d="M2 7h16"/>',
  app:'<rect x="2" y="2" width="7" height="7" rx="1"/><rect x="11" y="2" width="7" height="7" rx="1"/><rect x="2" y="11" width="7" height="7" rx="1"/><rect x="11" y="11" width="7" height="7" rx="1"/>',
  store:'<ellipse cx="10" cy="4.5" rx="7" ry="2.5"/><path d="M3 4.5v11c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5v-11M3 10c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5"/>',
  component:'<path d="M10 2l7 4v8l-7 4-7-4V6z"/><path d="M3 6l7 4 7-4M10 10v8"/>',
  group:'<rect x="2" y="2" width="16" height="16" rx="2" stroke-dasharray="3 2"/>'
};

function load(m){
  M=m; byId={}; M.issues=m.issues||{}; M.links=m.links||{}; M.open_issues=m.open_issues||[];
  $("#qlist").innerHTML=(m.objects||[]).map(o=>`<option value="${esc(o.id)}">${esc(o.name||"")}</option>`).join("");
  (m.objects||[]).forEach(o=>byId[o.id]=o);
  (m.connections||[]).forEach((c,i)=>c.id=c.id||`c${i}`);
  $("#tag").innerHTML='<option value="">Tags: tất cả</option>'+Object.keys(m.tags||{}).map(t=>`<option>${esc(t)}</option>`).join("");
  $("#drop").style.display="none"; document.title=`${m.name||"Model"} · Strata`; $("#mname").textContent=m.name||"Model";
  flow=null; step=0; renderFlows();
  const h=P.get("focus")||location.hash.slice(1);
  if(h&&byId[h]){if(kids(h).length) go(h,1); else {go(byId[h].parent||null,1); selected=h; render(true)}} else go(null,1);
}
const kids=id=>(M.objects||[]).filter(o=>(o.parent||null)===id);
const chain=id=>{const r=[];for(let o=byId[id];o;o=byId[o.parent])r.unshift(o.id);return r};
const nm=id=>byId[id]?.name||id;
// Map an endpoint to the object visible in the view focused on F.
function lift(id,F){
  const fc=new Set(F?chain(F):[]); let o=byId[id];
  while(o){const p=o.parent||null; if(p===F) return {id:o.id,ext:false}; if(p===null||fc.has(p)) return {id:o.id,ext:true}; o=byId[p];}
  return null;
}
function view(F){
  const nodes=new Map(), edges=new Map();
  kids(F).forEach(o=>nodes.set(o.id,{o,ext:false}));
  for(const c of M.connections||[]){
    const a=lift(c.from,F), b=lift(c.to,F); if(!a||!b||a.id===b.id||(a.ext&&b.ext)) continue;
    [a,b].forEach(x=>{if(!nodes.has(x.id))nodes.set(x.id,{o:byId[x.id],ext:x.ext})});
    const k=a.id+"→"+b.id; const e=edges.get(k)||{from:a.id,to:b.id,list:[]}; e.list.push(c); edges.set(k,e);
  }
  return {nodes,edges};
}
const label=e=>e.list.length>1?`${e.list.length} kết nối`:(e.list[0].name||"");
const tech=e=>e.list.length>1?"":(e.list[0].technology||"");
// Smooth a dagre polyline into a curve through the midpoints.
function curve(p){
  if(p.length<3) return `M${p[0].x},${p[0].y}L${p[p.length-1].x},${p[p.length-1].y}`;
  let d=`M${p[0].x},${p[0].y}`;
  for(let i=1;i<p.length-1;i++){const mx=(p[i].x+p[i+1].x)/2,my=(p[i].y+p[i+1].y)/2;d+=`Q${p[i].x},${p[i].y} ${i===p.length-2?p[i+1].x:mx},${i===p.length-2?p[i+1].y:my}`}
  return d;
}

function render(keepCam,keepOld){
  const {nodes,edges}=view(focus);
  const g=new dagre.graphlib.Graph({compound:true});
  g.setGraph({rankdir:M.layout||"LR",nodesep:36,ranksep:90,marginx:40,marginy:40}); g.setDefaultEdgeLabel(()=>({}));
  if(focus) g.setNode("__scope",{});
  nodes.forEach((n,id)=>{g.setNode(id,{width:NW,height:NH}); if(focus&&!n.ext) g.setParent(id,"__scope")});
  edges.forEach(e=>g.setEdge(e.from,e.to,{width:Math.min(200,Math.max(label(e).length,tech(e).length)*6),height:30,labelpos:"c"}));
  dagre.layout(g);
  graphBox={w:g.graph().width,h:g.graph().height};
  curEdges=edges; scopeRect=null;
  pos={}; nodes.forEach((n,id)=>pos[id]=g.node(id));
  const tag=$("#tag").value, hot=flowHot();
  let s=`<svg><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="context-stroke"/></marker></defs><g id="cam">`;
  if(focus){
    const sc=g.node("__scope"), o=byId[focus];
    scopeRect={x:sc.x-sc.width/2,y:sc.y-sc.height/2-14,w:sc.width,h:sc.height+14};
    s+=`<g class="scope"><rect x="${sc.x-sc.width/2}" y="${sc.y-sc.height/2-14}" width="${sc.width}" height="${sc.height+14}" rx="10"/><text x="${sc.x-sc.width/2+12}" y="${sc.y-sc.height/2+2}">${esc(o.name||o.id)} · ${esc(TYPE_LABEL[o.type]||o.type)}</text></g>`;
  }
  edges.forEach(e=>{
    const ge=g.edge(e.from,e.to), c0=e.list[0];
    const hn=e.list.map(c=>hot.get(c.id)).find(v=>v!==undefined);
    const isHot=hn!==undefined, st=e.list.length===1?(c0.status||"live"):"live";
    const dim=(tag&&!e.list.some(c=>(c.tags||[]).includes(tag)))||(flow&&!isHot);
    const lw=Math.max(label(e).length+(isHot?3:0),tech(e).length)*6; // ước lượng độ rộng chữ
    const dir=c0.direction||"outgoing", d=curve(ge.points);
    const mk=(dir!=="none"?'marker-end="url(#ar)"':"")+(dir==="bidirectional"?' marker-start="url(#ar)"':"");
    s+=`<g class="edge ${st} ${isHot?"hot":""} ${dim?"dim":""}" data-e="${esc(e.from+"→"+e.to)}"><path class="hit" d="${d}"/><path d="${d}" ${mk}/>

  .then(d=>load({...d.meta,objects:d.objects,connections:d.connections,flows:d.flows,issues:d.issues,links:d.links,open_issues:d.open_issues}))
