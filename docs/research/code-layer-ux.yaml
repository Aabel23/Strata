title: How other tools show the code level, and what Strata builds
summary: Survey of how architecture tools and code explorers display files, classes and functions below a component, and the derived, read-only code level chosen for Strata's Architect view.
code: [strata/symbols.py, viewer/index.html]

blocks:
  - md: |
      ## 1. Conclusion
      **Status: research done; the user asked to build it (2026-10-23).** Sources were read with Firecrawl as excerpts or extracted answers; no screenshots were viewed. Claims marked UNVERIFIED come from general knowledge.

      - Tools that go below the component level **generate it from an index** (Sourcetrail, SciTools Understand, Visual Studio Code Map, Doxygen). IcePanel refuses to diagram C4 level 4 at all, because hand-drawn code diagrams rot, and links out to the IDE or repo instead.
      - Code explorers (VS Code, JetBrains, Zed, GitHub) show the code level as an **outline tree** (file, class, method) with kind icons, a filter box, breadcrumbs and an inline source peek.
      - Strata already has the data: the `owns` globs say which files a component holds, and `symbols.py` indexes classes and functions with signatures and line ranges. So the code level is **derived and read-only**, shown in a side panel beside the map. Nothing is stored in the YAML map.

