  - md: |
      ## 4. Recurring patterns
      1. **Outline tree** (VS Code, JetBrains, Zed): rows with kind icon, name, signature, size, grouped file, class, method. Low effort, directly fed by the index, no relationships shown.
      2. **Filter and search over symbols**: what makes thousands of symbols tolerable. Low effort client-side.
      3. **Breadcrumbs with sibling dropdowns**: ties the C4 path to the code path, `system > app > component > file > class > method`.
      4. **Inline source peek / synced source pane** (VS Code Peek, Sourcetrail, CodeSee): the map becomes an entry point to code. Needs a read route for source; highlighting needs a library, so skip it.
      5. **Expand-in-place nesting with a count badge** (Visual Studio, Sourcetrail, CodeSee): no context switch but layout reflow and poor scaling.
      6. **Aggregated edges, Show Contributing Links** (Visual Studio): readable zoomed out, needs edges per level.
      7. **Treemap of the component** (NDepend): area by lines, colour by symbol count; medium effort.
      8. **Not buildable here:** dependency matrix and call graphs (the index has no edges), 3D city (needs WebGL).

  - md: |
      ## 5. What the symbol index offers today
      `symbols.py` keeps `file(project, path, sha256, mtime, size)` and `symbol(id, file, kind, name, parent_id, signature, start_line, end_line, doc1, visibility, body_hash)`. Kinds are only class, def and async def, nested through `parent_id`. Visibility is public or private (leading underscore). It is Python only, a file with a syntax error yields zero symbols, and there are no module-level constants, imports, call edges or references. `ls`, `find`, `show` (capped at 200 lines) and `resolves` exist. Missing for this feature: a per-file line count, and an HTTP read route.

  - md: |
      ## 6. Design chosen for Strata (derived, read-only)
      - **Where:** a component in the Architect view gets a **Code** action. It opens a side panel docked to the right, so the map stays visible. Double-clicking a component with no child objects opens it too.
      - **Panel:** breadcrumb `system > app > component > file > symbol`, a filter box with kind and public-only toggles, then an **outline tree** of the component's files (from `owns`), each expandable to classes and methods, lazy per file. Rows show kind icon, name, muted signature, line count and a private cue. Collapsed by default with a symbol count per file; rows capped at 500 with a "+N more" row (Doxygen-style truncation marker).
      - **Source peek:** selecting a symbol shows its source in a plain `<pre>` below the tree (200-line cap with a message), loaded lazily; no syntax highlighting.
      - **Drift cues:** files owned by the component but missing from disk are listed as missing; symbols are refreshed from disk before showing.
      - **Link:** the URL hash carries the component and symbol id (`path::Class.method`) so a view can be shared.
      - **Data and routes (GET only):** the component's files come from its `owns` globs; the symbol cache is refreshed lazily on demand (it is derived data, rebuilt from files, like the doc autoscan). New read routes: file list for a component, symbols for a file, source for a symbol.
      - **Not built:** hand-drawn code objects in the YAML, expand-in-place on the SVG map, call graphs, dependency matrix, 3D city, syntax highlighting, editing code from the viewer, non-Python languages (later through the regex or tree-sitter extractors from the other research doc).

  - md: |
      ## 7. Later steps
      - Treemap tab for a component: area by lines, colour by symbol count.
      - Import edges between files, aggregated up to components (Visual Studio style), labelled approximate.
      - Pin a symbol as a contract endpoint from the panel.
      - JS and SQL symbols through the extractors proposed in `research/tree-sitter-agent-code-reading.yaml`.

  - md: |
