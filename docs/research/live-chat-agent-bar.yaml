  - md: |
      ## Responsive behavior
      On a narrow viewport the sidebar splitter is hidden and the shell collapses to one column (`viewer/app.css:218-219`). Keep the centre view usable; the chat panel and bar must not push it off screen.

      Two things stay separate. A chat session is an interactive multi-turn Codex thread. A Kernel B1 run is a one-ticket supervised subprocess with a Gate. Chat does not change a B1 run, a task status or a Gate result, and an open chat is not a B1 run. Showing B1 run cards in the bar remains future work and needs the B1 `usage` fields confirmed before any token totals appear.

