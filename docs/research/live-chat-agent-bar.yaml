title: Viewer chat and agent bar design
summary: Implemented Codex app-server chat in the four-pane viewer (#312-#326) with ChatGPT, OpenRouter or OmniRoute routing, isolated worktrees and per-action approval; live authentication is not yet validated end to end.
code: [viewer/app.html, viewer/app.css, viewer/app.js, strata/server.py, strata/chat.py, strata/chat_codex.py, docs/research/kernel-b1.yaml, docs/c4/flows/live_chat.yaml]
blocks:
  - md: |
      ## Status and job
      Design record for #304, rewritten in #318 to match what shipped in #312-#326. The first proposal chose the Claude Agent SDK. The implementation is Codex-first: the server spawns the local `codex app-server` CLI over stdio and drives it with JSON-RPC. A user working in Board, Architecture, Code map or Docs can talk to a coding agent beside the main view, see every session in a bottom bar, and approve or deny each proposed command or file change.

      The owner-approved layout is unchanged: left sidebar, centre view, right chat panel, bottom agent bar. Status: the code, the API and the unit tests exist. No test or run has exercised real sign-in or real inference, so authentication is a known gap (see the last section).

