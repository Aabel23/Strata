  - md: |
      ## Ghi chú và câu hỏi mở
      **Lỗi trong code hiện tại (chưa sửa):**
      - `strata/db.py:74-76`: `audit` ghi cứng `actor_role="cli"`, nên không phân biệt được ai đã ghi.
      - `strata/db.py:92-97`: `set_item` cho phép chuyển sang trạng thái bất kỳ, kể cả từ `done` về `open`. Hàm đọc rồi mới ghi mà không có điều kiện `WHERE status=?`, nên hai agent ghi cùng lúc sẽ đè nhau.
      - `strata/c4.py:210`: import xóa mọi dòng không có trong YAML. Nếu dùng nguyên cách này cho lộ trình thì sẽ xóa mất bước đã `done`.

      **Chưa kiểm chứng:** cơ chế workflow của Jira và Phabricator (không tra được nguồn), cấu trúc `tasks.md` của Kiro.

  - question:
