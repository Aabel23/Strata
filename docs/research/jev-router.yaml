  - md: |
      ## Nhãn và quyết định (đề xuất)
      **Hai trục, mỗi trục một nhãn chính**, kèm top-2 xác suất:
      - Giai đoạn: `S0` ngoài quy trình, `S1`–`S6` theo HIEN_PHAP. Mặc định giữ giai đoạn hiện tại của project.
      - Loại câu: liệt kê trong bảng dưới.

      Câu nhạy cảm (`chốt`, `đồng_ý_lửng`, `từ_chối`, `đổi_luật`) bắt buộc có **neo**, tức là câu hỏi chờ hoặc cổng mà câu này trả lời. Không có neo thì không được `confirm`. Tách `đồng_ý_lửng` ("ừ", "hợp lý") khỏi `chốt` vì nhầm hai nhãn này là lỗi đắt nhất.

      Input chỉ gồm câu hiện tại, giai đoạn, cổng đang mở, tối đa 3 câu hỏi chờ và 2–3 lượt gần nhất (đã cắt ngắn). Không gửi nội dung doc, task hay C4: input dài làm giảm độ chính xác, và chính tài liệu của model cũng ghi nhận điều này.

