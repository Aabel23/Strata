  - md: |
      ## Đánh giá
      - Bộ dữ liệu: 500–1000 lượt user lấy từ transcript thật. Mỗi mẫu kèm trạng thái tại thời điểm đó. Chia theo phiên, không chia theo lượt.
      - Có khoảng 100 mẫu `chốt` dương và nhiều mẫu khó như "chốt luôn nhỉ?" (đây là câu hỏi, không phải chốt) hay "được rồi nhưng…".
      - LLM gán nhãn trước, user kiểm 100% nhãn nhạy cảm.
      - Chỉ số:
        - precision của `confirm(chốt)` ≥ 0.95;
        - recall của chốt (tính cả confirm lẫn ask) ≥ 0.85;
        - ECE riêng cho nhãn nhạy cảm;
        - tỉ lệ hỏi lại;
        - tỉ lệ đặt sai giai đoạn.
      - Chạy cùng bộ dữ liệu cho Jev và Haiku để so trên tiếng Việt thật.

