  - md: |
      Ngưỡng ở trên chỉ là điểm xuất phát. Lỗi trong vùng xám đều rơi về `passthrough`, nghĩa là Claude hiện tại nhận nguyên văn câu, không mất gì. Nhận nhầm "chốt" đắt hơn nhiều so với bỏ sót, nên chấp nhận tỉ lệ hỏi lại cao hơn ở các nhãn nhạy cảm. Cách làm này lấy từ fallback hai ngưỡng (độ tin và khoảng cách top-2) của Rasa, `nluIntentConfidenceThreshold` của Amazon Lex, và mẫu "ngưỡng theo rủi ro" trong tài liệu của TypeSafe.

      ## Tích hợp và vận hành (đề xuất)
      **Các bước:**
      1. Hook `UserPromptSubmit` kiểu command, viết bằng Python stdlib. Bỏ qua slash command và câu ngắn kiểu "ok", "tiếp".
      2. Trước khi gửi, che bí mật bằng regex (khóa, token, email, đường dẫn vault) và cắt còn khoảng 2000 ký tự. Có công tắc tắt theo từng project.
      3. Timeout cứng 3 giây. Lỗi hoặc quá hạn thì passthrough. Lỗi 3 lần liên tiếp thì tự tắt 10 phút. Không bao giờ dùng `decision:"block"` hay `onFailure:"block"`.
      4. Chèn `additionalContext` khoảng 300 ký tự, ví dụ: "Giai đoạn 3 Research: nạp research-stage, chưa code". Gặp `confirm` thì dặn: "đề xuất, hỏi user bằng AskUserQuestion, chưa ghi".
      5. Có lệnh `/stage N` để user ghi đè nhãn khi model đoán sai.
      6. Nhật ký `~/.claude/jev/log.jsonl` (quyền 600): mặc định lưu bản băm của câu, kèm nhãn, xác suất, hành động, độ trễ, và việc user có sửa lại ở lượt sau hay không.

