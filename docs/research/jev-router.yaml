  - md: |
      ## Model quyết định (đề xuất)
      **Jev** của TypeSafe AI, ra mắt ngày 15/09/2026, là model "System One". Nó nhận `state` cùng các câu hỏi `choice`/`score`/`noul` và trả về lựa chọn, `confidence` và `probabilities` cho từng nhãn. Nó không sinh văn bản. Giá $0.042 cho mỗi triệu token input, output miễn phí. Độ trễ tự báo là 70–500 ms. Endpoint `POST /v1/systemone`, có SDK Python.

      **Giới hạn đã được tài liệu chính thức thừa nhận:**
      - Tiếng Anh là ngôn ngữ chính; ngôn ngữ khác "không đều", tiếng Việt không được nhắc tới.
      - Calibration chưa được bên thứ ba kiểm.
      - Thiên về lựa chọn đứng đầu danh sách, dễ bị nội dung đối kháng lái.
      - Không có abstain riêng; phải tự thêm lựa chọn "none" vào danh sách.
      - Đang ở giai đoạn early access, chỉ chạy qua API đặt ở Mỹ, ZDR chỉ có cho gói enterprise.

      **Ngôn ngữ:** user nói với bộ định tuyến bằng tiếng Anh, nên nhãn, `instructions` và `criteria` cũng viết bằng tiếng Anh. Làm vậy tránh được điểm yếu về đa ngữ của Jev.

      **Đề xuất:** đặt model sau một giao diện duy nhất, `classify(state) → {stage, act, anchor, probs}`, để đổi được giữa Jev, Claude Haiku với structured output, hoặc một classifier cục bộ. Ghim phiên bản (`jev-1.13.0`), không dùng alias `jev-latest`.

