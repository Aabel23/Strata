  - md: |
      ## Ghi chú và câu hỏi mở
      - Strata chưa có "câu hỏi chờ" trong DB. Neo cần danh sách câu hỏi có id, mỗi câu kèm phương án.
      - `strata/db.py:74-76`: audit ghi cứng actor `cli`, nên chưa ghi được actor=user (chưa sửa).
      - Model chỉ gợi ý: Claude có thể lờ dòng context được chèn. Lối thoát là `/stage`.
      - Chưa kiểm chứng: calibration độc lập, độ trễ đo từ Việt Nam, trang pháp lý của TypeSafe (docs.typesafe.ai/legal).

