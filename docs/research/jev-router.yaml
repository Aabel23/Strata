title: Bộ định tuyến hội thoại theo giai đoạn
summary: Một model quyết định đứng trước mỗi câu của user, xác định giai đoạn quy trình và loại câu, chèn hướng dẫn giai đoạn cho Claude. Câu đụng quy trình chỉ được đề xuất, user xác nhận mới ghi.
code: [agent/HIEN_PHAP.md, agent/hooks/block_secondbrain_creative_agents.py, strata/schema.sql]

blocks:
  - md: |
      ## Bức tranh toàn cục
      Mỗi câu user gõ đi qua một hook `UserPromptSubmit` trước khi Claude nhận. Hook gửi câu (đã lọc) cùng trạng thái rút gọn cho một **model quyết định**. Model trả về nhãn có kiểu kèm xác suất. Từ đó, **code tất định** chọn một trong bốn hành động:
      - `route`: chèn vài dòng hướng dẫn giai đoạn;
      - `confirm`: dặn Claude hỏi xác nhận;
      - `ask`: hỏi lại bằng câu (a)/(b);
      - `passthrough`: không làm gì.

      Vẫn giữ **một phiên chat chính**. "Nối với Claude của giai đoạn" nghĩa là chèn hướng dẫn của giai đoạn đó vào lượt hiện tại, không phải chuyển sang phiên khác. Hook không bao giờ chặn câu của user, cũng không bao giờ ghi vào Strata.

