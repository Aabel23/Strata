title: Layered C4 map format (4 zoom levels + symbol index)
summary: New map format for AI agents. L1 system, L2 container (incl. devices), L3 module with boundary contracts, L4 behavior state machine per module in behavior/<module>.yaml, plus a tree-sitter symbol index and on-demand source slices. Status research; provisional decisions on Q1–Q9, pending the step 0 migration test.
code: [docs/AGENT_C4.md, strata/c4.py, strata/context.py, examples/project1_app.strata.yaml]

blocks:
  - md: |
      ## Summary
      **Status: research. Provisional decisions recorded below; final only after the step 0 migration test.**

      The map moves to four zoom levels plus a generated symbol index. An agent then reads map → module → behavior → one function, and never opens a whole file.
      - Levels 1–3 live in one hand-written `docs/c4/map.yaml`.
      - Level 4 is one file per module, named after it: `docs/c4/behavior/<module_id>.yaml`.
      - Code detail comes from a tree-sitter symbol index (generated, never hand-written) and source slices read live from disk.

  - md: |
      ## The layers
  - table:
      head: [Layer, Answers, Written by, Stored in, Read budget]
      rows:
        - [L1 System, "who and what exists, who talks to whom", human / main agent, map.yaml, ~600 tokens]
        - [L2 Container, "what runs inside a unit: service, DB, queue, firmware, device", human / main agent, map.yaml, ~1.2k tokens per system]
        - [L3 Module, "which feature block owns this; its boundary contract", human / main agent, map.yaml, ~2.5k tokens per container]
        - [L4 Behavior, "what happens inside a module, in what order, what can fail", human / main agent (reviewed), "behavior/<module_id>.yaml", one file per edit]
        - [Symbol index, "what code exists in a module, where, with which signature", tool only (tree-sitter), separate SQLite cache, 20–50 lines per module]
        - [Source, the actual lines, nobody (live from disk), "-", one symbol at a time]
  - md: |
      **Agent reading path**
      1. `c4 view` (L1) → `c4 view <system>` (L2) → `c4 view <container>` (L3 module cards)
      2. `c4 behavior <module>` (L4)
      3. `sym ls <module> [--public]` → `sym show <symbol_id> [--sig-only | --ctx N]`

      **Joins between layers**
      - **Map → code:** each module's `owns` globs. A file belongs to exactly one module.
      - **L3 ↔ L4:** event ids. Events a machine reacts to must be L3 inputs or `listens`; events and errors it emits must be L3 outputs.
      - **L4 → code:** a transition's `guard`, `action` and `symbol` names resolve through the symbol index.
      - **Index → source:** `file:start-end`, looked up when read. The YAML never stores line numbers.

  - md: |
      ## Example: user taps Dispense
      1. Flow step `user → app.ui` (L1/L2 hop).
      2. `app → server.relay` uses the L3 contract `relay.send`.
      3. The server sends event `start(ml)` to `machine.pump_ctrl`.
      4. In `behavior/dispense.yaml` (L4), the transition is `idle --start [door_closed]--> priming`, with `symbol: dispense.start`.
      5. The agent runs `sym show dispense.start` and gets only that function.
  - table:
      head: [In the new format, Current code, Role]
      rows:
        - [owns globs, "none (links point to single files)", module → code]
        - [symbol index, none, "replaces the L4 file and function objects"]
        - [level views, "strata/c4.py:392 context_text, _est = chars/4", reuse for level views and module cards]
        - [validation, "c4.check / validate_file / validate_db", "extend with ownership, contract, L4 and symbol checks"]
        - [budgeted text, strata/context.py build, reuse the pattern for symbol sections]

  - md: |
      ## map.yaml (L1–L3) — proposed
      Nesting expresses the hierarchy, with exactly 3 levels: no `parent:` field and no table of valid parent types. Relations are one flat list using dotted ids.

      ```yaml
      project: {id: vending, name: Vending, root: ., budget: {l1: 600, l2: 1200, l3: 2500}}
      shared: ["src/utils/**", "gen/**"]           # exempt from the orphan check
      systems:                                      # L1
        - id: machine
          kind: hardware                            # software|hardware|person|external
          summary: Vending machine in the shop
          containers:                               # L2
            - id: pump_ctrl
              kind: firmware                        # service|app|database|queue|device|firmware|external
              tech: C / RP2040
              summary: Controls pump and door
              modules:                              # L3
                - id: dispense
                  summary: Pours a requested volume
                  state: RAM-only
                  owns: ["fw/dispense/**"]
                  exposes:
                    - {id: start, kind: call, in: "ml: int", out: ok, errors: [DOOR_OPEN, BUSY]}
                  consumes: [pump.set_speed]
                  emits: [dispense.done, dispense.fault]
                  listens: [door.opened]
                  behavior: behavior/dispense.yaml
            - id: pump
              kind: device
              summary: Peristaltic pump
              device: {bus: "GPIO + PWM", driver: fw/drivers/pump.c, direction: actuator, timing: {timeout_ms: 500}}
      relations:
        - {id: srv_cmd, from: cloud.server.relay, to: machine.pump_ctrl.dispense, kind: async, via: MQTT, uses: dispense.start}
        - {id: pump_wire, from: machine.pump_ctrl, to: machine.pump, kind: physical, via: GPIO}
      flows:
        - id: dispense_drink
          steps:
            - {relation: srv_cmd, uses: dispense.start}
            - {at: machine.pump_ctrl.dispense, state: priming}
            - {relation: srv_cmd, reverse: true, event: dispense.done}
      ```
  - table:
      head: [Field, Why, Phase]
      rows:
        - ["id, kind, summary", stable reference; filterable; cheap to read, "MVP, required"]
        - [owns, "map → code; orphan and overlap checks", "MVP, warning if missing"]
        - ["exposes / consumes / emits / listens", "boundary contract; event ids join L3 to L4", "MVP, warning if missing"]
        - ["device (bus, driver, timing, direction)", "minimal hardware facts (AADL device)", MVP for kind device]
        - [state, "RAM-only / persisted / none; high value for agents", MVP]
        - ["status, tags, responsibilities", "useful for people; wordy", later]
        - ["layout, positions, port geometry", belongs to the viewer, not in the model]
  - md: |
      **Sources of the ideas:**
      - C4 defines a component as a group of functionality behind a well-defined interface, not a folder or a deployable unit.
      - Backstage's `providesApis`/`consumesApis` and AsyncAPI operations (send or receive, plus a message) shaped the contract fields.

  - md: |
      ## behavior/<module_id>.yaml (L4) — proposed
      Each file has exactly one of two forms:
      - **machine:** for stateful modules, lifecycles, retries and hardware.
      - **sequence:** for stateless logic. It stays inside one module and never names relations.

      Ideas borrowed:
      - From SCXML: the rules for a well-formed structure.
      - From XState: `after` timeouts, and guards and actions referred to by name.
      - From embedded and PLC practice:
          - each output has a safe value;
          - outputs are set only on state entry;
          - faults latch until a reset;
          - inputs are debounced before they become events;
          - safety transitions are global and take priority.

      ```yaml
      module: dispense            # = file name = L3 id
      form: machine
      source: authored            # authored | extracted
      verified_at: <commit>
      signals:
        - {id: door_closed, dir: in,  kind: digital, debounce_ms: 20}
        - {id: pump_relay,  dir: out, kind: digital, safe_value: 0}
      initial: idle
      states:
        idle:    {desc: Pump off, entry: [pump_off]}
        priming: {entry: [pump_on_low], timeout: {ms: 3000, to: fault}}
        pumping: {entry: [pump_on], timeout: {ms: 60000, to: fault}}
        done:    {entry: [pump_off], terminal: true}
        fault:   {entry: [pump_off, raise_alarm]}      # latched until reset
      transitions:
        - {id: t1, from: idle,    on: start,          to: priming, guard: door_closed, symbol: dispense.start}
        - {id: t2, from: priming, on: flow_detected,  to: pumping}
        - {id: t3, from: pumping, on: volume_reached, to: done, action: [emit_done]}
        - {id: t4, from: fault,   on: reset,          to: idle, guard: door_closed}
        - {id: t5, from: any,     on: door.opened,    to: fault, note: safety}
      invariants:
        - {id: i1, text: "pump_relay never 1 while door open", severity: safety}
      waivers:
        - {state: idle, rule: no_timeout, reason: resting state}
      ```

      ```yaml
      module: price_calc
      form: sequence
      cases:
        - id: calc_total
          trigger: {input: calc_total}
          steps:
            - {do: validate cart, symbol: validate_cart, on_error: {emit_error: BAD_CART, end: true}}
            - {if: cart.coupon, then: [{do: apply coupon, symbol: apply_coupon}]}
            - {do: sum lines, symbol: sum_lines}
          returns: {output: total}
      ```

      **In v1:**
      - Flat states plus `any:` global transitions.
      - `entry` actions.
      - A timeout on each state.
      - A mandatory `id` on every transition, so tests and issues have a stable key.
      - Hardware `signals`.
      - Invariants as text. They are labelled "documented", never "verified".

  - md: |
      ## Symbol index and source CLI — proposed
      - **Indexer:** tree-sitter via `tree-sitter-language-pack`, installed with pip only.
          - It covers Python, TS/JS, C/C++, Dart and Kotlin with exact ranges.
          - Qualified names, signatures and visibility come from a small AST walker per language.
          - Aider moved from ctags to tree-sitter for the same reasons.
      - **Ids:** follow SCIP's naming idea, without package or version parts.
          - Format: `module.Class.method`, or `path/file.c::fn` for C.
          - An arity suffix is added only when two symbols collide.
          - A rename gives a new id, and the old one becomes a dead reference. That is intended: the map must then be fixed.
      - **Staleness:** a file is re-parsed when its mtime and size change and then its sha256 differs. The CLI re-checks the hash before slicing, so line shifts cost nothing.

      ```
      symbol(id PK, project, file, kind, name, parent_id, start_line, end_line, start_byte, end_byte,
             signature, doc1, visibility, body_hash, sig_hash, lang)
      file(path PK, project, sha256, mtime, size, lang, indexed_at)
      module_file(module_id, file)                       -- from owns globs
      symbol_ref(ref_kind, ref_id, symbol_id, status)    -- ok | dead | ambiguous
      ```

      ```
      strata index [--project P] [--changed]
      strata sym ls   <module|file> [--public] [--kind K] [--fmt compact|json]
      strata sym show <symbol_id> [--ctx N] [--sig-only] [--lines a-b]   # capped at 200 lines
      strata sym find <name-pattern>
      strata sym check                                                    # dead / ambiguous / orphan / overlap
      ```
      - `sym ls` prints Aider-style output: one line per symbol, `kind name(sig) -- doc1`.
      - Text is the default output; JSON is opt-in.
      - For a dead id, `sym show` lists candidates (same name or same `body_hash`) instead of failing.

  - md: |
      ## Validation rules (v1)
  - table:
      head: ["#", Rule, Level]
      rows:
        - ["1", owns glob matches no file, error]
        - ["2", a file is owned by two modules, error]
        - ["3", "orphan source file (not owned, not shared); report count + top 10 dirs", warning]
        - ["4", "relation uses must be in the target's exposes; flow event must be in the source's emits", error]
        - ["5", level over its token budget (suggest split), warning]
        - ["6", "behavior file name = module, module exists at L3, no unknown keys", error]
        - ["7", "initial exists; every from/to exists; ids unique", error]
        - ["8", "unreachable state (breadth-first search from initial, counting any)", error]
        - ["9", "non-terminal state with no exit, or no timeout/fault exit, unless waived", error]
        - ["10", "events consistent with L3 contract (both directions); unhandled L3 input", error / warning]
        - ["11", "duplicate (from, on) without guards (syntactic only)", error]
        - ["12", "signals used by guards/invariants exist; outputs declare safe_value", error]
        - ["13", "explicit symbol: does not resolve / guard or action name does not resolve", error / warning]
        - ["14", referenced symbol's body_hash changed since verified_at, warning]

  - md: |
      ## Map and detail split (user direction, 2026-10-22)
      This section supersedes the field lists in the `map.yaml` example above:
      - `exposes` / `consumes` on modules, and `via` / `uses` / `payload` on relations, move out of the map;
      - the separate `protocols/` folder is not used: transport lives in the contract entry.

      **The main map holds only objects and where they link.** All detail lives in separate files, joined by id.
      ```
      docs/c4/
      ├── map.yaml                 # objects + links only
      ├── behavior/<module>.yaml   # state machine or sequence per module (L4)
      └── contracts/<name>.yaml    # one entry per call: transport, body, code endpoints
      ```

      A link keeps a short name and summary for people. `detail` is optional and references one contract entry.
      ```yaml
      # map.yaml
      links:
        - id: app_cmd
          from: cloud
          to: relay
          name: Send machine command
          summary: App asks the server to forward a command to a machine
          detail: relay_command.send        # contracts/relay_command.yaml, entry "send"
      ```

      A contract entry holds everything about the call:
      ```yaml
      # contracts/relay_command.yaml
      - id: send
        transport: HTTPS POST /app/machine/command/send, HPKE envelope
        body:
          request: "{v, enc, ct}  →  sealed {machine_id, command, request_id}"
          response: "HandlerResult {ok, data | error}"
          errors: [BUSY 409, TIMEOUT]
        start: flutter_app/lib/feature/machines/data/machine_service.dart::MachineService.ask
        end: server/src/relay/relay.py::RelayHub.send
      ```
  - table:
      head: [Rule, Detail]
      rows:
        - [Map is block-level, "objects + links (id, from, to, name, summary, detail); no files, functions, protocol or payload in the map"]
        - [Detail is optional, "a link with no detail is valid; the viewer shows an empty detail box to fill or import later; validate reports coverage (e.g. 42/108 links have detail) as info, not error"]
        - [Detail references are checked, "a detail id pointing to a missing contract entry is an error"]
        - [Code endpoints only in contracts, "start / end are symbol ids (file::function) resolved through the symbol index; a renamed or removed function is reported. This replaces L4 file/function objects (Q4) and restores the function-level detail step 0 lost when lifting connections"]
        - [Shared contracts, "several links may point to the same contract entry; start may then be a list of callers"]
        - [Behavior is separate, "a module may reference behavior/<module>.yaml; empty until written"]

  - md: |
      ## Rendering rule (user direction, 2026-10-22)
      The model holds facts only. The renderer computes every graphic feature itself:
      layout, direction, colours, edge routing, port or pin placement, bundling, collapsing and flow highlighting.
      - `positions`, `object_layout`, `layout: LR` and tag colours leave the model and YAML export.
      - Manually dragged positions, if kept, live in a renderer-owned store that agents never read; deleting it falls back to auto-layout.

      ## Relation to the ASIC-style c4map work (decisions #39–#42, tasks #165–#177)
      Same idea, cleaner names: netlist = map, DRC = validation, LVS = symbol-index drift, RTL = L4 behavior, gate level = symbol index.
  - table:
      head: [Item, Status after this split]
      rows:
        - ["#39 kind subtype, #42 DB source of truth", compatible]
        - ["#41 L4 file/function blocks (generated + hand-drawn)", "amend: generated view from the symbol index; hand-drawn blocks become symbol references in contracts"]
        - ["#165 object_layout round-trips through YAML", "conflicts with the rendering rule; move to a renderer-owned store"]
        - ["#165/#169 typed ports + DRC", "open: ports overlap contracts. Proposed: fold ports into contracts (the renderer draws a pin per contract) and point DRC at contracts"]
        - ["#174 / #176 LVS", same as plan steps 4 and 6]

  - md: |
      ## Pruning (user decision, 2026-10-22)
      - **DRC is dropped.** Ports fold into contracts, so port rules have nothing to check. Task #169 was rejected and its code removed (task #185).
      - **Stored layout is dropped.** The renderer always auto-lays out: no `positions`, `object_layout`, layout API or Drawflow editor (task #185).
      - **Validate is kept, minimal.** It is the import gate and the drift detector. Only three checks:
        1. ids are unique and every reference exists (parent, link from/to, link detail, behavior file);
        2. contract `start` / `end` resolve to real code through the symbol index;
        3. flow steps use existing links (continuity warning kept).
      - The earlier 14-rule list (ownership globs, budgets, state-machine reachability and the rest) is deferred, not planned.

      ## Flows in the new split
      - Flows move out of the map into `flows/<id>.yaml`.
      - Steps follow block-level links: `{link: app_cmd}`. Function-level paths come from the link's contract (`start` → `end`), so typical flows drop from 60+ steps to 5–15.
      - `{at: module, transition: t1}` points into the module's behavior file instead of free text.
      - Steps keep only real values (`values:`); `reverse: true` and the continuity check stay.

  - md: |
      ## Provisional decisions (after review, 2026-10-22)
      Nothing is final until the step 0 migration test backs it up.
      Two outside reviews were compared; the table records where they ended up.
  - table:
      head: [Question, Provisional choice, Reason]
      rows:
        - ["Q1. Nested vs flat with parent:", "Flat with parent: (nested only if the migration test shows a measurable gain)", "keeps one-line grep/edit per entity; importer and viewer already use parent; short ids survive parent renames (see Identity)"]
        - ["Q2. File ownership", "One primary owner per file + explicit shared: list", "deterministic navigation without forcing unnatural boundaries; symbol-level ownership later"]
        - ["Q3. Global event namespace", "Yes (module.event, owned by the emitter)", stable references]
        - ["Q4. Remove L4 file/function objects", "Yes, replaced by the symbol index", "they are 84 of 115 objects in project1_app and 40 of 95 in strata, hand-copied and drifting"]
        - ["Q5. Indexer", "stdlib ast for Python first; tree-sitter as an optional extra", "keeps hard rule 2 (stdlib + PyYAML); both current maps are Python"]
        - ["Q6. Index storage", Separate rebuildable cache DB, derived data]
        - ["Q7. L4 machine shape", "Flat states + any: global transitions", easier to validate]
        - ["Q8. Token budgets", Warnings only, numbers need measuring]
        - ["Q9. Relations declared, detected, or both", "Both, as separate records joined by endpoints + kind", "different kinds of evidence; see Relation provenance"]

  - md: |
      ## Design principle
      One normalized graph inside, many representations outside. Strata already works this way:
      SQLite (`c4_*` tables) is canonical, YAML is an authoring/import format, the viewer and `c4 context` read the DB.
      - YAML (flat or nested) is only an authoring format; both normalize to the same graph.
      - The viewer consumes graph projections; agents consume budgeted context projections.
      - Call the result **C4-inspired**: L4 here means behavior, not the standard C4 code level. This matters for any later export to Structurizr or LikeC4.

      ## Layout lives outside the model
      `map.yaml` says what the architecture is; `views/` says how it looks. Moving a node never changes the architecture.
      ```
      docs/c4/
      ├── map.yaml
      ├── behavior/<module_id>.yaml
      └── views/{system,containers,modules}.json
      ```

      ## Identity and renames
      - ids are short, stable, snake_case; the hierarchy lives in `parent:`, not in the id. Moving or renaming a parent never changes a child id.
      - Display text lives in `name`; changing it is free.
      - A real id change goes through one command (`strata c4 rename OLD NEW`, to build) that rewrites the DB, behavior files and `views/`, and reports references it could not rewrite.
      - Dotted ids (as in the map.yaml example above) put the path in the id, so every move rewrites every reference. This is a further reason for Q1 = flat.

      ## Relation provenance (Q9)
      A detected import is evidence, not automatically an architectural dependency (utilities, type-only imports, test helpers).
      ```yaml
      relations:
        - {id: roadmap_db, from: roadmap, to: database, kind: dependency}            # declared
      detected:                                                                       # generated, separate records
        - {from: roadmap, to: database, kind: import, evidence: strata/roadmap.py}
      ```
  - table:
      head: [Declared, Detected, Meaning]
      rows:
        - ["Yes", "Yes", Corroborated]
        - ["Yes", "No", "Possibly stale, or invisible to static analysis"]
        - ["No", "Yes", "Candidate undocumented dependency; a suggestion, not an error"]

  - md: |
      ## Behavior forms
      v1 keeps two forms (machine, sequence). Behavior files are optional: write them only for stateful or hardware modules.
      Other forms (data transformations, event handlers, declarative rules) can come after the MVP.

      ## Open rendering questions (resolve before migrating real data)
      Relation endpoints across levels, cross-level edges, interface visibility, edge aggregation on collapsed nodes, flow navigation, layout restore from `views/`.

  - md: |
      ## Revised plan
  - table:
      head: [Order, Work, Acceptance]
      rows:
        - ["0", Lossless migration experiment, "existing maps stay representable and renderable (three tests below)"]
        - ["1", Finalize Q1–Q9, decisions backed by step 0 evidence]
        - ["2", L1–L3 model + validation, "contracts, ownership, relations validate"]
        - ["3", L4 behavior files, "machines and sequences validate against L3"]
        - ["4", "Symbol index (ast first, tree-sitter optional)", symbols resolve to current source]
        - ["5", Agent context retrieval, task context without whole-file reads]
        - ["6", Relation drift detection, declared vs detected compared]
  - md: |
      ## Step 0: three tests
      The adapter is just a new importer writing the new schema into a scratch DB's existing `c4_*` tables, so the viewer needs no changes.

      1. **Data preservation.** Convert `project1_app` and `strata`. Report every object, parent, connection, interface, flow step, status, link and layout entry as kept, replaced, or unresolved. A file/function object becomes a symbol reference only if that symbol exists in source; otherwise it is kept as an unresolved migration record, never dropped silently.
      2. **Rendering equivalence.** Open the scratch DB in the current viewer. Check hierarchy navigation, edges, collapsed nodes, interface inspection, flow highlighting, layout restore. Compare graph semantics, not pixels.
      3. **Agent context quality.** 3–5 real Strata tasks run against both formats. Measure tokens retrieved, relevant files/symbols found, missing architecture facts, extra source reads, and whether the correct implementation boundary was found. A smaller map is not better if it causes more exploratory reads.

      Flat and nested YAML are both normalized into the same graph for this test; compare authoring, diff quality, validation and retrieval. If nested shows no measurable gain, keep flat.

  - md: |
      ## Problems found (not fixed)
      - `examples/project1_app.strata.yaml` is about 1,000 lines in one file, with L4 file and function objects mixed into the map.
      - Viewer layout (`positions`, `object_layout`, port geometry) is stored in the model.
      - `_est` (`strata/c4.py:389`) estimates tokens as chars/4, which is crude for code. Acceptable for the MVP.

      ## After the MVP
      - Nested or parallel states, an expression language for guards, a model checker.
      - Machine-checkable invariants, guard exclusivity checks, `min_ms` timing windows, `exit` actions, analog signals.
      - Test skeletons generated from L4: one per transition, plus timeout tests (XState graph, GraphWalker).
      - A call graph, LSP/SCIP indexers, embeddings, PageRank.
      - Extracting L4 from code where a state machine is already explicit, as a drift check only.
      - Splitting `map.yaml` per system once it passes about 600 lines.

      ## What not to build
      - A custom DSL.
      - Views or styling in the model.
      - JSON-schema payloads, versions, SLA or auth in contracts.
      - Line numbers in YAML.
      - A whole-repo dump.
      - A file watcher or daemon.
      - Wording that claims safety certification.

      ## Prior work worth studying in detail
      Suggestions only; nothing below has been analysed in depth.
      - **Aider `repomap.py`** (open repo): how it renders signatures with elision.
      - **Serena `find_symbol` / `get_symbols_overview`** (open repo): an overview first, then a symbol body on demand.
      - **XState `@xstate/graph`** (open repo): generating test paths from a machine.
      - **GraphWalker** (open repo): coverage stop conditions.
      - **Quantum Leaps QM and QUTest** (vendor product): the model → C code → trace test loop for embedded state machines.
      - **Backstage** orphan processing (open repo).
      - **LikeC4** CLI/MCP (open repo).
      - **ROS 2** node and topic graph (open repo).

