  - md: |
      ## Lỗ hổng phủ test
      Không có test cho: vòng/parent treo trong C4; section null; id connection/flow/step trùng; import xoá object còn được flow/link tham chiếu; `c4_link` sau reimport; `load_doc` thiếu `blocks`; JS viewer (chỉ có grep "không chèn HTML"); đồng thời/WAL.

      ## Vai trò không phải ranh giới bảo mật
      Ai chạy được `strata.py` hay mở được file DB là `main`. Vai chỉ giữ agent làm đúng phần mình, không chống kẻ xấu. Đã ghi vào quyết định của task MCP.

