  - md: |
      ## Lỗi nổi bật
      - **#21 (cao):** `/code/strata.db-wal` trả 200, 2 MB nội dung DB; server nghe cả IP Tailscale. Bộ lọc là danh sách cấm, `-wal/-shm`, `.env`, khoá riêng đều lọt. Đã kiểm lại bằng curl.
      - **#9 (cao, đã có):** service thật chạy `--host 127.0.0.1,100.107.55.40` nên kiểm Host bị bỏ hẳn.
      - **#37 (cao):** parent vòng lọt `validate`, `c4 context --object` treo vô hạn.
      - **#25 (cao):** hook chặn vault không bao giờ kích hoạt với `general-purpose`, vòng được bằng glob Bash; fail-open khi JSON hỏng.
      - **#32 (trung):** `db.set_item` cho mọi chuyển trạng thái, coder qua MCP đưa task `rejected` về `done`.
      - **#33 (trung):** một dòng UTF-8 hỏng làm sập MCP server.

