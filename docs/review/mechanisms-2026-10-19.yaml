title: Review cơ chế Strata và agent/ (19/10/2026)
summary: Review 12 nhóm cơ chế, 19 lỗi thành issue #21–#39, đề xuất cải tiến xếp ưu tiên. Chỉ review, không sửa code trong đợt này.
code: [strata/service.py, strata/db.py, strata/mcp.py, strata/server.py, strata/c4.py, strata/blocks.py, strata/schema.sql, agent/HIEN_PHAP.md, agent/hooks, agent/skills, viewer]

blocks:
  - md: |
      ## Cách làm
      Bốn reviewer (Sonnet medium) chạy song song, mỗi người 2–3 nhóm, phân tích tĩnh và thử trên DB tạm; bảo mật theo skill `security-audit` mức hướng dẫn. Nhóm 4 (vault RAM/OPEN) do chat chính làm vì subagent không được đọc vault. Test lúc review: **149 passed**.

      **Lỗi** = sai, hỏng hoặc mâu thuẫn, đã ghi thành issue. **Đề xuất** = cải tiến, chưa thành issue.

