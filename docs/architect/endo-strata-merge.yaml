  - md: |
      ## Boundaries and follow-on work
      `celeste/backend` remains excluded pending an owner decision. Untracked files visible in the current Strata worktree are outside this integration design; their provenance and publication status are not inferred here.

      Stage 1–2 establishes the unified product and module ownership. Implemented code and proposed B1 agent execution remain distinct. The current Strata C4 map validates with zero errors (existing warnings remain) and matches its imported DB copy; this narrative diagram is not itself a C4 import. The owner approved the current map and the historical Endo-map disposition. Later implementation tasks may migrate additional material only after their own scope and approval gates.
