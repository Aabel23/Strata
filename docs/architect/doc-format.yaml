title: Document format
summary: A document is a YAML file that holds content only. Strata handles presentation; the author never touches HTML, CSS or JS.
code: [strata/blocks.py, strata/db.py, viewer/page.js, viewer/app.js]

blocks:
  - md: |
      ## Where to write
      Put the `*.yaml` file in the project's `docs_dir`. The server rescans whenever a file is added, edited or deleted. An open page also redraws itself after about 2 seconds. No command is needed.

      The table of contents groups chapters by the subfolders of `docs_dir`: `architect/` (Technical, deep into the code; the architecture overview lives in the Architecture tab), `research/` (Research), `plan/` (Plan), `review/`. Deeper folders become sub-sections, for example `architect/features/`. `code:` only lists related code files and does not affect placement.

  - md: |
      ## Skeleton of a file
      ```
      title: C4 map loading flow            # required
      summary: One sentence for the index   # recommended
      code: [strata/c4.py, strata.py]       # code files/folders the document describes
      blocks:
        - md: |
            ## Heading
            Paragraph, **bold**, `code`, [link](https://...)
        - diagram:
            nodes:
              - {id: a, text: "hello"}
              - {id: b, text: "tab 2", link: c4-import}
            edges: [[a, b, "arrow label"]]
      ```

  - md: |
      ## Blocks
      Each block is a line `- name: content`. These are all the "functions" of the framework. A wrong field makes the page show an error box with the location, for example `block[2] type diagram: missing 'nodes'`.

  - table:
      head: [Block, Fields, Use when]
      rows:
        - [md, "markdown string (#..###, lists, tables, code)", Text]
        - [diagram, "nodes [{id, text, note?, shape? box|decision|store, tone? ui|proc|store|ok|bad|muted|warn, link?, details? [[label, content]]}], edges [[from, to, label?]], dir? TB|LR (default TB), details_title?, caption?", "Block diagrams, flows (drawn with mermaid)"]
        - [table, "head, rows", "Comparison, lookup"]
        - [layers, "rows [{title, cells [{name, note?, status done|plan}]}]", Layered architecture]
        - [swimlane, "lanes (list or {zone: [lane]}), phases?, steps [{lane, text, phase?, after?, data?, label?}], caption?", Multi-party flow in numbered steps]
        - [statemachine, "states [{id, text?, tone? muted|ok|warn|bad, note?, details? [[label, content]]}], transitions [[from, to, label?]], initial?, initial_label?, final?, dir? TB|LR (default TB), details_title?, caption?", State lifecycle (drawn with mermaid)]
        - [mermaid, mermaid string, "Sequence, state, gantt; if there is a `class` line, Strata colors are added"]
        - [legend, "items [{label, status}]", Status legend]
        - [question, "q, options [{label, note?}], recommend?", Question awaiting a decision]
        - [c4, "ids [..], project?", Embed a corner of the C4 map]
        - [query, "src item|decision, where, limit?", Live list of tasks/decisions]

  - md: |
      ## Links in a diagram
      A node's `link` takes the name of another document, relative to the current document's folder (the `.yaml` extension may be omitted), or an `https://` URL. A node with a link is clickable.

      ## Multi-line labels, node shapes, colors
      An arrow label (`diagram` and `statemachine`) is a string or a list; a string containing `\n`, or a list, breaks across lines. A node's `note` goes on the second line. `shape`: `box` (default), `decision` (diamond, yes/no question), `store` (cylinder, storage). `tone` picks the color, default `proc`. The default direction is vertical (`dir: TB`); for flat diagrams with few steps set `dir: LR`. Below each figure there are Zoom and Source buttons (copies the mermaid source).

  - diagram:
      dir: LR
      caption: Path of a document file
      nodes:
        - {id: f, text: "docs/**/*.yaml", note: "content only"}
        - {id: s, text: Auto scan, note: "when a file changes"}
        - {id: i, text: Index, note: "chapters by folder"}
        - {id: r, text: Reader, note: "block renderer"}
        - {id: c, text: Real example, note: "C4 loading flow", link: c4-import}
      edges: [[f, s], [s, i], [i, r, "click"], [r, c]]

  - diagram:
      dir: LR
      caption: Sending events offline-first through an outbox.
      nodes:
        - {id: ev, text: Event occurs, tone: ui}
        - {id: tx, text: Write in one transaction}
        - {id: ob, text: outbox, shape: store}
        - {id: net, text: "Online?", shape: decision, tone: warn}
        - {id: send, text: Send to the server}
        - {id: ack, text: "Server acknowledges?", shape: decision, tone: warn}
        - {id: del, text: Remove from the outbox, tone: ok}
      edges:
        - [ev, tx]
        - [tx, ob]
        - [ob, net]
        - [net, send, "yes"]
        - [net, ob, ["no", "keep, retry later"]]
        - [send, ack]
        - [ack, del, "yes"]
        - [ack, ob, "no"]

  - legend:
      items:
        - {label: "YAML, md, html are all scanned", status: done}
        - {label: "YAML is the default format", status: done}
        - {label: "Convert AGENT_C4.md to YAML", status: plan}

  - md: |
      ## Swimlane
      Just write who does what, in order. Step numbers, phase colors, lane widths, box placement and arrow routes are computed by Strata.
      - `phase`: a number (from 1) or a phase name; if omitted it keeps the previous step's phase.
      - `after`: the steps that must finish first; omitted means the immediately preceding step, `[]` opens a new branch.
      - `data`: a data dependency, drawn dashed. If `text` is a list, each item is a bulleted line.

  - swimlane:
      lanes:
        Sharer: [Sharer, Sharer app]
        Server: [Server]
        New user: [New user app]
        Device: [Machine]
      phases: [Create invitation, Accept and confirm, Machine receives new permissions]
      steps:
        - {lane: Sharer, text: Click "Add person"}
        - {lane: Sharer app, text: Send MACHINE_SHARE_CREATE}
        - {lane: Server, text: "Return a one-time invitation code with an expiry"}
        - {lane: Sharer app, text: Show a QR containing the invitation code}
        - {lane: New user app, phase: 2, text: [Send MACHINE_SHARE_ACCEPT, With the invitation code]}
        - {lane: Server, text: "Report pending confirmation: new user's name, email"}
        - {lane: Sharer app, text: Show the new user's name}
        - {lane: Sharer, text: Click confirm}
        - {lane: Server, text: [Record Employee permission, Increase acl_version]}
        - {lane: New user app, text: Report joined the machine}
        - {lane: Machine, phase: 3, after: [], text: Poll sees a new permission copy}
        - {lane: Server, text: Sign the permission copy, data: [9]}
        - {lane: Machine, text: "Verify the signature, store the copy"}
        - {lane: Machine, text: Check permissions locally even offline}
      caption: Example taken from the machine-sharing document of project1_app.

  - md: |
      ## Statemachine
      Drawn with mermaid `stateDiagram-v2`. A solid dot is the initial state (`initial`, defaults to the first state; `initial_label` puts a label on the arrow from the dot), a ringed dot is the final state (`final`). A transition to itself is drawn as an arc above the node. `tone` colors the node: muted, ok, warn, bad.

  - statemachine:
      dir: LR
      states:
        - {id: unverified, text: Unverified, tone: muted}
        - {id: active, text: Active, tone: ok}
        - {id: deleted, text: Deleted, tone: bad, note: anonymized}
      initial: unverified
      initial_label: register
      final: [deleted]
      transitions:
        - [unverified, unverified, register again with the same email]
        - [unverified, active, otp/verify correct]
        - [active, deleted, delete account]
      caption: Account lifecycle.

  - md: |
      ## The "Inside the blocks" table
      A `diagram` node (and a `statemachine` state) can carry `details: [[label, content], ...]`. Content supports `code` and **bold**. If any node has `details` the figure splits in two: the diagram on the left, the table on the right, with one group header row per node (the node's text) followed by its rows, in node order. On a narrow screen the table drops below the figure. Change the table title with `details_title` (default "Inside the blocks").

  - diagram:
      caption: Path of a packet through the packet-protection middleware.
      nodes:
        - id: p
          text: ① Prepare the content
          details:
            - [In, "business payload and `device_id`"]
            - [Do, "compress, number with `seq`, attach a timestamp"]
        - id: e
          text: ② Seal the envelope
          details:
            - [Encrypt, "AEAD with the session key"]
            - [Sign, "machine signature over the header and content"]
        - {id: t, text: ③ Send over TLS}
        - id: g
          text: ④ Gatekeeping
          tone: warn
          details:
            - [Order, "cheap checks first, expensive ones later"]
            - [Reject, "one generic code, no reason disclosed"]
        - {id: ok, text: "Machine signature valid?", shape: decision, tone: warn}
        - {id: biz, text: Hand over to business logic, tone: ok}
        - {id: rej, text: Reject, tone: bad}
      edges: [[p, e], [e, t], [t, g], [g, ok], [ok, biz, valid], [ok, rej, invalid]]
