title: Loading a C4 model into SQLite
summary: "How import_yaml syncs a *.strata.yaml file into the c4_* tables: what is checked and what is not, which SQL runs, and the edge cases."
code: [strata/c4.py, strata.py, strata/schema.sql]

blocks:
  - md: |
      ## Entry point
      `strata.py import-yaml FILE --project P` calls `c4.import_yaml(db.init(db), FILE, P)`. `db.init` runs the migration first, so an old DB always has all columns before anything is written.

      `OSError`, `ValueError`, `TypeError`, `AttributeError` and `sqlite3.IntegrityError` are caught, printed as `ERROR import: …`, and the exit code is 1. On success it prints the number of objects, connections and flows **after** loading.

  - diagram:
      dir: TB
      caption: Path through import_yaml. In practice the red branch is an exception and the transaction rolls back automatically.
      nodes:
        - {id: load, text: "load(path)", note: "yaml.safe_load, compute the absolute root"}
        - {id: ids, text: "check ids", note: "missing or duplicate → ValueError"}
        - {id: tx, text: "with c:", note: "one transaction"}
        - {id: meta, text: "upsert c4_meta", note: "name, root, layout, tags"}
        - {id: rows, text: "upsert 4 tables", note: "object · connection · interface · flow"}
        - {id: del, text: "DELETE … NOT IN", note: "delete rows no longer in the YAML"}
        - {id: aud, text: "INSERT audit", note: "before/after = row counts"}
        - {id: err, text: "rollback", note: "IntegrityError, type errors"}
      edges:
        - [load, ids]
        - [ids, tx]
        - [tx, meta]
        - [meta, rows]
        - [rows, del]
        - [del, aud]
        - [rows, err, "CHECK type"]

  - md: |
      ## 1. load()
      - Reads with `yaml.safe_load`. An empty file becomes `{}`.
      - YAML syntax error: `ValueError("YAML syntax error at line L column C: …")` with a hint to wrap strings containing `: ? # { } ,` in double quotes. The most common mistake is an unquoted `, ` inside a flow mapping, which silently creates an extra key.
      - `root` is computed from the **directory containing the YAML file**, not the current directory, then `resolve()`d to an absolute path. Code links in the viewer and `dead_link` both rely on this value.

      ## 2. Check ids, and only ids
      For each group of objects, connections, flows, interfaces: a missing or duplicate `id` raises `ValueError("<group>: missing or duplicate id")`. A connection without an id is assigned `c0, c1, …` by its **position in the file**. Inserting an id-less connection in the middle of the list changes the ids of every connection after it, and flow steps pointing at them will point at the wrong ones.

      `import_yaml` does **not** run `check()`. The following errors still get into the DB:

  - table:
      head: [Error, Caught by, Consequence if ignored]
      rows:
        - ["unknown type (e.g. servise)", "CHECK on c4_object → IntegrityError", "import stops, rollback"]
        - ["parent at the wrong level (app inside app)", "validate only", "viewer draws the wrong level"]
        - ["connection points to a nonexistent object", "validate only", "_lift returns None, the connection is skipped when drawing"]
        - ["step points to a nonexistent connection", "validate only", "flow trace prints a missing line"]
        - ["unknown key (typo descripton)", "validate only", "field is ignored, no warning"]
        - ["dead code link", "validate (warning) and /api/c4", "! dead_link badge"]

  - md: |
      So always run `validate FILE` **before** `import-yaml`, for example in a pre-commit hook:
      ```
      python3 strata.py validate docs/x.strata.yaml && python3 strata.py import-yaml docs/x.strata.yaml --project P
      ```

      ## 3. Upsert
      Everything runs inside `with c:`, so an exception in any statement rolls everything back and the DB is never left half-written.
      - `c4_meta`: one row per project. A missing `name` falls back to the project id.
      - The other four tables: `INSERT … ON CONFLICT(project,id) DO UPDATE SET` for each column. Columns absent from the YAML are written as `NULL`. The upsert **overwrites** rather than merges, so removing a field from the YAML removes it from the DB.
      - List or map fields (`tags`, `links`, `responsibilities`, `payload`, `errors`, `steps`) are stored as JSON via `json.dumps(ensure_ascii=False)`.
      - Interfaces are a top-level list in the YAML, each with an `object`. `read_model` attaches them to objects when reading back.

      ## 4. Deleting what was dropped
      ```
      DELETE FROM c4_<table> WHERE project=? AND id NOT IN (?, ?, …)
      ```
      Runs for all four tables after the upsert. An empty group in the YAML produces `NOT IN ()`. SQLite accepts this and deletes every row of that group, which is the intent.

      `c4_link` (linking an object to a task/decision) is **not** deleted along with it. When an object's id changes, the old link becomes an orphan: `c4 links` still lists it, but the viewer has no object to attach it to.

      ## 5. Audit
      One row `audit(tool='import-yaml', target=<file path>)`. `before` and `after` are the row counts `{object, connection, flow}`, not a diff. To see what changed, look at the git diff of the YAML file.

  - question:
      q: Should import-yaml run check() itself and stop on errors?
      options:
        - {label: "Yes, block on errors", note: "One command is enough and the DB never receives a bad model. Needs a --force flag for work in progress."}
        - {label: Keep as is, note: "A half-edited model can be imported, but you must remember to run validate separately."}
        - {label: Auto-assign connection ids, note: "Generate the id from from→to instead of file position, so inserting a connection does not shift flows."}
      recommend: Yes, block on errors
