title: Nạp model C4 vào SQLite
summary: "Cách import_yaml đồng bộ một file *.strata.yaml vào các bảng c4_*: chỗ nào kiểm, chỗ nào không, SQL chạy ra sao và các trường hợp biên."
code: [strata/c4.py, strata.py, strata/schema.sql]

blocks:
  - md: |
      ## Điểm vào
      `strata.py import-yaml FILE --project P` gọi `c4.import_yaml(db.init(db), FILE, P)`. `db.init` chạy migrate trước, nên DB cũ luôn có đủ cột trước khi ghi.

      Lỗi `OSError`, `ValueError`, `TypeError`, `AttributeError`, `sqlite3.IntegrityError` được bắt, in `ERROR import: …` và thoát mã 1. Thành công thì in số object, connection, flow **sau** khi nạp.

