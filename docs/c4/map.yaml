project:
  id: strata
  name: strata
  root: ../..
# Coverage exceptions: tests/, sandbox/, design/, scripts/ and viewer/vendor/ are
# tests, examples/prototypes, standalone utilities or third-party code. The
# empty strata/__init__.py is only a package marker; viewer/workspace.html is
# an unreferenced standalone mockup and needs a design decision before mapping.
objects:
- id: agent
  kind: actor
  name: Agent
  summary: Claude/Codex read and write data through the CLI
- id: argp
  parent: cli
  kind: component
  name: main
  summary: Subcommand dispatch
  owns:
  - strata.py
- id: blocks
  parent: cli
  kind: component
  name: blocks
  summary: Validates the 8 page block types
  owns:
  - strata/blocks.py
- id: c4_conn_editor
  parent: viewer
  kind: component
  name: Connection side panel
  summary: 'DESIGN; kind=connections. Edits existing connection fields: from, to, name, kind, technology, interface, status, description.'
  status: future
- id: c4_drc
  parent: viewer
  kind: component
  name: Map rules and DRC
  summary: DESIGN; kind=rules. Validates references, typed endpoints, required connection fields, and model consistency before a proposed write.
  status: future
- id: c4_editor
  parent: viewer
  kind: component
  name: C4 map editor
  summary: DESIGN; kind=editor. Proposed UI only; existing viewer remains read-only until the guarded write path is implemented.
  status: future
- id: c4_health
  parent: viewer
  kind: component
  name: Map health
  summary: DESIGN; kind=health. Summarizes completeness, stale links, and DRC findings for the selected map.
  status: future
- id: c4_library
  parent: viewer
  kind: component
  name: Reusable block library
  summary: DESIGN; kind=block-library. Offers hand-drawn reusable key blocks and on-demand L4 blocks generated from repository files.
  status: future
- id: c4_lvs
  parent: viewer
  kind: component
  name: Map LVS
  summary: DESIGN; kind=lvs. Compares declared map structure and links with repository-derived structure; reports differences without changing
    the model.
  status: future
- id: c4_ports
  parent: viewer
  kind: component
  name: Typed ports
  summary: DESIGN; kind=ports. Suggests valid connection endpoints from existing C4 object types plus a planned kind subtype; does not add a new
    C4 type.
  status: future
- id: c4_prompt
  parent: viewer
  kind: component
  name: Prompt rendering
  summary: DESIGN; kind=prompt. Renders selected DB-backed C4 context into copyable agent prompt text.
  status: future
- id: c4_write_api
  parent: server
  kind: component
  name: C4 write API
  summary: DESIGN; kind=write-api. Proposed authenticated/authorized mutation route for editor changes; no POST C4 API currently exists and current
    server is GET-only.
  status: future
- id: c4_write_service
  parent: cli
  kind: component
  name: C4 write service
  summary: DESIGN; kind=write-service. Proposed permission-checked, validated transactional SQLite write path with an audit entry; YAML is exported
    from the DB source of truth. Not implemented.
  status: future
- id: c4_yaml
  parent: viewer
  kind: component
  name: Structured YAML export
  summary: DESIGN; kind=export. Exports the current DB source of truth to the existing C4 YAML model format; import remains through the CLI.
  status: future
- id: c4mod
  parent: cli
  kind: component
  name: c4
  summary: C4 model - import, validate, context, flow
  owns:
  - strata/c4_layered.py
  - strata/c4_edit.py
  - strata/c4_drift.py
  - strata/symbols.py
- id: c4view
  parent: viewer
  kind: component
  name: c4 viewer
  summary: Map C4 IcePanel-style
  owns:
  - viewer/index.html
- id: cc_hooks
  parent: strata
  kind: app
  name: Claude Code hooks
  summary: 'Hook sources under agent/hooks/: the private-memory guard is registered in Claude user settings; scope_guard.py is implemented but still requires separate host PreToolUse registration and a coordinator task contract to activate. These hooks provide accident prevention, not a security boundary.'
  tech: Python 3, Claude Code PreToolUse
  owns:
  - agent/hooks/scope_guard.py
  - agent/hooks/block_secondbrain_creative_agents.py
- id: cli
  parent: strata
  kind: app
  name: CLI
  summary: The only write path; every change leaves an audit entry
  tags:
  - write
- id: ctxmod
  parent: cli
  kind: component
  name: context
  summary: Task context; DESIGN adds role prompts
  owns:
  - strata/context.py
- id: dbmod
  parent: cli
  kind: component
  name: db
  summary: SQLite access and migration
  owns:
  - strata/db/*
- id: handler
  parent: server
  kind: component
  name: Handler
  summary: BaseHTTPRequestHandler; do_GET and guarded do_POST routes
  owns:
  - strata/server.py
- id: hk_cli
  parent: cc_hooks
  kind: component
  name: block_subagent_strata_cli
  summary: 'DESIGN: file agent/hooks/block_subagent_strata_cli.py; blocks subagents from running strata.py write commands via Bash'
  status: future
- id: hk_edit
  parent: cc_hooks
  kind: component
  name: block_main_code_edit
  summary: 'DESIGN: file agent/hooks/block_main_code_edit.py; blocks the main chat from editing code files, code work is delegated to the coder'
  status: future
- id: item_report
  parent: strata
  kind: store
  name: item_report
  summary: 'DESIGN: worker report table, lives in SQLite (a store cannot be nested so it is placed alongside sqlite); columns item, state (checkpoint|needs_input|stuck|done),
    note, artifacts, actor role, time; item also has branch, worktree columns (workspace at claim)'
  status: future
- id: mcp
  parent: strata
  kind: app
  name: MCP server
  summary: 'Live stdio JSON-RPC server launched by strata.py mcp --role R; the role is fixed at startup and client tool arguments cannot change it.'
  tech: Python 3, MCP over JSON-RPC stdio
  tags:
  - write
- id: mcp_tools
  parent: mcp
  kind: component
  name: tools
  summary: 'Live role-filtered MCP tool registry and JSON-RPC dispatch; write tools call the audited service layer.'
  owns:
  - strata/mcp.py
- id: repo
  kind: system
  name: Project repo
  summary: Code and documents of the managed projects
- id: server
  parent: strata
  kind: app
  name: Server
  summary: Serves GET (incl. /api/codemap and the /codemap/ static renderer); three guarded write routes (c4 edit, item, project) need a per-start token plus Origin/Host checks; blocks unknown Host and traversal
- id: service
  parent: cli
  kind: component
  name: service
  summary: 'Live shared CLI/MCP service layer for project and item operations, role checks, audit, search and code map setup; planned report and attention functions remain future.'
  owns:
  - strata/service.py
- id: shell
  parent: viewer
  kind: component
  name: app shell
  summary: Project sidebar, tabs, Ctrl+K
  owns:
  - viewer/app.js
  - viewer/app.css
  - viewer/page.html
  - viewer/page.js
  - viewer/page.css
  - viewer/swimlane.js
- id: sqlite
  parent: strata
  kind: store
  name: SQLite
  summary: /home/abel/project/tools/strata/strata.db; single source of truth
  owns:
  - strata/schema.sql
- id: strata
  kind: system
  name: Strata
  summary: Manages projects, tasks, decisions, documents and the C4 map
- id: user
  kind: actor
  name: User
  summary: View projects, the C4 map and flows in the browser
- id: viewer
  parent: strata
  kind: app
  name: Viewer
  summary: Multi-project app shell, a zoomable C4 map and a Code map tab (iframe of /codemap/)
  owns:
  - viewer/app.html
- id: gitnexus
  parent: strata
  kind: app
  name: GitNexus
  summary: 'Vendored npm gitnexus 1.6.12 (PolyForm Noncommercial, never edited) at tools/gitnexus/ (fetch.sh, payload gitignored); indexes a repository and exports a graph; only ever called as a CLI subprocess, never imported'
  tech: Node.js, npm gitnexus 1.6.12
  owns:
  - tools/gitnexus/**
- id: gitnexus_index
  parent: strata
  kind: store
  name: GitNexus index
  summary: '<repo>/.gitnexus/lbug, the LadybugDB graph index of one indexed repository; owned and written only by gitnexus'
  tech: LadybugDB
- id: codemap
  parent: viewer
  kind: component
  name: Code map
  summary: 'Celeste renderer in viewer/codemap/ (plain JS, canvas, vendored graphology force layout, no build step), embedded by the Code map tab via iframe; adapt.js converts the raw GitNexus graph in the browser; reads /api/codemap over GET only'
  owns:
  - viewer/codemap/**
- id: codemap_snap
  parent: cli
  kind: component
  name: Code snapshot
  summary: 'strata/codemap.py; command `strata.py code snapshot --project P [--reindex]` runs gitnexus and stores its raw {nodes, relationships} graph unconverted'
  owns:
  - strata/codemap.py
- id: codemap_store
  parent: strata
  kind: store
  name: Code map snapshot
  summary: '<db dir>/<db stem>.codemap/<project>.json next to the DB, the raw GitNexus graph; written by the snapshot command, read by the server'
  tech: JSON file
- id: agent_gov
  parent: strata
  kind: app
  name: Agent governance
  summary: 'Endo rules, roles, workflow and skills moved in as real files under agent/ (Markdown); the hook script stays with cc_hooks'
  tech: Markdown
  owns:
  - agent/*.md
  - agent/agents/*
  - agent/skills/**
- id: runs
  parent: cli
  kind: component
  name: Run registry
  status: future
  behavior: runs
  summary: 'B1, proposed strata/runs.py; SQLite tables for agent runs written only by `strata.py run ...` with an audit row; owns the run lifecycle (see behavior)'
- id: runexec
  parent: cli
  kind: component
  name: Run exec wrapper
  status: future
  summary: 'B1, proposed strata/runexec.py; `strata.py run exec --item N --as NAME [-- agent cmd]` registers a run, packs the task context, launches the agent as a supervised subprocess (default `claude -p`), records pid, exit, usage and log path, then calls the gate'
- id: gate
  parent: cli
  kind: component
  name: Gate
  status: future
  summary: 'B1, proposed strata/gate.py; deterministic, no LLM: diff must touch only spec.scope.touch, spec.verify runs on a clean checkout, then submit doing to review; on failure the item stays doing'
- id: agent_cli
  kind: system
  name: Coding agent CLI
  status: future
  summary: 'External CLI coding agent (Claude Code `claude -p` by default, Codex `codex exec` possible) run as a supervised subprocess; Strata never calls an LLM API. Later slices (not built): B2 bwrap sandbox, B3 Agents tab, B4 context packer, B5 controller'
- id: chat_panel
  parent: shell
  kind: component
  name: Chat panel
  summary: 'Right panel in viewer/app.html + app.js: start a Codex session (provider codex/openrouter/omniroute), send turns, show streamed events, one-use Allow/Deny card, cancel/close, worktree diff; session refs live in sessionStorage.'
- id: agent_bar
  parent: shell
  kind: component
  name: Agent session bar
  summary: 'Bottom bar listing this browser tab''s chat sessions (cards from client-side chat state, not Kernel B1 runs); shows an empty state when none is open. Selecting a card opens it in the chat panel.'
- id: chat_api
  parent: server
  kind: component
  name: Chat API
  summary: 'strata/server.py: POST /api/chat (ops start, turn, decide, cancel, close, login, cancel_login) and GET /api/chat/events, /auth, /diff; per-start token on POST and GET, Origin check on POST, Host check on all requests, project and session ID regexes, projects only from the DB registry.'
- id: chat_sessions
  parent: server
  kind: component
  name: Chat session supervisor
  summary: 'ChatSupervisor: up to 4 live Codex sessions, each in its own detached Git worktree (blobs materialized from HEAD, symlink and size guards); routes turn/decide/cancel/close/login and builds a bounded review diff.'
  owns:
  - strata/chat.py
- id: chat_codex
  parent: server
  kind: component
  name: Codex app-server adapter
  summary: 'strata/chat_codex.py. CodexSession: spawns `codex app-server --listen stdio://`, speaks JSON-RPC, sandbox read-only with approvalPolicy on-request; turns command/file-change approval requests into one-use approval IDs (24 bytes, timeout, deny on expiry/close); filtered child env, replay buffer.'
  owns:
  - strata/chat_codex.py
- id: chat_worktree
  kind: system
  name: Chat worktree
  summary: 'Detached Git worktree under .strata-worktrees/ beside the project repo, one per chat session. It is the session cwd and the only checkout Strata exposes; changes are reviewed through the bounded diff and the worktree is retained after close.'
- id: codex_app_server
  kind: system
  name: Codex app-server
  tags:
  - external
  summary: 'Local `codex` CLI child process (JSON-RPC over stdio). Runs the model turn, tools and approved file changes; owns ChatGPT login.'
- id: openrouter
  kind: system
  name: OpenRouter
  tags:
  - external
  summary: 'Optional model gateway (default https://openrouter.ai/api/v1; STRATA_OPENROUTER_BASE_URL/API_KEY). Only used when the session provider is openrouter.'
- id: omniroute
  kind: system
  name: OmniRoute
  tags:
  - external
  summary: 'Optional local model gateway (default http://127.0.0.1:20128/v1; STRATA_OMNIROUTE_BASE_URL/API_KEY). Only used when the session provider is omniroute.'
