- id: c4_export_done
  from: repo
  to: c4_yaml
  name: YAML export written
  status: future
  summary: Repo confirms the YAML export was written.
- id: c4_prompt_render
  from: c4_yaml
  to: c4_prompt
  name: Render selected block prompt
  status: future
  summary: Prompt module renders a prompt for the selected block.
- id: c4_prompt_copy
  from: c4_prompt
  to: user
  name: Copy generated prompt
  status: future
  summary: User copies the generated prompt.
- id: c4_lvs_run
  from: c4_lvs
  to: repo
  name: Scan repository for comparison
  status: future
  summary: LVS scans the repo to compare it with the map.
- id: c4_health_run
  from: c4_health
  to: c4_drc
  name: Include validation findings
  status: future
  summary: Health view includes validation findings.
- id: u_c4_connect
  from: user
  to: c4_editor
  name: Create link between selected output and input ports
  status: future
  summary: User links a selected output port to an input port.
- id: v_item_write
  from: viewer
  to: server
  name: Write task
  detail: handler.v_item_write
  summary: UI add, edit, delete task and dependencies; token guarded.
- id: v_project_write
  from: viewer
  to: server
  name: Write project
  detail: handler.v_project_write
  summary: UI add, edit, delete project; delete needs typed id.
- id: h_item_ops
  from: handler
  to: service
  name: Edit task
  detail: service.gs_item_ops
  summary: Item write route calls the audited item service functions.
- id: h_project_ops
  from: handler
  to: service
  name: Edit project
  detail: service.gs_project_ops
  summary: Project write route calls the project service functions; delete backs up first.
- id: ag_gx
  from: agent
  to: gitnexus
  name: Query code graph (CLI)
  detail: codemap.ag_gx
  summary: Agent runs the vendored gitnexus CLI for code questions and graph export.
- id: cm_cli
  from: argp
  to: codemap_snap
  name: code snapshot command
  detail: codemap.cm_cli
  summary: The code snapshot subcommand calls the snapshot module.
- id: cm_gx
  from: codemap_snap
  to: gitnexus
  name: Run gitnexus (subprocess CLI)
  detail: codemap.cm_gx
  summary: Snapshot module shells out to tools/gitnexus to index and export the graph; no import.
- id: gx_index
  from: gitnexus
  to: gitnexus_index
  name: Write and read index (file)
  summary: GitNexus builds and queries <repo>/.gitnexus/lbug.
- id: gx_repo
  from: gitnexus
  to: repo
  name: Read source files
  summary: GitNexus parses the repository files to build the index.
- id: cm_write
  from: codemap_snap
  to: codemap_store
  name: Write snapshot (JSON file)
  detail: codemap.cm_write
  summary: The raw GitNexus graph is written to the snapshot file.
- id: cm_get
  from: codemap
  to: server
  name: Load snapshot (HTTP GET)
  detail: codemap.cm_get
  summary: Code map tab fetches the raw snapshot; GET only, no new write route.
- id: cm_read
  from: handler
  to: codemap_store
  name: Read snapshot (JSON file)
  detail: codemap.cm_read
  summary: The GET route reads the snapshot file and returns it unchanged.
- id: a_gov
  from: agent
  to: agent_gov
  name: Read rules, roles and skills (files)
  summary: Agents load governance Markdown from agent/.
- id: run_argp
  from: argp
  to: runexec
  name: Dispatch run exec (in-process)
  status: future
  detail: runs.argp
  summary: Main chat's `run exec` command is routed to the wrapper.
- id: run_reg
  from: runexec
  to: runs
  name: Register and update run (in-process)
  status: future
  detail: runs.reg
  summary: Wrapper registers the run and records launch, exit and result.
- id: run_ctx
  from: runexec
  to: ctxmod
  name: Build task packet (in-process)
  status: future
  detail: runs.ctx
  summary: Wrapper reuses `task context` to build the packet for the agent.
- id: run_launch
  from: runexec
  to: agent_cli
  name: Launch agent (subprocess)
  status: future
  detail: runs.launch
  summary: Wrapper starts the agent with the packet as stdin and waits for exit or timeout.
- id: run_edit
  from: agent_cli
  to: repo
  name: Edit files (filesystem)
  status: future
  summary: Agent edits files in its checkout.
- id: run_gate
  from: runexec
  to: gate
  name: Run gate (in-process)
  status: future
  detail: runs.gate_call
  summary: After exit the wrapper hands the candidate to the gate.
- id: run_gate_repo
  from: gate
  to: repo
  name: Diff, clean checkout, verify (git subprocess)
  status: future
  detail: runs.gate_repo
  summary: Gate reads the diff, checks out the candidate clean and runs spec.verify.
- id: run_gate_svc
  from: gate
  to: service
  name: Submit item (in-process)
  status: future
  detail: runs.gate_svc
  summary: On pass the gate submits doing to review through the service.
- id: run_db
  from: runs
  to: sqlite
  name: Read/write run rows (sqlite3)
  status: future
  detail: runs.runs_db
  summary: Registry stores runs and appends an audit row.
- id: chat_turn
  from: viewer
  to: server
  name: Chat operations start/turn/cancel/close/login (HTTP POST /api/chat)
  summary: Guarded JSON ops with token header; the browser sends only project ID, session ID, provider, model and message.
- id: chat_events
  from: viewer
  to: server
  name: Poll events, auth status, worktree diff (HTTP GET /api/chat/*)
  summary: Viewer polls ordered events by sequence number and reads auth readiness and the review diff.
- id: chat_dispatch
  from: handler
  to: chat_api
  name: Dispatch chat route (in-process)
  summary: do_POST/do_GET hand /api/chat paths to the chat handlers.
- id: chat_manage
  from: chat_api
  to: chat_sessions
  name: Call ChatSupervisor (Python import)
  summary: Server validates the request, then starts, drives or reads a session through the supervisor.
- id: chat_process
  from: chat_sessions
  to: chat_codex
  name: Call CodexSession (Python import)
  summary: Supervisor sends turns, cancel and approval decisions, and reads replayed events.
- id: chat_runtime
  from: chat_codex
  to: codex_app_server
  name: Run Codex app-server (subprocess JSON-RPC over stdio)
  summary: Adapter starts the child, runs thread/turn requests and answers its approval requests.
- id: chat_scope_repo
  from: chat_sessions
  to: repo
  name: Create Git worktree (git subprocess)
  summary: '`git worktree add --detach --no-checkout` from project HEAD, then read-tree; the active checkout is untouched.'
- id: chat_workspace
  from: chat_sessions
  to: chat_worktree
  name: Materialize HEAD and read review diff (filesystem)
  summary: Writes HEAD blobs into the worktree with path-escape checks, later reads it for the bounded diff.
- id: chat_write
  from: codex_app_server
  to: chat_worktree
  name: Apply approved file change (filesystem)
  summary: After an Allow decision the Codex app-server applies the change in its session cwd (the worktree). Confinement is Codex's own (read-only sandbox plus approvals), not enforced by Strata, and approved commands are not path-scoped.
- id: chat_approval
  from: viewer
  to: server
  name: Approve or deny tool action (HTTP POST /api/chat op decide)
  summary: Browser sends the one-use approval ID and a boolean, never revised arguments or a blanket permission.
- id: chat_decide
  from: chat_api
  to: chat_sessions
  name: Resolve pending approval (Python import)
  summary: Supervisor passes the decision to the session, which answers only the matching pending request.
- id: chat_openrouter
  from: codex_app_server
  to: openrouter
  name: Model inference (HTTPS, optional)
  summary: Used only when the provider is openrouter, via model_providers config passed with -c.
- id: chat_omniroute
  from: codex_app_server
  to: omniroute
  name: Model inference (HTTP, optional)
  summary: Used only when the provider is omniroute, via model_providers config passed with -c.
- id: shell_chat
  from: shell
  to: chat_panel
  name: Display chat panel
  summary: Viewer shell opens the right chat panel without replacing the centre view.
- id: shell_cards
  from: shell
  to: agent_bar
  name: Display agent bar
  summary: Viewer shell renders session cards from client-side chat state below the centre view.
