project:
  id: strata
  name: strata
  root: ../..
objects:
- id: agent
  kind: actor
  name: Agent
  summary: Claude/Codex read and write data through the CLI
- id: argp
  parent: cli
  kind: component
  name: main
  summary: Subcommand dispatch
  owns:
  - strata.py
- id: blocks
  parent: cli
  kind: component
  name: blocks
  summary: Validates the 8 page block types
  owns:
  - strata/blocks.py
- id: c4_conn_editor
  parent: viewer
  kind: component
  name: Connection side panel
  summary: 'DESIGN; kind=connections. Edits existing connection fields: from, to, name, kind, technology, interface, status, description.'
  status: future
  owns:
  - viewer/index.html
- id: c4_drc
  parent: viewer
  kind: component
  name: Map rules and DRC
  summary: DESIGN; kind=rules. Validates references, typed endpoints, required connection fields, and model consistency before a proposed write.
  status: future
  owns:
  - strata/c4.py
- id: c4_editor
  parent: viewer
  kind: component
  name: C4 map editor
  summary: DESIGN; kind=editor. Proposed UI only; existing viewer remains read-only until the guarded write path is implemented.
  status: future
  owns:
  - viewer/index.html
- id: c4_health
  parent: viewer
  kind: component
  name: Map health
  summary: DESIGN; kind=health. Summarizes completeness, stale links, and DRC findings for the selected map.
  status: future
  owns:
  - strata/c4.py
- id: c4_library
  parent: viewer
  kind: component
  name: Reusable block library
  summary: DESIGN; kind=block-library. Offers hand-drawn reusable key blocks and on-demand L4 blocks generated from repository files.
  status: future
  owns:
  - viewer/index.html
- id: c4_lvs
  parent: viewer
  kind: component
  name: Map LVS
  summary: DESIGN; kind=lvs. Compares declared map structure and links with repository-derived structure; reports differences without changing
    the model.
  status: future
  owns:
  - strata/c4.py
- id: c4_ports
  parent: viewer
  kind: component
  name: Typed ports
  summary: DESIGN; kind=ports. Suggests valid connection endpoints from existing C4 object types plus a planned kind subtype; does not add a new
    C4 type.
  status: future
  owns:
  - viewer/index.html
- id: c4_prompt
  parent: viewer
  kind: component
  name: Prompt rendering
  summary: DESIGN; kind=prompt. Renders selected DB-backed C4 context into copyable agent prompt text.
  status: future
  owns:
  - strata/context.py
- id: c4_write_api
  parent: server
  kind: component
  name: C4 write API
  summary: DESIGN; kind=write-api. Proposed authenticated/authorized mutation route for editor changes; no POST C4 API currently exists and current
    server is GET-only.
  status: future
  owns:
  - strata/server.py
- id: c4_write_service
  parent: cli
  kind: component
  name: C4 write service
  summary: DESIGN; kind=write-service. Proposed permission-checked, validated transactional SQLite write path with an audit entry; YAML is exported
    from the DB source of truth. Not implemented.
  status: future
  owns:
  - strata/service.py
- id: c4_yaml
  parent: viewer
  kind: component
  name: Structured YAML export
  summary: DESIGN; kind=export. Exports the current DB source of truth to the existing C4 YAML model format; import remains through the CLI.
  status: future
  owns:
  - strata/c4.py
- id: c4mod
  parent: cli
  kind: component
  name: c4
  summary: C4 model - import, validate, context, flow
  owns:
  - strata/c4.py
- id: c4view
  parent: viewer
  kind: component
  name: c4 viewer
  summary: Map C4 IcePanel-style
  owns:
  - viewer/index.html
- id: cc_hooks
  parent: strata
  kind: app
  name: Claude Code hooks
  summary: 'DESIGN: Claude Code PreToolUse hooks enforce role boundaries: subagents do not use the CLI path, the main chat does not edit code'
  status: future
  owns:
  - agent/hooks
- id: cli
  parent: strata
  kind: app
  name: CLI
  summary: The only write path; every change leaves an audit entry
  tags:
  - write
  owns:
  - strata.py
- id: ctxmod
  parent: cli
  kind: component
  name: context
  summary: Task context; DESIGN adds role prompts
  owns:
  - strata/context.py
- id: dbmod
  parent: cli
  kind: component
  name: db
  summary: SQLite access and migration
  owns:
  - strata/db.py
- id: handler
  parent: server
  kind: component
  name: Handler
  summary: BaseHTTPRequestHandler; do_GET and guarded do_POST routes
  owns:
  - strata/server.py
- id: hk_cli
  parent: cc_hooks
  kind: component
  name: block_subagent_strata_cli
  summary: 'DESIGN: file agent/hooks/block_subagent_strata_cli.py; blocks subagents from running strata.py write commands via Bash'
  status: future
  owns:
  - agent/hooks
- id: hk_edit
  parent: cc_hooks
  kind: component
  name: block_main_code_edit
  summary: 'DESIGN: file agent/hooks/block_main_code_edit.py; blocks the main chat from editing code files, code work is delegated to the coder'
  status: future
  owns:
  - agent/hooks
- id: item_report
  parent: strata
  kind: store
  name: item_report
  summary: 'DESIGN: worker report table, lives in SQLite (a store cannot be nested so it is placed alongside sqlite); columns item, state (checkpoint|needs_input|stuck|done),
    note, artifacts, actor role, time; item also has branch, worktree columns (workspace at claim)'
  status: future
  owns:
  - strata/schema.sql
- id: laya
  kind: system
  name: Laya
  summary: Local multilingual decision engine (/home/abel/project/tools/laya); library, HTTP server and MCP server
- id: laya_agent
  parent: laya_lib
  kind: component
  name: Agent
  summary: Runs one checkpoint
  owns:
  - ../laya/laya/agent.py
- id: laya_backends
  parent: laya_lib
  kind: component
  name: backends
  summary: Execution backends for the forward pass
  owns:
  - ../laya/laya/backends/base.py
  - ../laya/laya/backends/eager.py
- id: laya_container
  parent: laya
  kind: app
  name: laya container
  summary: Compose service laya; one-shot quickstart image, entrypoint loads *_FILE secrets; CUDA/ModelScope/Spark variants
  owns:
  - ../laya/Dockerfile
  - ../laya/compose.yaml
  - ../laya/docker/entrypoint.py
- id: laya_hooks
  parent: laya_lib
  kind: component
  name: hooks and presets
  summary: Extension points and presets
  owns:
  - ../laya/laya/hooks.py
  - ../laya/laya/presets.py
- id: laya_http
  parent: laya_serve_app
  kind: component
  name: HTTP API
  summary: create_app routes
  owns:
  - ../laya/laya/serve.py
- id: laya_lang
  parent: laya_lib
  kind: component
  name: lang
  summary: Language detection helpers
  owns:
  - ../laya/laya/lang.py
- id: laya_lib
  parent: laya
  kind: app
  name: laya Python package
  summary: In-process library and CLI (laya, laya-train, laya-evals); Router and Agent run typed decisions in one forward pass
  owns:
  - ../laya/laya/__init__.py
  - ../laya/pyproject.toml
- id: laya_mcp_app
  parent: laya
  kind: app
  name: laya-mcp-server
  summary: MCP tools laya_status, laya_route, laya_predict, laya_predict_batch; runs a local Router or forwards to laya-serve
  owns:
  - ../laya/laya/mcp/server.py
- id: laya_mcp_remote
  parent: laya_mcp_app
  kind: component
  name: RemoteRouter
  summary: Used when a remote base URL is configured
  owns:
  - ../laya/laya/mcp/remote.py
- id: laya_mcp_tools
  parent: laya_mcp_app
  kind: component
  name: MCP tools
  summary: Tool handlers
  owns:
  - ../laya/laya/mcp/server.py
  - ../laya/laya/mcp/tools.py
- id: laya_models
  parent: laya
  kind: store
  name: Model cache
  summary: Checkpoints laya (English), laya-multilingual and others, downloaded on first use and pinned by revision/digest
  owns:
  - ../laya/laya/revisions.py
- id: laya_router
  parent: laya_lib
  kind: component
  name: Router
  summary: Picks the checkpoint and delegates to an Agent
  owns:
  - ../laya/laya/router.py
- id: laya_serve_app
  parent: laya
  kind: app
  name: laya-serve
  summary: HTTP API (compose service laya-serve, loopback port 8000); Jev-compatible /v1/systemone endpoints
  owns:
  - ../laya/laya/serve.py
  - ../laya/compose.http.yaml
- id: mcp
  parent: strata
  kind: app
  name: MCP server
  summary: 'DESIGN: strata.py mcp --role R; the role is fixed at startup, each role has its own MCP config entry, and the agent cannot change
    its role'
  status: future
  tags:
  - write
  owns:
  - strata/mcp.py
- id: mcp_tools
  parent: mcp
  kind: component
  name: tools
  summary: 'DESIGN: tool wrappers that call service'
  status: future
  owns:
  - strata/mcp.py
- id: repo
  kind: system
  name: Project repo
  summary: Code and documents of the managed projects
- id: server
  parent: strata
  kind: app
  name: Server
  summary: Serves GET (incl. /api/codemap and the /codemap/ static renderer); three guarded write routes (c4 edit, item, project) need a per-start token plus Origin/Host checks; blocks unknown Host and traversal
  owns:
  - strata/server.py
- id: service
  parent: cli
  kind: component
  name: service
  summary: 'DESIGN: add_item, set_item, add_decision, set_decision_status, search; every function takes a role'
  status: future
  owns:
  - strata/service.py
- id: shell
  parent: viewer
  kind: component
  name: app shell
  summary: Project sidebar, tabs, Ctrl+K
  owns:
  - viewer/app.js
- id: sqlite
  parent: strata
  kind: store
  name: SQLite
  summary: /home/abel/project/tools/strata/strata.db; single source of truth
  owns:
  - strata/schema.sql
- id: strata
  kind: system
  name: Strata
  summary: Manages projects, tasks, decisions, documents and the C4 map
- id: user
  kind: actor
  name: User
  summary: View projects, the C4 map and flows in the browser
- id: viewer
  parent: strata
  kind: app
  name: Viewer
  summary: Multi-project app shell, a zoomable C4 map and a Code map tab (iframe of /codemap/)
  owns:
  - viewer/app.html
  - viewer/index.html
- id: gitnexus
  parent: strata
  kind: app
  name: GitNexus
  summary: 'Vendored npm gitnexus 1.6.12 (PolyForm Noncommercial, never edited) at tools/gitnexus/ (fetch.sh, payload gitignored); indexes a repository and exports a graph; only ever called as a CLI subprocess, never imported'
  tech: Node.js, npm gitnexus 1.6.12
  owns:
  - tools/gitnexus/**
- id: gitnexus_index
  parent: strata
  kind: store
  name: GitNexus index
  summary: '<repo>/.gitnexus/lbug, the LadybugDB graph index of one indexed repository; owned and written only by gitnexus'
  tech: LadybugDB
- id: codemap
  parent: viewer
  kind: component
  name: Code map
  summary: 'Celeste renderer in viewer/codemap/ (plain JS, canvas, vendored graphology force layout, no build step), embedded by the Code map tab via iframe; adapt.js converts the raw GitNexus graph in the browser; reads /api/codemap over GET only'
  owns:
  - viewer/codemap/**
- id: codemap_snap
  parent: cli
  kind: component
  name: Code snapshot
  summary: 'strata/codemap.py; command `strata.py code snapshot --project P [--reindex]` runs gitnexus and stores its raw {nodes, relationships} graph unconverted'
  owns:
  - strata/codemap.py
- id: codemap_store
  parent: strata
  kind: store
  name: Code map snapshot
  summary: '<db dir>/<db stem>.codemap/<project>.json next to the DB, the raw GitNexus graph; written by the snapshot command, read by the server'
  tech: JSON file
- id: agent_gov
  parent: strata
  kind: app
  name: Agent governance
  summary: 'Endo rules, roles, workflow and skills moved in as real files under agent/ (Markdown); the hook script stays with cc_hooks'
  tech: Markdown
  owns:
  - agent/*.md
  - agent/agents/*
  - agent/skills/**
