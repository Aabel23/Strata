id: snapshot_code_map
name: Build the code map snapshot
steps:
- link: a_cli
  text: run `strata.py code snapshot --project P`
- at: argp
  text: parse the code snapshot subcommand
- link: cm_cli
  text: call the snapshot module
- link: cm_gx
  text: run tools/gitnexus as a subprocess
- link: gx_repo
  text: parse the repository source files
- link: gx_repo
  reverse: true
- link: gx_index
  text: build the graph index in .gitnexus/lbug
- link: gx_index
  reverse: true
- link: cm_gx
  reverse: true
  text: graph export {nodes, relationships}
- at: codemap_snap
  text: convert to the Celeste graph format
- link: cm_write
  text: write the snapshot file
