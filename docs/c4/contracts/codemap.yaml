- id: ag_gx
  transport: CLI subprocess
  body:
    signature: node tools/gitnexus/dist/cli/index.js <command> [args]
    purpose: Agent queries or exports the code graph of a repository; gitnexus is vendored and never edited
    errors:
    - non-zero exit when the repository is not indexed
  # non-Python ends on purpose: caller is the agent (SKILL.md), callee is the vendored Node CLI
  start: agent/skills/strata/SKILL.md::gitnexus
  end: tools/gitnexus/package.json::gitnexus
- id: cm_cli
  transport: in-process
  body:
    signature: 'strata.py code snapshot --project P [--reindex]'
    purpose: Route the subcommand to the snapshot module
  start: strata.py::cmd_code
  end: strata/codemap.py::snapshot
- id: cm_gx
  transport: CLI subprocess
  body:
    signature: run_gitnexus(root, reindex=False) -> {nodes, relationships}; --reindex runs analyze --index-only first
    purpose: Index the project root and export the graph; Strata Python never imports gitnexus
    errors:
    - RuntimeError when node or tools/gitnexus is missing
    - RuntimeError on non-zero exit
  start: strata/codemap.py::run_gitnexus
  end: tools/gitnexus/package.json::gitnexus
- id: cm_write
  transport: file write
  body:
    signature: write_snapshot(path, body)
    purpose: Write the raw GitNexus graph to <db dir>/<db stem>.codemap/<project>.json; conversion happens in the browser (adapt.js)
    response: raw GitNexus {nodes, relationships}
  start: strata/codemap.py::snapshot
  end: strata/codemap.py::write_snapshot
- id: cm_get
  transport: HTTP
  body:
    signature: GET /api/codemap?project=P
    purpose: Return the stored snapshot to the Code map tab; read-only, no write route
    response: raw GitNexus graph JSON (nodes, relationships)
    errors:
    - 403 unknown Host
    - 400 missing or unknown project
    - 404 no snapshot for the project (run `strata.py code snapshot`)
  start: viewer/codemap/js/source.js::loadRaw
  end: strata/server.py::make_server.H.codemap
- id: cm_read
  transport: file read
  body:
    signature: load_snapshot(db_path, project) -> dict
    purpose: Read the snapshot file for the GET route
    errors:
    - FileNotFoundError becomes 404
  start: strata/server.py::make_server.H.codemap
  end: strata/codemap.py::load_snapshot
