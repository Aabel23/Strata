- id: mr_svc
  transport: in-process
  body:
    signature: add_decision(c, role, project, title, context, decision, consequences, rejected, supersedes=None) -> id
    purpose: Writes a decision; non-main roles are forced to status proposed; writes audit
    errors:
    - PermissionError
    tool: tools/call add_decision {title, context, decision, consequences, rejected, supersedes}
  start: strata/mcp.py::call
  end: strata/service.py::add_decision
- id: ms_svc
  transport: in-process
  body:
    signature: search(c, q, project=None, src=None, limit=30, role='main')
    purpose: FTS5 BM25, filter by project/src columns
    response: '[{src, id, project, title, snippet, rank}]'
    tool: tools/call search {q, project, src, limit}
  start: strata/mcp.py::call
  end: strata/service.py::search
- id: cs_svc
