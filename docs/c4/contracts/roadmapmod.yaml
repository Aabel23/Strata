- id: cs_confirm
  transport: in-process
  start: strata.py::main
  end: strata/roadmap.py::criterion_set
  body:
    signature: criterion_set(c, project, roadmap, crit, result, value, actor, waive=None)
- id: cs_gate
  transport: in-process
  body:
    signature: gate_pass(c, project, roadmap, gate, actor, evidence=None)
    errors:
    - ValueError when conditions are not met
  start: strata.py::main
  end: strata/roadmap.py::gate_pass
- id: g_rm
  transport: in-process
  body:
    signature: api(c, project, roadmap=None) -> dict
    purpose: Source for GET /api/roadmap
    response: '{phases:[{goal, level, blocks, criteria, coverage, gate}]}'
  start: strata/server.py::make_server
  end: strata/roadmap.py::api
