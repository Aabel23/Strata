      - {connection: fc_seal, reverse: true}
      - {connection: fc_net, text: "POST /app/user/machine/list"}
      - {connection: t_c2}
      - {connection: t_c2, reverse: true, text: "OpenedRequest(auth:{access_token})"}
      - {connection: t_c3}
      - {connection: d_auth}
      - {connection: a_auth_tx}
      - {connection: a_auth_tx, reverse: true}
      - {connection: d_auth, reverse: true, text: "context.auth = user"}
      - {connection: d_lst}
      - {connection: d_list_tx, text: "devices WHERE owner_user_id = user"}
      - {connection: st_sql}
      - {connection: st_sql, reverse: true}
      - {connection: d_list_tx, reverse: true}
      - {connection: d_list_on, text: "online/last_seen từ RAM"}
      - {connection: d_list_on, reverse: true}
      - {connection: d_lst, reverse: true, payload: "{v:1, ok:true, data:{machines:[{id, serial, name, role:'owner', online, last_seen_at}], server_seen_at}}"}
      - {connection: t_c3, reverse: true}
      - {connection: t_c5}
      - {connection: t_c5, reverse: true}
      - {connection: fc_net, reverse: true}
      - {connection: fc_open}
      - {connection: fc_open, reverse: true}
