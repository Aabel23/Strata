  - {id: fm_ask, from: fm_load, to: fs_ask, name: ask, kind: call, technology: Dart, interface: f_ask}
  - {id: fm_apply_c, from: fm_load, to: fm_apply, name: _apply, kind: call, technology: Dart}
  - {id: fm_w, from: fm_toggle, to: fm_write, name: write, kind: call, technology: Dart}
  - {id: fw_ask, from: fm_write, to: fs_ask, name: ask, kind: call, technology: Dart, interface: f_ask}
  - {id: fm_ta, from: fm_toggle, to: fm_apply, name: _apply, kind: call, technology: Dart}
