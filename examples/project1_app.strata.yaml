interfaces:
  - id: transport_post
    object: transport
    kind: http
    name: POST envelope
    signature: "POST /app/user/... | /app/machine/... | /machine/..."
    purpose: Cổng duy nhất; mọi route nhận cùng một khung phong bì HPKE
    input: "JSON phong bì {pv, route, method, receiver, kid, send_id, sent_at_ms, machine_key_id, enc, ct, sig}, ≤ HTTP_MAX_BYTES"
    output: "JSON {pv:1, send_id, status, nonce, ct}"
    errors: [INVALID_ENVELOPE 400/404, UNSUPPORTED_VERSION 400, UNKNOWN_KEY 400, RATE_LIMITED 429]
  - id: tr_dispatch
    object: t_dispatch
    kind: function
    name: dispatch_request
    signature: "dispatch_request(path: str, payload: dict, context: RequestContext, *, deps, auth=None) -> HandlerResult"
    purpose: Tra handler theo route, gắn auth/machine vào context rồi gọi
    input: route, body đã giải mã, auth từ phong bì
    output: HandlerResult(status, {v:1, ok, data|error})
    errors: [INVALID_REQUEST 400, SESSION_EXPIRED 401, SERVICE_UNAVAILABLE 503, INTERNAL_ERROR 500]
  - id: sec_open
    object: security
    kind: function
    name: open_request
    signature: "open_request(path: str, envelope: dict, context: RequestContext, *, deps) -> OpenedRequest"
    purpose: Kiểm khung, chữ ký máy, giải HPKE, chặn phát lại
    input: "Phong bì {enc, ct, ...} với AAD = [1, path, 'POST', 'server', kid, send_id, sent_at_ms, machine_key_id]"
    output: "OpenedRequest(body, auth, route, send_id, response_key, machine); plaintext là JSON {auth, body}"
    errors: [INVALID_ENVELOPE 400, UNSUPPORTED_VERSION 400, UNKNOWN_KEY 400, RATE_LIMITED 429]
  - id: sec_close
    object: security
    kind: function
    name: close_response
    signature: "close_response(opened: OpenedRequest, result: HandlerResult) -> dict"
    purpose: Mã hoá phản hồi bằng response_key (AES-128-GCM, nonce ngẫu nhiên 12 byte)
    input: OpenedRequest, HandlerResult
    output: "{pv:1, send_id, status, nonce, ct}"
    errors: [RESPONSE_TOO_LARGE (ValueError)]
  - id: acc_login
    object: account
    kind: function
    name: login
    signature: "login(body, context, *, deps) -> HandlerResult"
    purpose: Đăng nhập email + mật khẩu (Argon2), cấp phiên
    input: "{email, password}"
    output: "{v:1, ok:true, data:{access_token, refresh_token, ...}}"
    errors: [AUTH_FAILED 401, RATE_LIMITED 429, INVALID_REQUEST 400]
  - id: relay_send
    object: relay
    kind: function
    name: command_send
    signature: "command_send(body, context, *, deps) -> HandlerResult"
    purpose: Đưa lệnh của app vào hàng chờ RAM của máy, chờ kết quả
    input: "{machine_id, request_id, instruction, data}"
    output: Kết quả máy trả qua result_send
    errors: [MACHINE_OFFLINE, RATE_LIMITED 429, INVALID_REQUEST 400]
  - {id: f_ask, object: fs_ask, kind: function, name: ask, signature: "ask(machineId, instruction, data, {requestId?, retry=false}) -> Future<MachineAnswer>", output: "MachineAnswer(ok, data|errorCode)"}
  - {id: f_seal, object: fk_seal, kind: function, name: sealRequest, signature: "sealRequest({route, body, access_token, sent_at_ms, kid, public_key}) -> {handle, envelope}"}
  - {id: hub_send, object: r_hub_send, kind: function, name: RelayHub.send, signature: "send(*, user_id, machine_id, request_id, instruction, data, retry, owner_lookup) -> HandlerResult", errors: [FORBIDDEN 403, BUSY 409, REQUEST_CONFLICT 409, REQUEST_GONE 410, MACHINE_OFFLINE 503]}
  - {id: hub_poll, object: r_hub_poll, kind: function, name: RelayHub.poll, signature: "poll(machine_id) -> {v, request_id, machine_id, instruction, data, remaining_ms} | None"}
  - {id: m_cmd, object: mm_handle, kind: function, name: Dispatcher.handle, signature: "handle(command) -> {ok:true, data} | {ok:false, error:{code, message?}}", errors: [COMMAND_EXPIRED, UNSUPPORTED_INSTRUCTION, INVALID_DATA, COMMAND_FAILED, MACHINE_READ_FAILED]}
  - {id: m_nhan, object: mn_nhan, kind: function, name: nhan_menu, signature: "nhan_menu({menu_version}) -> {status:'ok'|'up_to_date', menu_version, packet?}"}
  - {id: m_cap, object: mn_cap, kind: function, name: cap_nhat_menu, signature: "cap_nhat_menu({menu_version, thay_doi:[{drink_id, ...}]}) -> {status:'ok'|'conflict', menu_version, packet}"}

flows:
  - id: menu_refresh
    name: Làm mới menu (tab Sản phẩm)
    steps:
      - {connection: u_pull, text: Kéo RefreshIndicator}
      - {connection: fm_c1, text: "generation++, busy=true"}
      - {connection: fm_ask, payload: "('nhan_menu', {menu_version:0})"}
      - {connection: fs_send, text: authenticatedPost /app/machine/command/send, payload: "{v:1, request_id:uuid4 mới, machine_id, instruction:'nhan_menu', data:{menu_version:0}}"}
      - {connection: fc_seal, text: HPKE seal, interface: f_seal}
      - {connection: fc_seal, reverse: true, text: "{handle, envelope}; khoá phản hồi ở native"}
      - {connection: fc_net, text: POST /app/machine/command/send}
      - {at: t_do_post, text: "Content-Length hợp lệ, parse_json phong bì"}
      - {connection: t_c2, interface: sec_open}
      - {at: s_open, text: "kiểm khung, giải HPKE (AAD gắn route), chặn phát lại; app route: không chữ ký"}
      - {connection: t_c2, reverse: true, text: "OpenedRequest(body, auth:{access_token}, response_key)"}
      - {connection: t_c3, interface: tr_dispatch}
      - {connection: d_auth}
      - {connection: a_auth_tx}
      - {connection: a_auth_tx, reverse: true}
      - {connection: d_auth, reverse: true, text: "context.auth = user"}
      - {connection: d_send, text: "kiểm schema, instruction ∈ INSTRUCTIONS, lấy relay slot"}
      - {connection: rh_send, interface: hub_send}
      - {connection: rh_owner, text: "owner_of(machine_id) == user_id"}
      - {connection: rh_owner, reverse: true}
      - {at: r_hub_send, text: "máy online → Pending(request_id, deadline) trong RAM"}
      - {connection: rh_wake, text: "notify; thread app cond.wait tới khi có Terminal"}
      - {connection: rp_poll, reverse: true, text: long-poll đang mở của máy nhận lệnh, payload: "{v:1, request_id, machine_id, instruction:'nhan_menu', data, remaining_ms}"}
      - {connection: d_poll, reverse: true, text: "HandlerResult 200 {command}"}
      - {connection: t_c3, reverse: true}
      - {connection: t_c5, text: close_response bằng khoá của phong bì poll}
      - {connection: t_c5, reverse: true}
      - {connection: mc_net, reverse: true, text: trả 200 cho long-poll}
      - {connection: mc_open_c}
      - {connection: mc_open_c, reverse: true}
      - {connection: mc_pollc, reverse: true}
      - {connection: mm_pollc, reverse: true, text: command}
      - {connection: mm_h, text: "cache theo request_id; _run kiểm remaining_ms", interface: m_cmd}
      - {connection: mh_nhan, interface: m_nhan}
      - {connection: mn_r}
      - {connection: mn_rdb}
      - {connection: mn_rdb, reverse: true}
      - {connection: mn_r, reverse: true}
      - {connection: mn_p, text: "crc32 ≠ 0 nên đóng gói đầy đủ"}
      - {connection: mn_p, reverse: true, payload: "{status:'ok', menu_version, packet:base64(zlib(JSON{type:'menu_sync', fields, drinks}))}"}
      - {connection: mh_nhan, reverse: true}
      - {connection: mm_h, reverse: true, text: "{ok:true, data}"}
      - {connection: mm_res}
      - {connection: mc_resc}
      - {connection: mc_seal_c, text: HPKE + ký ECDSA bằng khoá máy}
      - {connection: mc_seal_c, reverse: true}
      - {connection: mc_net, text: POST /machine/result/send, payload: "{v:1, request_id, result:{ok:true, data}}"}
      - {connection: t_c2}
      - {connection: s_c1, text: verify_machine_signature trước HPKE}
      - {connection: s_c1, reverse: true}
      - {connection: t_c2, reverse: true, text: "OpenedRequest(machine)"}
      - {connection: t_c3}
      - {connection: d_res}
      - {connection: rr_hub}
      - {connection: rh_fin, text: "_finish: Terminal 200 {request_id, machine_id, source:'machine', received_at, result}"}
      - {connection: rh_owner, text: đọc lại quyền trước khi trả}
      - {connection: rh_owner, reverse: true}
      - {connection: rh_send, reverse: true}
      - {connection: d_send, reverse: true}
      - {connection: t_c3, reverse: true}
      - {connection: t_c5, text: close_response bằng khoá của phong bì app}
      - {connection: t_c5, reverse: true}
      - {connection: fc_net, reverse: true, payload: "{pv:1, send_id, status:200, nonce, ct}"}
      - {connection: fc_open}
      - {connection: fc_open, reverse: true, payload: "{v:1, ok:true, data:{request_id, machine_id, source, received_at, result}}"}
      - {connection: fs_send, reverse: true}
      - {connection: fm_ask, reverse: true, text: "kiểm request_id/machine_id/source → MachineAnswer"}
      - {connection: fm_apply_c, text: "decodeMenuPacket → List<Drink>, setState vẽ lại danh sách"}

  - id: login
    name: Đăng nhập (email + mật khẩu)
    steps:
      - {connection: u_login, text: nhập email + mật khẩu}
      - {connection: fa_c}
      - {connection: fa_post, text: "post /app/user/session/login, không access_token", payload: "{v:1, email, password}"}
      - {connection: fc_seal, interface: f_seal}
      - {connection: fc_seal, reverse: true}
      - {connection: fc_net, text: POST /app/user/session/login}
      - {at: t_do_post, text: parse_json phong bì}
      - {connection: t_c2, interface: sec_open}
      - {at: s_open, text: "kiểm khung, giải HPKE, chặn phát lại"}
      - {connection: t_c2, reverse: true, text: "OpenedRequest(auth:null)"}
      - {connection: t_c3, interface: tr_dispatch}
      - {connection: d_login, text: "route ẩn danh: auth phải null", interface: acc_login}
      - {at: a_login, text: "_reserve_login: rate limit theo IP"}
      - {connection: a_login_tx}
      - {connection: st_sql, text: "SELECT * FROM users WHERE email=%s"}
      - {connection: st_sql, reverse: true}
      - {connection: a_login_tx, reverse: true}
      - {at: a_login, text: "Argon2 verify (hash giả nếu không có user/chưa xác minh); _issue cấp access/refresh token"}
      - {connection: d_login, reverse: true, payload: "{v:1, ok:true, data:{access_token, refresh_token, ...}}"}
      - {connection: t_c3, reverse: true}
      - {connection: t_c5}
      - {connection: t_c5, reverse: true}
      - {connection: fc_net, reverse: true}
      - {connection: fc_open}
      - {connection: fc_open, reverse: true}
      - {connection: fa_post, reverse: true}
      - {connection: fa_save, text: SessionData.fromMap rồi saveSession qua native}

  - id: command
    name: Bật/tắt bán món (cap_nhat_menu)
    steps:
      - {connection: u_toggle}
      - {connection: fm_w, payload: "('cap_nhat_menu', {menu_version, thay_doi:[{drink_id, available}]})"}
      - {connection: fw_ask, text: "request_id giữ nguyên; retry=true chỉ khi thử lại sau TIMEOUT"}
      - {connection: fs_send, text: authenticatedPost /app/machine/command/send}
      - {connection: fc_seal, interface: f_seal}
      - {connection: fc_seal, reverse: true}
      - {connection: fc_net}
      - {connection: t_c2, interface: sec_open}
      - {at: s_open, text: giải HPKE}
      - {connection: t_c2, reverse: true}
      - {connection: t_c3}
      - {connection: d_auth}
      - {connection: d_auth, reverse: true}
      - {connection: d_send}
      - {connection: rh_send, interface: hub_send}
      - {at: r_hub_send, text: "Terminal cũ cùng (machine_id, request_id) → trả lại, không chạy lại lệnh ghi; khác fingerprint → REQUEST_CONFLICT"}
      - {connection: rh_wake}
      - {connection: rp_poll, reverse: true}
      - {connection: d_poll, reverse: true}
      - {connection: t_c3, reverse: true}
      - {connection: t_c5}
      - {connection: t_c5, reverse: true}
      - {connection: mc_net, reverse: true}
      - {connection: mc_open_c}
      - {connection: mc_open_c, reverse: true}
      - {connection: mc_pollc, reverse: true}
      - {connection: mm_pollc, reverse: true}
      - {connection: mm_h, interface: m_cmd}
      - {connection: mh_cap, interface: m_cap}
      - {connection: mn_cr}
      - {connection: mn_rdb}
      - {connection: mn_rdb, reverse: true}
      - {connection: mn_cr, reverse: true}
      - {at: mn_cap, text: "menu_version lệch → conflict, không ghi; khớp → check_changes cả gói"}
      - {connection: mn_u}
      - {connection: mn_udb, text: UPDATE trong cùng transaction}
      - {connection: mn_udb, reverse: true}
      - {connection: mn_u, reverse: true}
      - {connection: mn_cp}
      - {connection: mn_cp, reverse: true, payload: "{status:'ok'|'conflict', menu_version, packet}"}
      - {connection: mh_cap, reverse: true}
      - {connection: mm_h, reverse: true}
      - {connection: mm_res}
      - {connection: mc_resc}
      - {connection: mc_seal_c}
      - {connection: mc_seal_c, reverse: true}
      - {connection: mc_net, text: POST /machine/result/send}
      - {connection: t_c2}
      - {connection: s_c1}
      - {connection: s_c1, reverse: true}
      - {connection: t_c2, reverse: true}
      - {connection: t_c3}
      - {connection: d_res}
      - {connection: rr_hub}
      - {connection: rh_fin}
      - {connection: rh_send, reverse: true}
      - {connection: d_send, reverse: true}
      - {connection: t_c3, reverse: true}
      - {connection: t_c5}
      - {connection: t_c5, reverse: true}
      - {connection: fc_net, reverse: true}
      - {connection: fc_open}
      - {connection: fc_open, reverse: true}
      - {connection: fs_send, reverse: true}
      - {connection: fw_ask, reverse: true}
      - {connection: fm_w, reverse: true, text: MachineAnswer}
      - {connection: fm_ta, text: "_apply gói mới; status 'conflict' → SnackBar 'Menu trên máy vừa đổi'"}

  - id: register
    name: "Đăng ký tài khoản (gửi OTP)"
    steps:
      - {connection: u_register, text: "nhập email + mật khẩu ở chế độ Đăng ký"}
      - {connection: fa_reg_c}
      - {connection: fa_reg_post, payload: "{v:1, email, password}"}
      - {connection: fc_bootc, text: "chưa có giờ server hoặc quá 5 phút"}
      - {connection: fc_boot_net, text: "phong bì ẩn danh, timeout 5s"}
      - {at: t_do_post, text: "open_request như mọi route"}
      - {connection: t_c3}
      - {connection: d_boot, text: "rate limit theo IP"}
      - {connection: d_boot, reverse: true, payload: "{v:1, ok:true, data:{server_time_ms}}"}
      - {connection: t_c3, reverse: true}
      - {connection: fc_boot_net, reverse: true}
      - {connection: fc_bootc, reverse: true, text: "lưu server_time_ms để tính sent_at_ms"}
      - {connection: fc_seal}
      - {connection: fc_seal, reverse: true}
      - {connection: fc_net, text: "POST /app/user/account/register"}
      - {connection: t_c2}
      - {connection: t_c2, reverse: true, text: "OpenedRequest(auth:null)"}
      - {connection: t_c3}
      - {connection: d_reg}
      - {connection: a_reg_s}
      - {at: a_send, text: "_email_lock, _allow_recipient, _send_gate (cooldown, giới hạn email/IP)"}
      - {connection: a_send_tx, text: "user chưa có → INSERT users (Argon2); OTP 6 số → otp_generations status=sending"}
      - {connection: st_sql}
      - {connection: st_sql, reverse: true}
      - {connection: a_send_tx, reverse: true}
      - {connection: a_send_mail, text: "email đã xác minh → gửi thư thông báo thay vì OTP"}
      - {connection: ml_smtp}
      - {connection: ml_smtp, reverse: true}
      - {connection: a_send_mail, reverse: true}
      - {connection: a_send_tx, text: "generation cũ → consumed, mới → active"}
      - {connection: a_send_tx, reverse: true}
      - {connection: a_reg_s, reverse: true}
      - {connection: d_reg, reverse: true, payload: "{v:1, ok:true, data:{message:'CHECK_EMAIL', retry_after_seconds}}"}
      - {connection: t_c3, reverse: true}
      - {connection: t_c5}
      - {connection: t_c5, reverse: true}
      - {connection: fc_net, reverse: true}
      - {connection: fc_open}
      - {connection: fc_open, reverse: true}
      - {connection: fa_reg_post, reverse: true}
      - {connection: fa_reg_c, reverse: true, text: "retry_after_seconds"}
      - {connection: fa_to_otp, text: "mở OtpPage, đếm ngược nút gửi lại"}

  - id: otp_verify
    name: "Xác minh OTP đăng ký"
    steps:
      - {connection: u_otp}
      - {connection: fo_v}
      - {connection: fo_v_post, payload: "{v:1, email, otp}"}
      - {connection: fc_seal}
      - {connection: fc_seal, reverse: true}
      - {connection: fc_net, text: "POST /app/user/otp/verify"}
      - {connection: t_c2}
      - {connection: t_c2, reverse: true, text: "OpenedRequest(auth:null)"}
      - {connection: t_c3}
      - {connection: d_ver}
      - {connection: a_ver_tx, text: "SELECT user + generation active mới nhất FOR UPDATE"}
      - {connection: st_sql}
      - {connection: st_sql, reverse: true}
      - {connection: a_ver_tx, reverse: true}
      - {at: a_verify, text: "hết hạn → OTP_EXPIRED 410; sai → tăng registration_attempts, đủ ngưỡng → OTP_LOCKED 429; đúng → verified_at, generation consumed"}
      - {connection: d_ver, reverse: true, payload: "{v:1, ok:true, data:{verified:true}}"}
      - {connection: t_c3, reverse: true}
      - {connection: t_c5}
      - {connection: t_c5, reverse: true}
      - {connection: fc_net, reverse: true}
      - {connection: fc_open}
      - {connection: fc_open, reverse: true}
      - {connection: fo_v_post, reverse: true}
      - {connection: fo_v, reverse: true, text: "verified → về màn đăng nhập"}

  - id: otp_resend
    name: "Gửi lại mã OTP"
    steps:
      - {connection: u_resend, text: "chỉ bật khi hết đếm ngược"}
      - {connection: fo_s}
      - {connection: fo_s_post, payload: "{v:1, email}"}
      - {connection: fc_seal}
      - {connection: fc_seal, reverse: true}
      - {connection: fc_net, text: "POST /app/user/otp/send"}
      - {connection: t_c2}
      - {connection: t_c2, reverse: true, text: "OpenedRequest(auth:null)"}
      - {connection: t_c3}
      - {connection: d_otps}
      - {connection: a_otp_s}
      - {at: a_send, text: "_email_lock, _allow_recipient, _send_gate (cooldown, giới hạn email/IP)"}
      - {connection: a_send_tx, text: "user chưa có → INSERT users (Argon2); OTP 6 số → otp_generations status=sending"}
      - {connection: st_sql}
      - {connection: st_sql, reverse: true}
      - {connection: a_send_tx, reverse: true}
      - {connection: a_send_mail, text: "email đã xác minh → gửi thư thông báo thay vì OTP"}
      - {connection: ml_smtp}
      - {connection: ml_smtp, reverse: true}
      - {connection: a_send_mail, reverse: true}
      - {connection: a_send_tx, text: "generation cũ → consumed, mới → active"}
      - {connection: a_send_tx, reverse: true}
      - {connection: a_otp_s, reverse: true}
      - {connection: d_otps, reverse: true, text: "CHECK_EMAIL kể cả email không tồn tại"}
      - {connection: t_c3, reverse: true}
      - {connection: t_c5}
      - {connection: t_c5, reverse: true}
      - {connection: fc_net, reverse: true}
      - {connection: fc_open}
      - {connection: fc_open, reverse: true}
      - {connection: fo_s_post, reverse: true}
      - {connection: fo_s, reverse: true, text: "đặt lại đếm ngược theo retry_after_seconds"}

  - id: app_start
    name: "Mở app, khôi phục phiên"
    steps:
      - {connection: u_open}
      - {connection: fr_load}
      - {connection: fr_load, reverse: true, text: "không có phiên → AuthPage"}
      - {connection: fr_ref}
      - {connection: fref_post, payload: "{v:1, refresh_token}"}
      - {connection: fc_bootc, text: "chưa có giờ server hoặc quá 5 phút"}
      - {connection: fc_boot_net, text: "phong bì ẩn danh, timeout 5s"}
      - {at: t_do_post, text: "open_request như mọi route"}
      - {connection: t_c3}
      - {connection: d_boot, text: "rate limit theo IP"}
      - {connection: d_boot, reverse: true, payload: "{v:1, ok:true, data:{server_time_ms}}"}
      - {connection: t_c3, reverse: true}
      - {connection: fc_boot_net, reverse: true}
      - {connection: fc_bootc, reverse: true, text: "lưu server_time_ms để tính sent_at_ms"}
      - {connection: fc_seal}
      - {connection: fc_seal, reverse: true}
      - {connection: fc_net, text: "POST /app/user/session/refresh"}
      - {connection: t_c2}
      - {connection: t_c2, reverse: true, text: "OpenedRequest(auth:null)"}
      - {connection: t_c3}
      - {connection: d_ref}
      - {connection: a_ref_tx, text: "refresh_tokens + sessions FOR UPDATE"}
      - {connection: st_sql}
      - {connection: st_sql, reverse: true}
      - {connection: a_ref_tx, reverse: true}
      - {at: a_refresh, text: "token đã dùng ngoài grace → thu hồi cả phiên, SESSION_EXPIRED; hợp lệ → used_at, _issue cặp token mới (không vượt absolute)"}
      - {connection: d_ref, reverse: true, payload: "{v:1, ok:true, data:{access_token, refresh_token, user, ...}}"}
      - {connection: t_c3, reverse: true}
      - {connection: t_c5}
      - {connection: t_c5, reverse: true}
      - {connection: fc_net, reverse: true}
      - {connection: fc_open}
      - {connection: fc_open, reverse: true}
      - {connection: fref_post, reverse: true}
      - {connection: fref_save}
      - {connection: fref_save, reverse: true}
      - {connection: fr_ref, reverse: true, text: "401 → clear, về AuthPage; TIMEOUT/TRANSPORT_ERROR → vẫn vào dashboard"}
      - {connection: fr_clear, text: "chỉ khi 401"}

  - id: token_refresh
    name: "Tự làm mới token khi gặp SESSION_EXPIRED"
    steps:
      - {at: fc_send, text: "authenticatedPost nhận 401 SESSION_EXPIRED"}
      - {connection: fc_load}
      - {connection: fc_load, reverse: true, text: "phiên đã xoay bởi request khác → dùng luôn"}
      - {connection: fc_refresh, text: "_refreshing dùng chung, chỉ một refresh bay"}
      - {connection: fref_post, payload: "{v:1, refresh_token}"}
      - {connection: fc_seal}
      - {connection: fc_seal, reverse: true}
      - {connection: fc_net, text: "POST /app/user/session/refresh"}
      - {connection: t_c2}
      - {connection: t_c2, reverse: true, text: "OpenedRequest(auth:null)"}
      - {connection: t_c3}
      - {connection: d_ref}
      - {connection: a_ref_tx}
      - {connection: st_sql}
      - {connection: st_sql, reverse: true}
      - {connection: a_ref_tx, reverse: true}
      - {connection: d_ref, reverse: true}
      - {connection: t_c3, reverse: true}
      - {connection: t_c5}
      - {connection: t_c5, reverse: true}
      - {connection: fc_net, reverse: true}
      - {connection: fc_open}
      - {connection: fc_open, reverse: true}
      - {connection: fref_post, reverse: true}
      - {connection: fref_save}
      - {connection: fref_save, reverse: true}
      - {connection: fc_refresh, reverse: true, text: "refresh lỗi 401 → clear + onSessionExpired"}
      - {at: fc_send, text: "retryAfterRefresh → gửi lại route cũ với access_token mới, không thì ném lỗi"}

