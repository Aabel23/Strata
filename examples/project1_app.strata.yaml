      - {connection: t_c5}
      - {connection: t_c5, reverse: true}
      - {connection: fc_net, reverse: true}
      - {connection: fc_open}
      - {connection: fc_open, reverse: true}
      - {connection: fl_post, reverse: true}
      - {connection: fl_clear, text: "finally: luôn xoá phiên local"}
      - {connection: fl_clear, reverse: true}
      - {connection: fl_c, reverse: true, text: "về AuthPage; server lỗi → SnackBar"}

  - id: machine_list
    name: "Xem danh sách máy"
    steps:
      - {connection: u_machines}
