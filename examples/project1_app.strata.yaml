      - {connection: t_c2, reverse: true, text: "OpenedRequest(auth:null)"}
      - {connection: t_c3}
      - {connection: d_out}
      - {connection: a_out_tx, text: "tìm session_id theo hash refresh token, đặt revoked_at"}
      - {connection: st_sql}
      - {connection: st_sql, reverse: true}
      - {connection: a_out_tx, reverse: true}
      - {connection: d_out, reverse: true, payload: "{v:1, ok:true, data:{logged_out:true}}"}
