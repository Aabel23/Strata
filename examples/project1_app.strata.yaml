connections:
  - {id: use, from: user, to: flutter, name: Dùng app, technology: UI}
  - id: app_req
    from: flutter
    to: transport
    name: Gọi API
    technology: HTTPS + HPKE
    kind: network
    feature: Mọi màn hình của app (đăng nhập, danh sách máy, gửi lệnh)
    interface: transport_post
    description: App seal body vào phong bì HPKE rồi POST tới route tương ứng
    payload:
      request: "Phong bì {pv:1, route, method:'POST', receiver:'server', kid:'server-hpke-1', send_id, sent_at_ms, machine_key_id:null, enc, ct, sig:null}; plaintext {auth: {access_token}|null, body}"
      response: "{pv:1, send_id, status, nonce, ct}; plaintext {v:1, ok, data|error:{code}}"
  - id: m_poll
    from: machine
    to: transport
    name: Long-poll lệnh
    technology: HTTPS + HPKE
    kind: network
    feature: Máy nhận lệnh pha chế
    interface: transport_post
    description: Máy ký phong bì bằng khoá máy, POST /machine/command/poll và chờ tới khi có lệnh hoặc hết hạn
    payload:
      request: "Phong bì có machine_key_id và sig (ECDSA P-256); plaintext {auth:null, body:{v:1}}"
      response: "Lệnh đang chờ {request_id, instruction, data} hoặc rỗng khi hết hạn"
  - id: open
    from: transport
    to: security
    name: Mở/đóng phong bì
    technology: in-process
    kind: call
    interface: sec_open
    description: do_POST gọi open_request trước khi định tuyến, close_response sau khi handler trả kết quả
    payload:
      request: "path, envelope dict, RequestContext"
      response: "OpenedRequest(body, auth, route, send_id, response_key, machine)"
  - id: r_acc
    from: transport
    to: account
    name: Route auth
    technology: in-process
    kind: call
    feature: Đăng nhập bằng OTP
    interface: acc_login
    description: dispatch_request gọi handler account theo route /app/user/...
    payload: {request: "{email, password}", response: "HandlerResult {v:1, ok:true, data:{access_token, refresh_token, ...}}"}
  - {id: r_dev, from: transport, to: device, name: Route máy, technology: in-process}
  - id: r_rel
    from: transport
    to: relay
    name: Route lệnh
    technology: in-process
    kind: call
    feature: Gửi lệnh pha chế
    interface: relay_send
    description: dispatch_request đưa lệnh của app vào RelayHub; máy lấy ra qua command_poll
    payload: {request: "{machine_id, request_id, instruction, data}", response: "Kết quả máy trả về hoặc lỗi MACHINE_OFFLINE/timeout"}
  # level 4: luồng gọi nội bộ
  - {id: t_c1, from: t_do_post, to: s_parse, name: parse body, kind: call, technology: in-process, description: Body thô → dict phong bì; lỗi thì INVALID_ENVELOPE 400}
  - {id: t_c2, from: t_do_post, to: s_open, name: open_request, kind: call, technology: in-process, description: Mở phong bì; ApiError trả thẳng mã công khai}
  - {id: t_c3, from: t_do_post, to: t_dispatch, name: dispatch_request, kind: call, technology: in-process, interface: tr_dispatch, description: Định tuyến body đã giải mã}
  - {id: t_c4, from: t_dispatch, to: t_error, name: đổi lỗi, kind: call, technology: in-process, description: ApiError/RetryableTransaction → HandlerResult}
  - {id: t_c5, from: t_do_post, to: s_close, name: close_response, kind: call, technology: in-process, description: Mã hoá HandlerResult trước khi trả}
  - {id: s_c1, from: s_open, to: s_verify, name: kiểm chữ ký máy, kind: call, technology: in-process, description: "Chỉ với machine route, trước HPKE"}
  - {id: s_c2, from: s_open, to: s_parse, name: parse plaintext, kind: call, technology: in-process, description: "Plaintext → {auth, body}"}
  - {id: s_c3, from: t_create, to: s_load, name: nạp khoá, kind: call, technology: in-process, description: Khoá HPKE nằm trong deps.keys từ lúc khởi động}
  - {id: acc_db, from: account, to: storage, name: Đọc/ghi tài khoản, technology: in-process}
  - {id: dev_db, from: device, to: storage, name: Đọc/ghi máy, technology: in-process}
  - {id: acc_mail, from: account, to: mail, name: Gửi OTP, technology: in-process}
  - {id: sql, from: storage, to: mysql, name: SQL, technology: MySQL protocol}
  - {id: smtp, from: mail, to: gmail, name: Gửi thư, technology: SMTP/TLS}
  # level 4: server
  - {id: d_auth, from: t_dispatch, to: a_auth, name: kiểm access_token, kind: call, technology: in-process, description: Chỉ với user route; gắn context.auth}
  - {id: d_login, from: t_dispatch, to: a_login, name: login, kind: call, technology: in-process}
  - {id: d_send, from: t_dispatch, to: r_cmd_send, name: command_send, kind: call, technology: in-process}
  - {id: d_poll, from: t_dispatch, to: r_cmd_poll, name: command_poll, kind: call, technology: in-process}
  - {id: d_res, from: t_dispatch, to: r_result, name: result_send, kind: call, technology: in-process}
  - {id: a_login_tx, from: a_login, to: st_tx, name: đọc user, kind: call, technology: in-process}
  - {id: a_auth_tx, from: a_auth, to: st_tx, name: tra phiên, kind: call, technology: in-process}
  - {id: owner_tx, from: d_owner, to: st_tx, name: đọc chủ máy, kind: call, technology: in-process}
  - {id: st_sql, from: st_tx, to: mysql, name: SQL, kind: network, technology: MySQL protocol}
  - {id: rh_send, from: r_cmd_send, to: r_hub_send, name: RelayHub.send, kind: call, technology: in-process}
  - {id: rh_owner, from: r_hub_send, to: d_owner, name: owner_lookup, kind: call, technology: in-process, description: Kiểm trước khi xếp lệnh và kiểm lại trước khi trả kết quả}
  - {id: rh_wake, from: r_hub_send, to: r_hub_poll, name: notify Pending, kind: queue, technology: threading.Condition, description: Pending mới đánh thức long-poll đang chờ của máy}
  - {id: rp_poll, from: r_cmd_poll, to: r_hub_poll, name: RelayHub.poll, kind: call, technology: in-process}
  - {id: rr_hub, from: r_result, to: r_hub_result, name: RelayHub.result, kind: call, technology: in-process}
  - {id: rh_fin, from: r_hub_result, to: r_hub_send, name: _finish notify, kind: queue, technology: threading.Condition, description: "Terminal sẵn sàng, thread của app thức dậy"}
  # level 4: Flutter
  - {id: u_pull, from: user, to: fm_reload, name: kéo để làm mới, technology: UI RefreshIndicator}
