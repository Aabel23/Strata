  - id: machine_claim
    name: "Nhận máy (QR + BLE + activate)"
    steps:
      - {connection: u_scan}
      - {at: fr_page, text: "SealedQr.parse {v:1, type:flexmix-sealed, serial, seal_code}"}
      - {connection: frp_run}
      - {connection: fr_ble, text: "ensurePermissions, start(serial, seal_code), probe"}
      - {connection: fr_ble_net, text: "probe trong phiên mã hoá từ seal_code"}
      - {at: mp_handle, text: "AUTHENTICATED; trả machine_public_key, machine_id, online"}
      - {connection: fr_ble_net, reverse: true}
      - {connection: fr_ble, reverse: true, text: "online=false → hỏi Wi-Fi, gửi stage wifi rồi chờ máy lên mạng"}
      - {connection: fr_begin}
      - {connection: ms_begin_post, payload: "{v:1, step:'begin', serial}"}
      - {connection: fc_seal}
      - {connection: fc_seal, reverse: true}
      - {connection: fc_net, text: "POST /app/user/machine/activate"}
      - {connection: t_c2}
      - {connection: t_c2, reverse: true, text: "OpenedRequest(auth:{access_token})"}
      - {connection: t_c3}
      - {connection: d_auth}
      - {connection: a_auth_tx}
      - {connection: a_auth_tx, reverse: true}
      - {connection: d_auth, reverse: true, text: "context.auth = user"}
      - {connection: d_act}
      - {connection: d_act_b}
      - {connection: d_begin_tx, text: "không có serial → MACHINE_UNTRUSTED; đã có chủ → ALREADY_OWNED; INSERT claim_challenges"}
      - {connection: st_sql}
      - {connection: st_sql, reverse: true}
      - {connection: d_begin_tx, reverse: true}
      - {at: d_begin, text: "ký challenge_bytes bằng khoá ký server"}
      - {connection: d_act_b, reverse: true}
      - {connection: d_act, reverse: true, payload: "{claim_id, machine_id, challenge, server_challenge_signature}"}
      - {connection: t_c3, reverse: true}
      - {connection: t_c5}
      - {connection: t_c5, reverse: true}
      - {connection: fc_net, reverse: true}
      - {connection: fc_open}
      - {connection: fc_open, reverse: true}
      - {connection: ms_begin_post, reverse: true}
      - {connection: fr_begin, reverse: true, text: "ClaimChallenge"}
      - {connection: fr_ble, text: "claim(challenge, signature)"}
      - {connection: fr_ble_net, text: "stage claim"}
      - {connection: mp_c}
      - {at: mp_claim, text: "verify chữ ký server, kiểm machine_id, ký accept_bytes(challenge, session_id) bằng khoá máy"}
      - {connection: mp_c, reverse: true, payload: "{claim_id, local_session_binding, machine_proof}"}
      - {connection: fr_ble_net, reverse: true}
      - {connection: fr_ble, reverse: true}
      - {connection: fr_complete}
      - {connection: ms_complete_post, payload: "{v:1, step:'complete', claim_id, machine_proof, local_session_binding}"}
      - {connection: fc_seal}
      - {connection: fc_seal, reverse: true}
      - {connection: fc_net, text: "POST /app/user/machine/activate"}
      - {connection: t_c2}
      - {connection: t_c2, reverse: true, text: "OpenedRequest(auth:{access_token})"}
      - {connection: t_c3}
      - {connection: d_auth}
      - {connection: a_auth_tx}
      - {connection: a_auth_tx, reverse: true}
      - {connection: d_auth, reverse: true, text: "context.auth = user"}
      - {connection: d_act}
      - {connection: d_act_c}
      - {connection: d_complete_tx, text: "claim → device FOR UPDATE; đã consumed cùng binding → trả lại kết quả cũ"}
      - {connection: st_sql}
      - {connection: st_sql, reverse: true}
      - {connection: d_complete_tx, reverse: true}
      - {at: d_complete, text: "hết hạn → CLAIM_EXPIRED; verify_machine_signature sai → CLAIM_PROOF_INVALID; gán owner_user_id, consumed_at, audit owner_claim"}
      - {connection: d_act_c, reverse: true}
      - {connection: d_act, reverse: true, payload: "{v:1, ok:true, data:{machine:{id, serial, name, role:'owner'}}}"}
      - {connection: t_c3, reverse: true}
      - {connection: t_c5}
      - {connection: t_c5, reverse: true}
      - {connection: fc_net, reverse: true}
      - {connection: fc_open}
      - {connection: fc_open, reverse: true}
      - {connection: ms_complete_post, reverse: true}
      - {connection: fr_complete, reverse: true, text: "TIMEOUT/TRANSPORT_ERROR → gửi lại đúng claim_id một lần"}
      - {connection: frp_run, reverse: true, text: "finally đóng phiên BLE"}
      - {connection: fr_added}
      - {connection: fmc_added_ref}

