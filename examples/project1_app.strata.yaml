# Strata model cho project1_app (máy pha + app + server)
name: project1_app
root: ../../../internproj/project1_app   # gốc để kiểm tra link code
layout: LR

tags:
  security: {color: "#f04438"}
  ram-only: {color: "#f79009"}

objects:
  - {id: user, type: actor, name: Người dùng, description: Chủ máy hoặc người được chia sẻ máy}
  - {id: machine, type: system, name: Máy pha, description: Máy pha chế; long-poll server để nhận lệnh}
  - {id: gmail, type: system, name: Gmail SMTP, description: Dịch vụ gửi thư bên ngoài}

  - {id: platform, type: system, name: Nền tảng project1, description: App di động và server cloud}
  - id: flutter
    type: app
    parent: platform
    name: Flutter app
    technology: Flutter/Dart
    description: App điều khiển máy, đăng nhập, quản lý menu và chia sẻ
    links: [flutter_app/lib/main.dart]
  - id: server
    type: app
    parent: platform
    name: Cloud server
    technology: Python http.server
    description: Điểm vào HTTP/HTTPS, mọi body nằm trong phong bì HPKE
    links: [server/main.py]
  - {id: mysql, type: store, parent: platform, name: MySQL, technology: MySQL, links: [server/migrations/001_accounts.sql, server/migrations/002_devices_sessions.sql], description: "Tài khoản, phiên, danh bạ máy"}

  - id: transport
    type: component
    parent: server
    name: transport
    technology: http
    links: [server/src/transport/http.py]
    description: Cổng HTTP và định tuyến; ghép các khối khác
    state: stateless
    responsibilities:
      - Nhận POST, kiểm Content-Length (chỉ một header, không chunked, ≤ HTTP_MAX_BYTES)
      - Nhờ security mở phong bì, rồi định tuyến body theo route tới account/device/relay
      - Kiểm auth trong phong bì cho user route (access_token), máy đã ký cho machine route
      - Đổi mọi lỗi thành {v:1, ok:false, error:{code}}; lỗi nội bộ thành INTERNAL_ERROR 500
  - id: security
    type: component
    parent: server
    name: security
    technology: HPKE
    tags: [security]
    links: [server/src/security/cloud_protection.py]
    description: Mở/đóng phong bì HPKE (X25519/HKDF-SHA256/AES-128-GCM)
    state: RAM-only (replay cache theo (kid, send_id))
    responsibilities:
      - Kiểm khung phong bì (pv, kid, route, send_id UUIDv4, sent_at_ms trong độ lệch đồng hồ)
      - Kiểm chữ ký ECDSA P-256 của máy trước khi tốn công giải HPKE
      - Giải HPKE với AAD gắn route/kid/send_id, chặn phát lại
      - Mã hoá phản hồi bằng khoá xuất từ ngữ cảnh HPKE (AES-GCM)

  # level 4: code của transport
  - {id: t_http, type: file, parent: transport, name: http.py, technology: Python, links: [server/src/transport/http.py], description: "ThreadingHTTPServer, Handler.do_POST và bảng định tuyến"}
  - {id: t_do_post, type: function, parent: t_http, name: Handler.do_POST, links: [server/src/transport/http.py], description: "Đọc body, gọi open_request, dispatch_request, close_response"}
  - {id: t_dispatch, type: function, parent: t_http, name: dispatch_request, links: [server/src/transport/http.py], description: "Tra handler theo route, kiểm auth, gọi handler, đổi lỗi thành HandlerResult"}
  - {id: t_error, type: function, parent: t_http, name: _error, links: [server/src/transport/http.py], description: "ApiError → HandlerResult {v:1, ok:false, error:{code}}"}
  - {id: t_create, type: function, parent: t_http, name: create_app, links: [server/src/transport/http.py], description: "Dựng server, bọc TLS khi transport=https"}
  # level 4: code của security
  - {id: s_cloud, type: file, parent: security, name: cloud_protection.py, technology: Python, links: [server/src/security/cloud_protection.py], description: "Mở/đóng phong bì, danh sách route"}
  - {id: s_keys, type: file, parent: security, name: crypto_keys.py, technology: Python, links: [server/src/security/crypto_keys.py], description: "Nạp khoá HPKE của server, base64url"}
  - {id: s_open, type: function, parent: s_cloud, name: open_request, links: [server/src/security/cloud_protection.py], description: "Kiểm khung, chữ ký, giải HPKE, chặn phát lại"}
  - {id: s_verify, type: function, parent: s_cloud, name: verify_machine_signature, links: [server/src/security/cloud_protection.py], description: ECDSA P-256 low-S trên machine_envelope_bytes}
  - {id: s_close, type: function, parent: s_cloud, name: close_response, links: [server/src/security/cloud_protection.py], description: AES-GCM với response_key xuất từ HPKE}
  - {id: s_parse, type: function, parent: s_cloud, name: parse_json, links: [server/src/security/cloud_protection.py], description: "JSON chặt (không trùng key, không NaN)"}
  - {id: s_load, type: function, parent: s_keys, name: load_server_keys, links: [server/src/security/crypto_keys.py], description: Đọc khoá riêng HPKE từ file cấu hình}
  - {id: account, type: component, parent: server, name: account, links: [server/src/account/account.py], description: "Đăng ký, OTP, đăng nhập, phiên"}
  - {id: device, type: component, parent: server, name: device, links: [server/src/device/devices.py], description: Danh bạ máy và quy trình claim}
  - {id: relay, type: component, parent: server, name: relay, tags: [ram-only], links: [server/src/relay/relay.py], description: Chuyển lệnh app → máy → app; trạng thái chỉ trong RAM}
  - {id: storage, type: component, parent: server, name: storage, technology: MySQL driver, links: [server/src/storage/database.py], description: Mỗi giao dịch một kết nối riêng}
  - {id: mail, type: component, parent: server, name: mail, links: [server/src/mail/smtp_mail.py], description: Gửi OTP qua Gmail SMTP}
  # level 4: code phía server cho relay/account/device/storage
  - {id: a_login, type: function, parent: account, name: login, links: [server/src/account/account.py], description: "Kiểm email+mật khẩu (Argon2, hash giả nếu không có user), rate limit theo IP, _issue cấp token"}
  - {id: a_auth, type: function, parent: account, name: authenticate_access, links: [server/src/account/account.py], description: access_token → user_id; hết hạn thì SESSION_EXPIRED}
  - {id: d_owner, type: function, parent: device, name: owner_of, links: [server/src/device/devices.py], description: Chủ hiện tại của machine_id (đọc MySQL)}
  - {id: st_tx, type: function, parent: storage, name: transaction, links: [server/src/storage/database.py], description: "Mở kết nối riêng, commit/rollback, đóng"}
  - {id: r_file, type: file, parent: relay, name: relay.py, technology: Python, links: [server/src/relay/relay.py], description: RelayHub (RAM) và 3 route handler}
  - {id: r_cmd_send, type: function, parent: r_file, name: command_send, links: [server/src/relay/relay.py], description: "Kiểm schema, instruction ∈ INSTRUCTIONS, data ≤ RELAY_DATA_MAX_BYTES, lấy relay slot"}
  - {id: r_cmd_poll, type: function, parent: r_file, name: command_poll, links: [server/src/relay/relay.py], description: "Long-poll của máy; trả {command} hoặc null"}
  - {id: r_result, type: function, parent: r_file, name: result_send, links: [server/src/relay/relay.py], description: "Kiểm result {ok,data}|{ok:false,error}, giao cho RelayHub"}
  - {id: r_hub_send, type: function, parent: r_file, name: RelayHub.send, links: [server/src/relay/relay.py], description: "Kiểm chủ máy, chống lặp theo (machine_id, request_id), tạo Pending, chờ terminal"}
  - {id: r_hub_poll, type: function, parent: r_file, name: RelayHub.poll, links: [server/src/relay/relay.py], description: "Poll mới nhất thắng; giao Pending chưa giao, đánh dấu online"}
  - {id: r_hub_result, type: function, parent: r_file, name: RelayHub.result, links: [server/src/relay/relay.py], description: "Khớp request_id đang chờ, _finish lưu Terminal và notify"}

