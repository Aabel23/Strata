  - {id: fc_seal, from: fc_send, to: fk_seal, name: sealRequest, kind: call, technology: MethodChannel, interface: f_seal}
  - {id: fc_open, from: fc_send, to: fk_open, name: openResponse, kind: call, technology: MethodChannel}
  - {id: fc_net, from: fc_send, to: t_do_post, name: POST phong bì, kind: network, technology: HTTPS + HPKE, description: Bản level 4 của app_req}
  # level 4: máy
